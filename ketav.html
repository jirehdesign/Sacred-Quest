      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(165, 180, 252, 0.15);

    .gold-gradient-text {

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Combat Animations */
    @keyframes floatIdle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @keyframes lungeRight {
      0% { transform: translateX(0) scale(1); }
      40% { transform: translateX(48px) scale(1.08); }
      100% { transform: translateX(0) scale(1); }
    }

    @keyframes lungeLeft {
      0% { transform: translateX(0) scale(1); }
      40% { transform: translateX(-48px) scale(1.08); }
      100% { transform: translateX(0) scale(1); }
    }

    @keyframes hitShake {
      0%, 100% { transform: translateX(0); filter: brightness(1); }
      20% { transform: translateX(-10px); filter: brightness(2.2) saturate(2); }
      40% { transform: translateX(10px); filter: brightness(1.6); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(7px); }
    }

    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 3px); }
      40% { transform: translate(6px, -3px); }
      60% { transform: translate(-4px, -2px); }
      80% { transform: translate(4px, 2px); }
    }

    @keyframes floatUpFade {
      0% { opacity: 1; transform: translateY(0) scale(0.85); }
      25% { opacity: 1; transform: translateY(-16px) scale(1.12); }
      100% { opacity: 0; transform: translateY(-56px) scale(0.95); }
    }

    @keyframes pulseAura {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.45)); }
      50% { filter: drop-shadow(0 0 18px rgba(251, 191, 36, 0.7)); }
    }

    .animate-idle { animation: floatIdle 3s ease-in-out infinite; }
    .animate-lunge-right { animation: lungeRight 0.42s cubic-bezier(0.22, 1, 0.36, 1); }
    .animate-lunge-left { animation: lungeLeft 0.42s cubic-bezier(0.22, 1, 0.36, 1); }
    .animate-hit { animation: hitShake 0.42s ease-in-out; }
    .animate-screen-shake { animation: screenShake 0.35s ease-in-out; }
    .animate-boss-aura { animation: pulseAura 2.4s ease-in-out infinite; }

    .floating-popup {
      position: absolute;
      pointer-events: none;

    // 2. PROCEDURAL WEB AUDIO API SOUND ENGINE (ZERO EXTERNAL FILES)
    // ----------------------------------------------------------------------------
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      ensureContext() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playTone(freq, type = 'sine', duration = 0.15, volume = 0.14, delay = 0, slideTo = null) {
        if (this.muted) return;
        this.ensureContext();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
        }

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      click() {
        this.playTone(520, 'triangle', 0.06, 0.08, 0, 380);
      }

      swordSlash() {
        this.playTone(680, 'sawtooth', 0.14, 0.12, 0, 140);
        this.playTone(220, 'square', 0.18, 0.1, 0.03, 75);
      }

      critStrike() {
        this.playTone(587.33, 'triangle', 0.18, 0.16, 0, 880);
        this.playTone(880, 'sine', 0.28, 0.16, 0.07, 1174.66);
        this.playTone(180, 'sawtooth', 0.22, 0.14, 0.02, 65);
      }

      magicCast() {
        const notes = [440, 554.37, 659.25, 880];
        notes.forEach((n, idx) => {
          this.playTone(n, 'sine', 0.22, 0.11, idx * 0.055);
        });
      }

      enemyHit() {
        this.playTone(150, 'sawtooth', 0.24, 0.18, 0, 55);
        this.playTone(110, 'square', 0.2, 0.14, 0.04, 48);
      }

      heal() {
        const notes = [392.00, 493.88, 587.33, 783.99];
        notes.forEach((n, idx) => {
          this.playTone(n, 'triangle', 0.25, 0.12, idx * 0.07);
        });
      }

      gold() {
        this.playTone(987.77, 'sine', 0.1, 0.12, 0);
        this.playTone(1318.51, 'sine', 0.22, 0.13, 0.08);
      }

      levelUp() {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((n, idx) => {
          this.playTone(n, 'triangle', 0.3, 0.16, idx * 0.11);

        this.playTone(95, 'sawtooth', 0.55, 0.2, 0, 42);
        this.playTone(72, 'square', 0.5, 0.14, 0.08, 36);
      }
    }

    // 3. HEBREW TEXT UTILITIES & WEB SPEECH API (he-IL)
    // ----------------------------------------------------------------------------
    /**
     * Strips Unicode Hebrew cantillation & Nikud vowel points (\u0591-\u05C7)
     * when the player toggles off Nikud for advanced reading practice.
     */
    function formatHebrew(text, showNikud) {
      if (!text) return '';
      return showNikud ? text : text.replace(/[\u0591-\u05C7]/g, '');
    }

    const SpeechManager = {
      available: typeof window !== 'undefined' && 'speechSynthesis' in window,
      hebrewVoice: null,

      init() {
        if (!this.available) return;
        const loadVoices = () => {
          const voices = window.speechSynthesis.getVoices();
          this.hebrewVoice =
            voices.find(v => v.lang && v.lang.toLowerCase().startsWith('he')) ||
            voices.find(v => v.name && v.name.toLowerCase().includes('hebrew')) ||
            null;
          updateSpeechBadge();
        };
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
      },

      speak(hebrewText, onStateChange = null) {
        if (!this.available) {
          showToast('Browser speech synthesis unavailable — use Peek Transliteration!', 'amber');
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(hebrewText);
          utterance.lang = 'he-IL';
          if (this.hebrewVoice) {
            utterance.voice = this.hebrewVoice;
          }
          utterance.rate = 0.86; // Clear learner cadence
          utterance.pitch = 1.0;

          if (onStateChange) onStateChange(true);
          utterance.onend = () => {
            if (onStateChange) onStateChange(false);
          };
          utterance.onerror = () => {
            if (onStateChange) onStateChange(false);
            showToast('Audio voice unavailable on this device — check Transliteration hint.', 'slate');
          };

          window.speechSynthesis.speak(utterance);
        } catch (err) {
          if (onStateChange) onStateChange(false);
        }
      }
    };

    // ----------------------------------------------------------------------------
    // 5. GAME STATE & PERSISTENT LOCALSTORAGE MANAGEMENT
    // ----------------------------------------------------------------------------
    const STORAGE_KEY = 'ketav_quest_save_v1';

    function createInitialWordProgress() {
      const progress = {};
      VOCABULARY.forEach(w => {
        progress[w.id] = {
          discovered: false,
          attempts: 0,
          correct: 0,
          mastery: 0, // 0 to 3 stars
          weight: 5   // Higher weight = appears more often in Spaced Repetition
        };
      });
      return progress;
    }

    function createDefaultState() {
      return {
        initialized: false,
        hero: {
          name: 'Ari',
          heroClass: 'knight',
          level: 1,
          xp: 0,
          xpToNext: 100,
          hp: 120,
          maxHp: 120,
          gold: 40,
          weaponLevel: 1,
          armorLevel: 1
        },
        inventory: {
          potions: 2,
          scrolls: 2,
          tonics: 1
        },
        settings: {
          showNikud: true,
          muted: false
        },
        realmProgress: {
          1: { encountersCleared: 0, bossDefeated: false },
          2: { encountersCleared: 0, bossDefeated: false },
          3: { encountersCleared: 0, bossDefeated: false },
          4: { encountersCleared: 0, bossDefeated: false },
          5: { encountersCleared: 0, bossDefeated: false }
        },
        wordProgress: createInitialWordProgress(),
        stats: {
          totalAnswered: 0,
          totalCorrect: 0,
          bestCombo: 0,
          monstersSlain: 0
        }
      };
    }

    let state = loadState();

    // Ephemeral UI & Combat State (not saved mid-swing)
    let ui = {
      screen: state.initialized ? 'map' : 'creation', // 'creation' | 'map' | 'combat' | 'merchant' | 'grimoire'
      selectedClass: 'knight',
      heroNameInput: 'Ari',
      grimoireFilterRealm: 'all',
      grimoireFilterMastery: 'all',
      grimoireSearch: '',
      isSpeaking: false,
      combat: null
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultState();
        const parsed = JSON.parse(raw);
        const def = createDefaultState();
        // Merge safely to ensure forward compatibility
        return {
          ...def,
          ...parsed,
          hero: { ...def.hero, ...(parsed.hero || {}) },
          inventory: { ...def.inventory, ...(parsed.inventory || {}) },
          settings: { ...def.settings, ...(parsed.settings || {}) },
          realmProgress: { ...def.realmProgress, ...(parsed.realmProgress || {}) },
          wordProgress: { ...def.wordProgress, ...(parsed.wordProgress || {}) },
          stats: { ...def.stats, ...(parsed.stats || {}) }
        };
      } catch (e) {
        return createDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Ignore storage quota issues gracefully
      }
    }

    // Apply initial audio mute state
    sfx.muted = !!state.settings.muted;

    // ----------------------------------------------------------------------------
    // 6. STAT CALCULATORS & SPACED REPETITION ENGINE
    // ----------------------------------------------------------------------------
    function calculateMaxHp() {
      const base = 90 + (state.hero.level - 1) * 18 + (state.hero.armorLevel - 1) * 25;
      return state.hero.heroClass === 'knight' ? Math.round(base * 1.2) : base;
    }

    function calculateBaseAttack() {
      const base = 18 + (state.hero.level - 1) * 4 + (state.hero.weaponLevel - 1) * 7;
      return state.hero.heroClass === 'knight' ? Math.round(base * 1.2) : base;
    }

    function getMasteredCount(realmId = null) {
      return VOCABULARY.filter(w => {
        if (realmId && w.realm !== realmId) return false;
        return (state.wordProgress[w.id]?.mastery || 0) >= 3;
      }).length;
    }

    function getDiscoveredCount(realmId = null) {
      return VOCABULARY.filter(w => {
        if (realmId && w.realm !== realmId) return false;
        return !!state.wordProgress[w.id]?.discovered;
      }).length;
    }

    /**
     * Weighted Spaced Repetition Picker:
     * Selects a word from the current realm (plus occasional review words from unlocked realms)
     * prioritizing missed or unmastered words.
     */
    function pickNextWord(realmId, excludeWordId = null) {
      let pool = VOCABULARY.filter(w => w.realm === realmId && w.id !== excludeWordId);

      // 20% chance to weave in a non-mastered word from an earlier realm for spaced review
      if (realmId > 1 && Math.random() < 0.2) {
        const reviewCandidates = VOCABULARY.filter(
          w => w.realm < realmId && w.id !== excludeWordId && (state.wordProgress[w.id]?.mastery || 0) < 3
        );
        if (reviewCandidates.length > 0) {
          pool = reviewCandidates;
        }
      }

      const weightedItems = pool.map(word => {
        const wp = state.wordProgress[word.id] || { weight: 5, mastery: 0 };
        const effectiveWeight = Math.max(1, wp.weight);
        return { word, weight: effectiveWeight };
      });

      const totalWeight = weightedItems.reduce((sum, item) => sum + item.weight, 0);
      let roll = Math.random() * totalWeight;
      for (const item of weightedItems) {
        roll -= item.weight;
        if (roll <= 0) return item.word;
      }
      return weightedItems[0].word;
    }

    /**
     * Generates 4 multiple-choice options (1 correct + 3 smart distractors matching Part of Speech)
     */
    function generateChoices(targetWord, isCounterGlyph) {
      const samePosPool = VOCABULARY.filter(
        w => w.id !== targetWord.id && w.pos === targetWord.pos && w.meaning !== targetWord.meaning
      );
      const fallbackPool = VOCABULARY.filter(
        w => w.id !== targetWord.id && w.meaning !== targetWord.meaning
      );

      const sourcePool = samePosPool.length >= 3 ? samePosPool : fallbackPool;
      const shuffledDistractors = [...sourcePool].sort(() => Math.random() - 0.5).slice(0, 3);

      const options = [targetWord, ...shuffledDistractors].sort(() => Math.random() - 0.5);
      return options.map(opt => ({
        wordId: opt.id,
        label: isCounterGlyph ? opt.hebrew : opt.meaning,
        isCorrect: opt.id === targetWord.id,
        eliminated: false
      }));
    }

    // ----------------------------------------------------------------------------
    // 7. UI FEEDBACK HELPERS (TOASTS, MODALS, FLOATING POPUPS)
    // ----------------------------------------------------------------------------
    function showToast(message, tone = 'amber') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toneClasses = {
        amber: 'border-amber-400/50 bg-slate-900/95 text-amber-200',
        emerald: 'border-emerald-400/50 bg-slate-900/95 text-emerald-200',
        rose: 'border-rose-400/50 bg-slate-900/95 text-rose-200',
        indigo: 'border-indigo-400/50 bg-slate-900/95 text-indigo-200',
        slate: 'border-slate-600 bg-slate-900/95 text-slate-200'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-2.5 rounded-xl border text-xs sm:text-sm font-medium shadow-xl transition-all duration-300 transform translate-y-2 opacity-0 ${toneClasses[tone] || toneClasses.amber}`;
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function openModal(htmlContent) {
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      content.innerHTML = htmlContent;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function spawnFloatingText(targetElementId, text, colorClass = 'text-amber-300') {
      const target = document.getElementById(targetElementId);
      if (!target) return;
      const el = document.createElement('div');
      el.className = `floating-popup font-display font-extrabold text-lg sm:text-2xl ${colorClass}`;
      el.style.left = '50%';
      el.style.top = '22%';
      el.style.transform = 'translateX(-50%)';
      el.textContent = text;
      target.appendChild(el);
      setTimeout(() => el.remove(), 1150);
    }

    function updateSpeechBadge() {
      const badge = document.getElementById('speech-status-badge');
      if (!badge) return;
      if (!SpeechManager.available) {
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-slate-500"></span> Speech API Unavailable`;
      } else if (SpeechManager.hebrewVoice) {
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Hebrew Audio Ready (he-IL)`;
      } else {
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400"></span> Web Speech Active (he-IL)`;
      }
    }

    // ----------------------------------------------------------------------------
    // 8. COMBAT ENGINE & ENCOUNTER FLOW
    // ----------------------------------------------------------------------------
    function startEncounter(realmId, isBossBattle = false) {
      const realm = REALMS.find(r => r.id === realmId);
      if (!realm) return;

      // Ensure hero HP is topped up to at least 60% if entering a new battle low, or keep current
      state.hero.maxHp = calculateMaxHp();
      if (state.hero.hp <= 0) {
        state.hero.hp = state.hero.maxHp;
      }

      const template = isBossBattle
        ? realm.boss
        : realm.monsters[Math.floor(Math.random() * realm.monsters.length)];

      // Slight scaling based on player level so combat stays brisk & exciting
      const levelScale = 1 + (state.hero.level - 1) * 0.08;
      const enemyMaxHp = Math.round(template.baseHp * levelScale);
      const enemyAtk = Math.round(template.atk * (1 + (state.hero.level - 1) * 0.05));

      if (isBossBattle) {
        sfx.bossRoar();
      } else {
        sfx.click();
      }

      const firstWord = pickNextWord(realmId);
      state.wordProgress[firstWord.id].discovered = true;
      saveState();

      ui.combat = {
        realmId,
        realm,
        isBoss: isBossBattle,
        enemy: {
          ...template,
          hp: enemyMaxHp,
          maxHp: enemyMaxHp,
          atk: enemyAtk
        },
        turnNumber: 1,
        combo: 0,
        currentWord: firstWord,
        isCounterGlyph: false, // Every 4th turn becomes true!
        choices: generateChoices(firstWord, false),
        translitRevealed: false,
        feedbackState: null, // null | { type: 'correct'|'wrong', word: obj, damageDealt/damageTaken }
        battleLog: isBossBattle
          ? `BOSS ENCOUNTER! ${template.name} blocks your path!`
          : `A wild ${template.name} emerges from ${realm.name}!`
      };

      ui.screen = 'combat';
      render();
    }

    function advanceCombatTurn() {
      const c = ui.combat;
      if (!c) return;

      c.turnNumber += 1;
      c.translitRevealed = false;
      c.feedbackState = null;

      // Every 4th turn triggers a "Counter-Glyph" reverse challenge!
      c.isCounterGlyph = c.turnNumber % 4 === 0;
      const nextWord = pickNextWord(c.realmId, c.currentWord.id);
      c.currentWord = nextWord;
      state.wordProgress[nextWord.id].discovered = true;
      c.choices = generateChoices(nextWord, c.isCounterGlyph);
      saveState();
      render();
    }

    function handleAnswerSelection(choiceIndex) {
      const c = ui.combat;
      if (!c || c.feedbackState) return;

      const choice = c.choices[choiceIndex];
      if (!choice || choice.eliminated) return;

      const word = c.currentWord;
      const wp = state.wordProgress[word.id];
      wp.discovered = true;
      wp.attempts += 1;
      state.stats.totalAnswered += 1;

      if (choice.isCorrect) {
        // --- CORRECT ANSWER ---
        wp.correct += 1;
        wp.mastery = Math.min(3, wp.mastery + 1);
        wp.weight = Math.max(1, wp.weight - 2);
        state.stats.totalCorrect += 1;

        c.combo += 1;
        if (c.combo > state.stats.bestCombo) {
          state.stats.bestCombo = c.combo;
        }

        // Compute damage with Class & Combo multipliers
        const baseAtk = calculateBaseAttack();
        const isScout = state.hero.heroClass === 'scout';
        const comboBonus = Math.min(1.25, (c.combo - 1) * (isScout ? 0.25 : 0.15));
        const counterMultiplier = c.isCounterGlyph ? 1.5 : 1.0;
        const variance = 0.92 + Math.random() * 0.18;
        const damage = Math.max(12, Math.round(baseAtk * (1 + comboBonus) * counterMultiplier * variance));

        const isCrit = c.isCounterGlyph || c.combo >= 3;
        if (isCrit) {
          sfx.critStrike();
        } else {
          sfx.swordSlash();
        }

        c.enemy.hp = Math.max(0, c.enemy.hp - damage);
        c.battleLog = c.isCounterGlyph
          ? `COUNTER-GLYPH SHATTERED! You struck ${c.enemy.name} for ${damage} critical damage!`
          : `True reading! You struck ${c.enemy.name} for ${damage} damage!`;

        saveState();
        render();

        // Trigger visual lunge & hit animations
        const heroSprite = document.getElementById('hero-sprite-box');
        const enemySprite = document.getElementById('enemy-sprite-box');
        if (heroSprite) heroSprite.classList.add('animate-lunge-right');
        if (enemySprite) enemySprite.classList.add('animate-hit');
        spawnFloatingText(
          'enemy-sprite-box',
          isCrit ? `CRIT -${damage}!` : `-${damage}`,
          isCrit ? 'text-amber-300' : 'text-emerald-300'
        );

        // Check Enemy Defeat
        if (c.enemy.hp <= 0) {
          setTimeout(() => handleEnemyDefeated(), 650);
          return;
        }

        // Brief celebratory pause before next word
        c.feedbackState = { type: 'correct', damage };
        render();
        setTimeout(() => {
          if (ui.combat && ui.combat.feedbackState?.type === 'correct') {
            advanceCombatTurn();
          }
        }, 780);
      } else {
        // --- WRONG ANSWER (PEDAGOGICAL CORRECTION + ENEMY COUNTER-ATTACK) ---
        wp.mastery = Math.max(0, wp.mastery - 1);
        wp.weight = Math.min(18, wp.weight + 4); // Spaced Repetition boost
        c.combo = 0;

        sfx.enemyHit();

        const dmgTaken = Math.max(6, Math.round(c.enemy.atk * (0.9 + Math.random() * 0.2)));
        state.hero.hp = Math.max(0, state.hero.hp - dmgTaken);

        c.feedbackState = {
          type: 'wrong',
          chosenLabel: choice.label,
          word: word,
          damageTaken: dmgTaken
        };
        c.battleLog = `${c.enemy.name} countered for ${dmgTaken} damage! Study the scroll below to master this word.`;

        saveState();
        render();

        // Animate Enemy Attack & Screen Shake
        const arena = document.getElementById('battle-arena-card');
        const heroSprite = document.getElementById('hero-sprite-box');
        const enemySprite = document.getElementById('enemy-sprite-box');
        if (enemySprite) enemySprite.classList.add('animate-lunge-left');
        if (heroSprite) heroSprite.classList.add('animate-hit');
        if (arena) arena.classList.add('animate-screen-shake');
        spawnFloatingText('hero-sprite-box', `-${dmgTaken} HP`, 'text-rose-400');

        // Speak the correct word automatically on miss to reinforce auditory memory!
        SpeechManager.speak(word.hebrew);

        if (state.hero.hp <= 0) {
          setTimeout(() => handleHeroDefeated(), 900);
        }
      }
    }

    function handlePeekTransliteration() {
      const c = ui.combat;
      if (!c || c.translitRevealed || c.feedbackState) return;
      sfx.click();
      c.translitRevealed = true;
      if (c.combo > 0) {
        c.combo = 0;
        showToast('Transliteration revealed — battle combo reset!', 'amber');
      } else {
        showToast('Transliteration peeked!', 'indigo');
      }
      render();
    }

    function useCombatItem(itemType) {
      const c = ui.combat;
      if (!c || c.feedbackState) return;

      if (itemType === 'potion') {
        if (state.inventory.potions <= 0) {
          showToast('No Health Potions remaining!', 'rose');
          return;
        }
        if (state.hero.hp >= state.hero.maxHp) {
          showToast('Your HP is already full!', 'amber');
          return;
        }
        state.inventory.potions -= 1;
        const healAmt = Math.max(40, Math.round(state.hero.maxHp * 0.45));
        state.hero.hp = Math.min(state.hero.maxHp, state.hero.hp + healAmt);
        sfx.heal();
        c.battleLog = `You drank a Health Potion and restored +${healAmt} HP!`;
        saveState();
        render();
        spawnFloatingText('hero-sprite-box', `+${healAmt} HP`, 'text-emerald-400');
      } else if (itemType === 'scroll') {
        if (state.inventory.scrolls <= 0) {
          showToast('No Scrolls of Insight remaining!', 'rose');
          return;
        }
        const wrongChoices = c.choices.filter(ch => !ch.isCorrect && !ch.eliminated);
        if (wrongChoices.length <= 1) {
          showToast('Insight has already been applied to this glyph!', 'amber');
          return;
        }
        state.inventory.scrolls -= 1;
        // Eliminate 2 wrong choices
        wrongChoices.sort(() => Math.random() - 0.5).slice(0, 2).forEach(ch => {
          ch.eliminated = true;
        });
        sfx.magicCast();
        c.battleLog = 'Scroll of Insight burned away 2 false meanings!';
        saveState();
        render();
      } else if (itemType === 'tonic') {
        if (state.inventory.tonics <= 0) {
          showToast('No Aether Tonics remaining!', 'rose');
          return;
        }
        state.inventory.tonics -= 1;
        const arcaneDmg = 25 + (state.hero.level - 1) * 5;
        c.enemy.hp = Math.max(0, c.enemy.hp - arcaneDmg);
        sfx.magicCast();
        SpeechManager.speak(c.currentWord.hebrew);
        c.battleLog = `Aether Tonic unleashed ${arcaneDmg} arcane damage and echoed the word aloud!`;
        saveState();
        render();
        spawnFloatingText('enemy-sprite-box', `-${arcaneDmg} ARCANE`, 'text-indigo-300');

        if (c.enemy.hp <= 0) {
          setTimeout(() => handleEnemyDefeated(), 650);
        }
      }
    }

    function handleEnemyDefeated() {
      const c = ui.combat;
      if (!c) return;

      state.stats.monstersSlain += 1;

      // Calculate Gold & XP Rewards with Class Perks
      let baseGold = c.isBoss ? 65 + c.realmId * 25 : 18 + c.realmId * 7;
      let baseXp = c.isBoss ? 90 + c.realmId * 30 : 32 + c.realmId * 10;

      if (state.hero.heroClass === 'scout') baseGold = Math.round(baseGold * 1.25);
      if (state.hero.heroClass === 'mage') baseXp = Math.round(baseXp * 1.25);

      state.hero.gold += baseGold;
      state.hero.xp += baseXp;

      // Update Realm Progression
      const rp = state.realmProgress[c.realmId];
      let unlockedBossNow = false;
      let defeatedRealmBossNow = false;

      if (c.isBoss) {
        if (!rp.bossDefeated) {
          defeatedRealmBossNow = true;
        }
        rp.bossDefeated = true;
      } else {
        rp.encountersCleared += 1;
        if (rp.encountersCleared === 5 && !rp.bossDefeated) {
          unlockedBossNow = true;
        }
      }

      // Check Level Up
      let leveledUp = false;
      while (state.hero.xp >= state.hero.xpToNext) {
        state.hero.xp -= state.hero.xpToNext;
        state.hero.level += 1;
        state.hero.xpToNext = Math.round(state.hero.xpToNext * 1.28);
        state.hero.maxHp = calculateMaxHp();
        state.hero.hp = state.hero.maxHp; // Full heal on level up!
        leveledUp = true;
      }

      // Restore a small post-battle breather (+15% Max HP)
      if (!leveledUp) {
        state.hero.hp = Math.min(state.hero.maxHp, state.hero.hp + Math.round(state.hero.maxHp * 0.15));
      }

      if (leveledUp) {
        sfx.levelUp();
      } else {
        sfx.gold();
      }

      const defeatedEnemyName = c.enemy.name;
      const realmName = c.realm.name;
      const realmId = c.realmId;

      ui.combat = null;
      ui.screen = 'map';
      saveState();
      render();

      openModal(`
        <div class="text-center">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-500/20 border border-amber-400/50 text-3xl mb-3">
            ${c.isBoss ? '👑' : '⚔️'}
          </div>
          <h2 class="font-display text-2xl font-bold gold-gradient-text mb-1">
            ${c.isBoss ? 'REALM GUARDIAN VANQUISHED!' : 'VICTORY IN BATTLE!'}
          </h2>
          <p class="text-sm text-slate-300 mb-4">
            You defeated <span class="font-semibold text-white">${defeatedEnemyName}</span> in ${realmName}.
          </p>

          <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="rounded-xl bg-slate-900/90 border border-amber-500/30 p-3">
              <div class="text-xs text-slate-400 uppercase tracking-wider">Gold Earned</div>
              <div class="text-xl font-bold text-amber-400">+${baseGold} 🪙</div>
            </div>
            <div class="rounded-xl bg-slate-900/90 border border-indigo-500/30 p-3">
              <div class="text-xs text-slate-400 uppercase tracking-wider">Experience</div>
              <div class="text-xl font-bold text-indigo-300">+${baseXp} XP</div>
            </div>
          </div>

          ${leveledUp ? `
            <div class="rounded-xl bg-gradient-to-r from-amber-500/20 via-yellow-500/20 to-amber-500/20 border border-amber-400/60 p-3 mb-4">
              <div class="font-display font-bold text-amber-300 text-base">✨ LEVEL UP! LEVEL ${state.hero.level} ✨</div>
              <div class="text-xs text-amber-100/90 mt-0.5">Max HP &amp; Attack increased! HP fully restored.</div>
            </div>
          ` : ''}

          ${unlockedBossNow ? `
            <div class="rounded-xl bg-rose-950/70 border border-rose-500/50 p-3 mb-4 text-xs text-rose-200">
              🔥 <strong>Realm Boss Unlocked!</strong> You have cleared 5 encounters in ${realmName}. The Realm Guardian awaits!
            </div>
          ` : ''}

          ${defeatedRealmBossNow && realmId < 5 ? `
            <div class="rounded-xl bg-emerald-950/70 border border-emerald-500/50 p-3 mb-4 text-xs text-emerald-200">
              🗺️ <strong>New Realm Unlocked!</strong> The path to <strong>${REALMS[realmId].name}</strong> is now open!
            </div>
          ` : ''}

          ${defeatedRealmBossNow && realmId === 5 ? `
            <div class="rounded-xl bg-indigo-950/80 border border-amber-400/60 p-3 mb-4 text-xs text-amber-200">
              🏆 <strong>CHRONICLE COMPLETE!</strong> You conquered the Shadow Citadel! Continue exploring to master all 120 Hebrew words.
            </div>
          ` : ''}

          <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold tracking-wide shadow-lg transition">
            Continue Quest
          </button>
        </div>
      `);
    }

    function handleHeroDefeated() {
      const c = ui.combat;
      const realmName = c ? c.realm.name : 'the wilds';
      state.hero.hp = state.hero.maxHp;
      ui.combat = null;
      ui.screen = 'map';
      saveState();
      render();

      openModal(`
        <div class="text-center">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-rose-500/20 border border-rose-400/40 text-3xl mb-3">
            🛡️
          </div>
          <h2 class="font-display text-2xl font-bold text-rose-400 mb-2">RETREAT TO SANCTUARY</h2>
          <p class="text-sm text-slate-300 mb-4 leading-relaxed">
            You were overwhelmed in <span class="text-white font-semibold">${realmName}</span>, but the Chroniclers carried you back to camp and restored your health. Every missed word has been marked in your Grimoire for practice!
          </p>
          <button onclick="closeModal()" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-amber-400/40 text-amber-200 font-semibold transition">
            Rise Again
          </button>
        </div>
      `);
    }

    function buyMerchantItem(itemKey) {
      const weaponCost = 45 + (state.hero.weaponLevel - 1) * 35;
      const armorCost = 45 + (state.hero.armorLevel - 1) * 35;

      if (itemKey === 'weapon') {
        if (state.hero.gold < weaponCost) {
          showToast('Not enough Gold for Weapon Forge!', 'rose');
          return;
        }
        state.hero.gold -= weaponCost;
        state.hero.weaponLevel += 1;
        sfx.gold();
        showToast(`Weapon forged to Lv.${state.hero.weaponLevel}! (+7 Base ATK)`, 'emerald');
      } else if (itemKey === 'armor') {
        if (state.hero.gold < armorCost) {
          showToast('Not enough Gold for Armor Reinforcement!', 'rose');
          return;
        }
        state.hero.gold -= armorCost;
        state.hero.armorLevel += 1;
        state.hero.maxHp = calculateMaxHp();
        state.hero.hp = state.hero.maxHp;
        sfx.gold();
        showToast(`Armor reinforced to Lv.${state.hero.armorLevel}! (+25 Max HP)`, 'emerald');
      } else if (itemKey === 'potion') {
        if (state.hero.gold < 20) {
          showToast('Need 20 Gold for a Health Potion!', 'rose');
          return;
        }
        state.hero.gold -= 20;
        state.inventory.potions += 1;
        sfx.gold();
        showToast('Purchased Health Potion (+1)', 'emerald');
      } else if (itemKey === 'scroll') {
        if (state.hero.gold < 25) {
          showToast('Need 25 Gold for a Scroll of Insight!', 'rose');
          return;
        }
        state.hero.gold -= 25;
        state.inventory.scrolls += 1;
        sfx.gold();
        showToast('Purchased Scroll of Insight (+1)', 'indigo');
      } else if (itemKey === 'tonic') {
        if (state.hero.gold < 30) {
          showToast('Need 30 Gold for an Aether Tonic!', 'rose');
          return;
        }
        state.hero.gold -= 30;
        state.inventory.tonics += 1;
        sfx.gold();
        showToast('Purchased Aether Tonic (+1)', 'indigo');
      } else if (itemKey === 'rest') {
        if (state.hero.hp >= state.hero.maxHp) {
          showToast('Your HP is already completely full!', 'amber');
          return;
        }
        if (state.hero.gold < 10) {
          showToast('Need 10 Gold to rest at the Hearthfire!', 'rose');
          return;
        }
        state.hero.gold -= 10;
        state.hero.hp = state.hero.maxHp;
        sfx.heal();
        showToast('Rested by the Hearthfire — HP 100% restored!', 'emerald');
      }

      saveState();
      render();
    }

    function createNewHero() {
      const nameInput = document.getElementById('hero-name-input');
      const chosenName = (nameInput ? nameInput.value.trim() : ui.heroNameInput.trim()) || 'Ari';
      const chosenClass = ui.selectedClass || 'knight';

      state = createDefaultState();
      state.initialized = true;
      state.hero.name = chosenName.slice(0, 20);
      state.hero.heroClass = chosenClass;
      state.hero.maxHp = calculateMaxHp();
      state.hero.hp = state.hero.maxHp;

      if (chosenClass === 'mage') {
        state.inventory.scrolls += 2;
        state.inventory.tonics += 1;
      }

      sfx.levelUp();
      saveState();
      ui.combat = null;
      ui.screen = 'map';
      render();
      showToast(`Welcome, ${state.hero.name} the ${HERO_CLASSES[chosenClass].name}!`, 'amber');
    }

      state.settings.showNikud = !state.settings.showNikud;
      saveState();

        state.settings.showNikud

                    <button

                if (ch.eliminated) {
                  btnStyle = 'bg-slate-950/40 border-slate-800/60 text-slate-600 line-through opacity-50 cursor-not-allowed';

                    btnStyle = 'bg-rose-950/90 border-rose-500 text-rose-200';
                  } else {
                    btnStyle = 'bg-slate-900/50 border-slate-800 text-slate-500';

                  ? formatHebrew(ch.label, state.settings.showNikud)
                  : ch.label;

                return `

                    type="button"

                    <span class="w-7 h-7 rounded-lg bg-slate-800/90 border border-slate-600/70 flex items-center justify-center text-xs font-bold text-amber-300 shrink-0">

                  class="px-3 py-2 rounded-xl border text-xs font-semibold flex items-center gap-1.5 transition cursor-pointer ${

                  <span>📜</span> Scroll of Insight (${state.inventory.scrolls})

                  }"
                >
                  <span>🔮</span> Aether Tonic (${state.inventory.tonics})
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

                }"
              >
                Upgrade Weapon • 🪙 ${weaponCost}
              </button>
            </div>

            <!-- Armor Upgrade -->
            <div class="fantasy-card rounded-2xl p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-2xl">🛡️</span>
                  <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-sky-500/20 text-sky-300">
                    Current: Lv.${h.armorLevel}
                  </span>
                </div>
                <h3 class="font-display text-lg font-bold text-white mb-1">Reinforce Armor</h3>
                <p class="text-xs text-slate-300 mb-4">
                  Permanently increases your Maximum HP by <strong class="text-emerald-300">+25 Max HP</strong> and restores you to full health.
                </p>
              </div>
              <button
                onclick="buyMerchantItem('armor')"
                class="w-full py-3 rounded-xl font-bold text-xs sm:text-sm transition cursor-pointer ${
                  h.gold >= armorCost
                    ? 'bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-white'
                    : 'bg-slate-800 text-slate-500 border border-slate-700'
                }"
              >
                Upgrade Armor • 🪙 ${armorCost}
              </button>
            </div>

            <!-- Hearthfire Rest -->
            <div class="fantasy-card rounded-2xl p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-2xl">🔥</span>
                  <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300">
                    HP: ${h.hp}/${h.maxHp}
                  </span>
                </div>
                <h3 class="font-display text-lg font-bold text-white mb-1">Hearthfire Rest</h3>
                <p class="text-xs text-slate-300 mb-4">
                  Share warm bread and honey by the campfire to restore <strong class="text-emerald-300">100% of your HP</strong> before your next battle.
                </p>
              </div>
              <button
                onclick="buyMerchantItem('rest')"
                class="w-full py-3 rounded-xl font-bold text-xs sm:text-sm transition cursor-pointer ${
                  h.gold >= 10 && h.hp < h.maxHp
                    ? 'bg-emerald-600 hover:bg-emerald-500 text-white'
                    : 'bg-slate-800 text-slate-500 border border-slate-700'
                }"
              >
                Rest &amp; Heal • 🪙 10
              </button>
            </div>

            <!-- Health Potion -->
            <div class="fantasy-card rounded-2xl p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-2xl">🧪</span>
                  <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-800 text-slate-300">
                    Owned: ${state.inventory.potions}
                  </span>
                </div>
                <h3 class="font-display text-lg font-bold text-white mb-1">Health Potion</h3>
                <p class="text-xs text-slate-300 mb-4">
                  Restores <strong class="text-emerald-300">+40 HP</strong> (or 45% Max HP) mid-battle without losing your turn.
                </p>
              </div>
              <button
                onclick="buyMerchantItem('potion')"
                class="w-full py-3 rounded-xl font-bold text-xs sm:text-sm transition cursor-pointer ${
                  h.gold >= 20
                    ? 'bg-slate-800 hover:bg-slate-700 border border-emerald-400/50 text-emerald-200'
                    : 'bg-slate-900 text-slate-600 border border-slate-800'
                }"
              >
                Buy Potion • 🪙 20
              </button>
            </div>

            <!-- Scroll of Insight -->
            <div class="fantasy-card rounded-2xl p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-2xl">📜</span>
                  <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-800 text-slate-300">
                    Owned: ${state.inventory.scrolls}
                  </span>
                </div>
                <h3 class="font-display text-lg font-bold text-white mb-1">Scroll of Insight</h3>
                <p class="text-xs text-slate-300 mb-4">
                  Eliminates <strong class="text-amber-300">2 wrong choices</strong> on a tricky word while preserving your combo multiplier!
                </p>
              </div>
              <button
                onclick="buyMerchantItem('scroll')"
                class="w-full py-3 rounded-xl font-bold text-xs sm:text-sm transition cursor-pointer ${
                  h.gold >= 25
                    ? 'bg-slate-800 hover:bg-slate-700 border border-amber-400/50 text-amber-200'
                    : 'bg-slate-900 text-slate-600 border border-slate-800'
                }"
              >
                Buy Scroll • 🪙 25
              </button>
            </div>

            <!-- Aether Tonic -->
            <div class="fantasy-card rounded-2xl p-5 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-2">
                  <span class="text-2xl">🔮</span>
                  <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-800 text-slate-300">
                    Owned: ${state.inventory.tonics}
                  </span>
                </div>
                <h3 class="font-display text-lg font-bold text-white mb-1">Aether Tonic</h3>
                <p class="text-xs text-slate-300 mb-4">
                  Deals <strong class="text-indigo-300">25+ Arcane Damage</strong> directly to the enemy and speaks the current Hebrew word aloud.
                </p>
              </div>
              <button
                onclick="buyMerchantItem('tonic')"
                class="w-full py-3 rounded-xl font-bold text-xs sm:text-sm transition cursor-pointer ${
                  h.gold >= 30
                    ? 'bg-slate-800 hover:bg-slate-700 border border-indigo-400/50 text-indigo-200'
                    : 'bg-slate-900 text-slate-600 border border-slate-800'
                }"
              >
                Buy Tonic • 🪙 30
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderGrimoireScreen() {
      const searchLower = ui.grimoireSearch.trim().toLowerCase();

      const filteredWords = VOCABULARY.filter(w => {
        const wp = state.wordProgress[w.id] || { discovered: false, mastery: 0 };
        if (ui.grimoireFilterRealm !== 'all' && String(w.realm) !== String(ui.grimoireFilterRealm)) {
          return false;
        }
        if (ui.grimoireFilterMastery === 'mastered' && wp.mastery < 3) return false;
        if (ui.grimoireFilterMastery === 'learning' && (!wp.discovered || wp.mastery >= 3)) return false;
        if (ui.grimoireFilterMastery === 'unseen' && wp.discovered) return false;

        if (searchLower) {
          const plainHeb = formatHebrew(w.hebrew, false);
          return (
            w.meaning.toLowerCase().includes(searchLower) ||
            w.translit.toLowerCase().includes(searchLower) ||
            w.hebrew.includes(searchLower) ||
            plainHeb.includes(searchLower)
          );
        }
        return true;
      });

      const accuracy = state.stats.totalAnswered > 0
        ? Math.round((state.stats.totalCorrect / state.stats.totalAnswered) * 100)
        : 0;

      return `
        <div class="space-y-5">
          <!-- Grimoire Header & Stats -->
          <div class="fantasy-card rounded-2xl p-5">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-4">
              <div>
                <h2 class="font-display text-2xl font-bold gold-gradient-text">📖 The Living Word Grimoire</h2>
                <p class="text-xs sm:text-sm text-slate-300 mt-1">
                  Click any Hebrew card to hear its <span class="text-amber-300 font-semibold">he-IL</span> pronunciation. Toggle <strong>Nikud</strong> in the top bar anytime to test unpointed reading!
                </p>
              </div>
              <div class="flex flex-wrap gap-2 text-xs">
                <div class="px-3 py-2 rounded-xl bg-slate-950/90 border border-slate-800">
                  Discovered: <strong class="text-white">${getDiscoveredCount()}/120</strong>
                </div>
                <div class="px-3 py-2 rounded-xl bg-slate-950/90 border border-emerald-500/30">
                  Mastered: <strong class="text-emerald-400">${getMasteredCount()}/120</strong>
                </div>
                <div class="px-3 py-2 rounded-xl bg-slate-950/90 border border-amber-500/30">
                  Accuracy: <strong class="text-amber-300">${accuracy}%</strong>
                </div>
              </div>
            </div>

            <!-- Filter & Search Controls -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <input
                type="text"
                value="${escapeHtml(ui.grimoireSearch)}"
                oninput="ui.grimoireSearch = this.value; renderGrimoireGridOnly();"
                placeholder="Search English, transliteration, or Hebrew..."
                class="px-3.5 py-2.5 rounded-xl bg-slate-950/90 border border-slate-700 focus:border-amber-400 focus:outline-none text-sm text-white"
              />

              <select
                onchange="ui.grimoireFilterRealm = this.value; render();"
                class="px-3.5 py-2.5 rounded-xl bg-slate-950/90 border border-slate-700 focus:border-amber-400 focus:outline-none text-sm text-slate-200"
              >
                <option value="all" ${ui.grimoireFilterRealm === 'all' ? 'selected' : ''}>All 5 Realms (120 Words)</option>
                ${REALMS.map(r => `
                  <option value="${r.id}" ${String(ui.grimoireFilterRealm) === String(r.id) ? 'selected' : ''}>
                    Realm ${r.id}: ${r.name}
                  </option>
                `).join('')}
              </select>

              <select
                onchange="ui.grimoireFilterMastery = this.value; render();"
                class="px-3.5 py-2.5 rounded-xl bg-slate-950/90 border border-slate-700 focus:border-amber-400 focus:outline-none text-sm text-slate-200"
              >
                <option value="all" ${ui.grimoireFilterMastery === 'all' ? 'selected' : ''}>All Mastery Statuses</option>
                <option value="mastered" ${ui.grimoireFilterMastery === 'mastered' ? 'selected' : ''}>⭐⭐⭐ Mastered (3 Stars)</option>
                <option value="learning" ${ui.grimoireFilterMastery === 'learning' ? 'selected' : ''}>In Progress (1–2 Stars)</option>
                <option value="unseen" ${ui.grimoireFilterMastery === 'unseen' ? 'selected' : ''}>Undiscovered</option>
              </select>
            </div>
          </div>

          <!-- Words Grid -->
          <div id="grimoire-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3.5">
            ${renderGrimoireCardsHTML(filteredWords)}
          </div>
        </div>
      `;
    }

    function renderGrimoireCardsHTML(wordsList) {
      if (wordsList.length === 0) {
        return `
          <div class="col-span-full fantasy-card rounded-2xl p-8 text-center text-slate-400">
            No vocabulary words match your current filter.
          </div>
        `;
      }

      return wordsList.map(w => {
        const wp = state.wordProgress[w.id] || { discovered: false, mastery: 0 };
        const isMastered = wp.mastery >= 3;
        const displayedHebrew = formatHebrew(w.hebrew, state.settings.showNikud);

        return `
          <div
            onclick="SpeechManager.speak('${w.hebrew}')"
            class="rounded-2xl p-4 border transition cursor-pointer flex flex-col justify-between ${
              isMastered
                ? 'bg-gradient-to-b from-emerald-950/50 to-slate-900/95 border-emerald-500/45 hover:border-emerald-400'
                : wp.discovered
                  ? 'bg-slate-900/90 border-amber-500/30 hover:border-amber-400/70'
                  : 'bg-slate-950/80 border-slate-800/90 hover:border-slate-600'
            }"
            title="Click to hear pronunciation"
          >
            <div>
              <div class="flex items-center justify-between text-[11px] mb-2">
                <span class="px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 font-medium">
                  R${w.realm} • ${w.pos}
                </span>
                <span class="${isMastered ? 'text-emerald-400' : 'text-amber-400/80'} font-bold">
                  ${'★'.repeat(wp.mastery)}${'☆'.repeat(3 - wp.mastery)}
                </span>
              </div>

              <div class="text-center py-2">
                <div class="font-hebrew-display text-3xl sm:text-4xl font-bold text-white mb-1">
                  ${displayedHebrew}
                </div>
                <div class="text-xs text-amber-300/90 font-medium">${w.translit}</div>
              </div>
            </div>

            <div class="pt-2.5 mt-2 border-t border-slate-800/80 flex items-center justify-between gap-2">
              <span class="font-semibold text-sm ${wp.discovered ? 'text-slate-100' : 'text-slate-400'}">
                ${w.meaning}
              </span>
              <span class="text-xs px-2 py-1 rounded-lg bg-amber-500/15 text-amber-300">🔊</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderGrimoireGridOnly() {
      const grid = document.getElementById('grimoire-grid');
      if (!grid) return render();
      const searchLower = ui.grimoireSearch.trim().toLowerCase();
      const filteredWords = VOCABULARY.filter(w => {
        const wp = state.wordProgress[w.id] || { discovered: false, mastery: 0 };
        if (ui.grimoireFilterRealm !== 'all' && String(w.realm) !== String(ui.grimoireFilterRealm)) return false;
        if (ui.grimoireFilterMastery === 'mastered' && wp.mastery < 3) return false;
        if (ui.grimoireFilterMastery === 'learning' && (!wp.discovered || wp.mastery >= 3)) return false;
        if (ui.grimoireFilterMastery === 'unseen' && wp.discovered) return false;
        if (searchLower) {
          const plainHeb = formatHebrew(w.hebrew, false);
          return (
            w.meaning.toLowerCase().includes(searchLower) ||
            w.translit.toLowerCase().includes(searchLower) ||
            w.hebrew.includes(searchLower) ||
            plainHeb.includes(searchLower)
          );
        }
        return true;
      });
      grid.innerHTML = renderGrimoireCardsHTML(filteredWords);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ----------------------------------------------------------------------------
    // 11. MAIN RENDER DISPATCHER & KEYBOARD SHORTCUTS (1-4 IN COMBAT)
    // ----------------------------------------------------------------------------
    function render() {
      renderTopHUD();
      const main = document.getElementById('main-view');
      if (!main) return;

      switch (ui.screen) {
        case 'creation':
          main.innerHTML = renderCreationScreen();
          break;
        case 'combat':
          main.innerHTML = renderCombatScreen();
          break;
        case 'merchant':
          main.innerHTML = renderMerchantScreen();
          break;
        case 'grimoire':
          main.innerHTML = renderGrimoireScreen();
          break;
        case 'map':
        default:
          main.innerHTML = renderWorldMapScreen();
          break;
      }
      updateSpeechBadge();
    }

    // Support keys 1-4 for rapid combat selection and 's' for speaking the word
    document.addEventListener('keydown', (e) => {
      if (ui.screen !== 'combat' || !ui.combat) return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (['1', '2', '3', '4'].includes(e.key)) {
        const idx = parseInt(e.key, 10) - 1;
        if (!ui.combat.feedbackState) {
          handleAnswerSelection(idx);
        } else if (ui.combat.feedbackState.type === 'wrong' && e.key === '1') {
          advanceCombatTurn();
        }
      } else if (e.key.toLowerCase() === 's') {
        SpeechManager.speak(ui.combat.currentWord.hebrew);
      } else if (e.key === 'Enter' && ui.combat.feedbackState?.type === 'wrong') {
        advanceCombatTurn();
      }
    });

    // Initialize Speech Voices & Boot App
    SpeechManager.init();
    render();
  </script>
</body>
</html>
