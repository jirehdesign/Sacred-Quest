<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL 2025 Pass & Play</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Graduate&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .score-font { font-family: 'Graduate', monospace; }
        
        .field-container {
            width: 100%;
            height: 160px;
            background-color: #2e7d32;
            position: relative;
            border: 4px solid #fff;
            overflow: hidden;
            display: flex;
        }
        
        .endzone {
            width: 8.333%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            writing-mode: vertical-rl;
            text-orientation: upright;
            text-transform: uppercase;
            border-right: 2px solid white;
            border-left: 2px solid white;
            box-sizing: border-box;
            opacity: 0.9;
            position: relative;
            overflow: hidden;
        }

        .playing-field {
            width: 83.333%;
            height: 100%;
            position: relative;
            background: repeating-linear-gradient(
                to right,
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.1) 4.9%,
                rgba(255, 255, 255, 0.8) 4.9%,
                rgba(255, 255, 255, 0.8) 5%,
                transparent 5%,
                transparent 9.9%,
                rgba(255, 255, 255, 0.8) 9.9%,
                rgba(255, 255, 255, 0.8) 10%
            );
        }

        .yard-number {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.5rem;
            font-weight: 800;
            top: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Graduate', monospace;
        }

        .line-of-scrimmage {
            position: absolute;
            height: 100%;
            width: 4px;
            background-color: #3b82f6; 
            top: 0;
            transform: translateX(-50%);
            z-index: 10;
        }

        .first-down-line {
            position: absolute;
            height: 100%;
            width: 4px;
            background-color: #eab308; 
            top: 0;
            transform: translateX(-50%);
            z-index: 10;
        }

        #football-container {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            transition: left 1s linear; /* Linear Run Movement */
        }
        
        .football-icon {
            font-size: 1.5rem;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
        }

        @keyframes passArc {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            50% { transform: translateY(-70px) scale(1.5) rotate(180deg); }
            100% { transform: translateY(0) scale(1) rotate(360deg); }
        }
        .anim-pass {
            animation: passArc 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        #cutscene-overlay {
            background-color: rgba(0, 0, 0, 0.95);
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 50%, transparent 50%);
            background-size: 100% 8px; /* Scanline effect */
        }
        .retro-text {
            font-family: 'Graduate', monospace;
            text-shadow: 6px 6px 0px #000;
            letter-spacing: 0.1em;
        }
        .retro-svg {
            image-rendering: pixelated; /* Ensures crisp edges on blocky SVGs */
        }
        
        .hide { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Setup Screen -->
    <div id="setup-screen" class="flex-1 flex flex-col items-center justify-center p-6">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-2 text-center text-white drop-shadow-md">NFL 2025</h1>
        <p class="text-slate-400 mb-8 text-center">Head-to-Head Pass & Play Strategy</p>

        <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-2xl border border-slate-700">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <h2 class="text-xl font-bold text-blue-400 border-b border-slate-600 pb-2">Player 1 (Home)</h2>
                    <div class="flex items-center gap-4">
                        <div id="p1-logo-preview" class="w-12 h-12 flex-none"></div>
                        <div class="flex-1">
                            <label class="block text-sm font-medium text-slate-400 mb-1">Select Team</label>

            <div id="p1-score-panel" class="flex-1 p-4 flex flex-col justify-center items-center text-center relative md:border-l border-slate-700">

            <div class="field-container rounded" id="football-field">
                <div id="left-endzone" class="endzone" style="background-color: #c83803;">HOME</div>
                <div class="playing-field" id="gridiron">
                    <div id="los-line" class="line-of-scrimmage hide"></div>
                    <div id="first-down-line" class="first-down-line hide"></div>
                    <!-- Updated Football Wrapper for compound animations -->
                    <div id="football-container" class="hide">
                        <div id="football-icon" class="football-icon">🏈</div>
                    </div>
                </div>
                <div id="right-endzone" class="endzone" style="background-color: #000000;">AWAY</div>

            <div class="text-center text-xs text-slate-400 mt-2 font-semibold tracking-widest uppercase" id="drive-direction">Offense Drives Left to Right ➡</div>

        <div class="flex flex-col md:flex-row gap-4 h-full md:min-h-[250px]">
            <div class="flex-1 bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-xl flex flex-col">
                <h2 class="text-lg font-bold text-white border-b border-slate-600 pb-2 mb-4" id="action-title">Action Setup</h2>
                <div id="action-content" class="flex-1 flex flex-col justify-center items-center text-center gap-4"></div>
            </div>
            <div class="flex-1 bg-slate-800 rounded-xl p-4 border border-slate-700 shadow-xl flex flex-col">
                <h2 class="text-lg font-bold text-white border-b border-slate-600 pb-2 mb-2">Play-by-Play</h2>
                <div id="game-log" class="flex-1 overflow-y-auto space-y-2 text-sm text-slate-300 pr-2 max-h-48 md:max-h-full">
                    <div class="italic text-slate-500">Awaiting kickoff...</div>
                </div>
            </div>
        </div>
        
        <div id="cutscene-overlay" class="absolute inset-0 z-50 rounded-xl flex flex-col justify-center items-center hide">
            <h1 id="cutscene-text" class="text-5xl md:text-7xl font-black text-yellow-400 retro-text uppercase text-center mb-8 animate-pulse">TOUCHDOWN!</h1>
            <div id="cutscene-graphic" class="retro-svg w-64 h-64 flex justify-center items-center">
                <!-- SVG injected via JS -->
            </div>
        </div>
    </div>

    <script>
        const teams = [
            { id: 'ARI', name: 'Arizona Cardinals', color1: '#97233F', color2: '#000000', offRating: 80, defRating: 72, stRating: 78 },
            { id: 'ATL', name: 'Atlanta Falcons', color1: '#A71930', color2: '#000000', offRating: 82, defRating: 75, stRating: 80 },
            { id: 'BAL', name: 'Baltimore Ravens', color1: '#241773', color2: '#9E7C0C', offRating: 90, defRating: 92, stRating: 95 },

            { id: 'CAR', name: 'Carolina Panthers', color1: '#0085CA', color2: '#101820', offRating: 72, defRating: 74, stRating: 75 },

            { id: 'DEN', name: 'Denver Broncos', color1: '#FB4F14', color2: '#002244', offRating: 77, defRating: 81, stRating: 79 },
            { id: 'DET', name: 'Detroit Lions', color1: '#0076B6', color2: '#B0B7BC', offRating: 93, defRating: 84, stRating: 86 },
            { id: 'GB', name: 'Green Bay Packers', color1: '#203731', color2: '#FFB612', offRating: 88, defRating: 83, stRating: 80 },
            { id: 'HOU', name: 'Houston Texans', color1: '#03202F', color2: '#A71930', offRating: 89, defRating: 85, stRating: 83 },
            { id: 'IND', name: 'Indianapolis Colts', color1: '#002C5F', color2: '#A2AAAD', offRating: 82, defRating: 81, stRating: 81 },
            { id: 'JAX', name: 'Jacksonville Jaguars', color1: '#006778', color2: '#D7A22A', offRating: 80, defRating: 78, stRating: 80 },
            { id: 'KC', name: 'Kansas City Chiefs', color1: '#E31837', color2: '#FFB81C', offRating: 94, defRating: 92, stRating: 88 },
            { id: 'LV', name: 'Las Vegas Raiders', color1: '#000000', color2: '#A5ACAF', offRating: 75, defRating: 84, stRating: 85 },
            { id: 'LAC', name: 'Los Angeles Chargers', color1: '#0080C6', color2: '#FFC20E', offRating: 84, defRating: 83, stRating: 80 },
            { id: 'LAR', name: 'Los Angeles Rams', color1: '#003594', color2: '#FFA300', offRating: 86, defRating: 78, stRating: 79 },
            { id: 'MIA', name: 'Miami Dolphins', color1: '#008E97', color2: '#FC4C02', offRating: 88, defRating: 79, stRating: 80 },
            { id: 'MIN', name: 'Minnesota Vikings', color1: '#4F2683', color2: '#FFC62F', offRating: 84, defRating: 85, stRating: 82 },
            { id: 'NE', name: 'New England Patriots', color1: '#002244', color2: '#C60C30', offRating: 74, defRating: 82, stRating: 86 },
            { id: 'NO', name: 'New Orleans Saints', color1: '#D3BC8D', color2: '#101820', offRating: 80, defRating: 82, stRating: 82 },
            { id: 'NYG', name: 'New York Giants', color1: '#0B2265', color2: '#A71930', offRating: 73, defRating: 81, stRating: 79 },
            { id: 'NYJ', name: 'New York Jets', color1: '#125740', color2: '#000000', offRating: 79, defRating: 88, stRating: 81 },
            { id: 'PHI', name: 'Philadelphia Eagles', color1: '#004C54', color2: '#A5ACAF', offRating: 89, defRating: 85, stRating: 87 },
            { id: 'PIT', name: 'Pittsburgh Steelers', color1: '#101820', color2: '#FFB612', offRating: 79, defRating: 90, stRating: 88 },
            { id: 'SF', name: 'San Francisco 49ers', color1: '#AA0000', color2: '#B3995D', offRating: 91, defRating: 89, stRating: 85 },
            { id: 'SEA', name: 'Seattle Seahawks', color1: '#002244', color2: '#69BE28', offRating: 83, defRating: 82, stRating: 84 },
            { id: 'TB', name: 'Tampa Bay Buccaneers', color1: '#D50A0A', color2: '#FF7900', offRating: 85, defRating: 80, stRating: 81 },
            { id: 'TEN', name: 'Tennessee Titans', color1: '#0C2340', color2: '#4B92DB', offRating: 77, defRating: 82, stRating: 80 },
            { id: 'WAS', name: 'Washington Commanders', color1: '#5A1414', color2: '#FFB612', offRating: 86, defRating: 80, stRating: 79 }
        ];

        const playbooks = {
            offense_normal: [
                { id: 'run_inside', name: 'HB Dive (Inside Run)', desc: 'Safe run. Low risk, low reward.' },
                { id: 'run_outside', name: 'Toss (Outside Run)', desc: 'Try the edge. Boom or bust run.' },
                { id: 'pass_short', name: 'Slants (Short Pass)', desc: 'Quick pass. Good for short yardage.' },
                { id: 'pass_med', name: 'Posts (Medium Pass)', desc: 'Standard passing play. Balanced risk.' },
                { id: 'pass_deep', name: 'Four Verts (Deep Pass)', desc: 'Go deep. High sack/INT risk, huge reward.' }
            ],
            defense_normal: [
                { id: 'def_run', name: 'Stack Box (Run Defense)', desc: 'Stuff the run. Vulnerable to passes.' },
                { id: 'def_pass', name: 'Cover 2 (Pass Defense)', desc: 'Standard zone. Good vs short/med pass.' },
                { id: 'blitz', name: 'Zero Blitz', desc: 'Heavy pressure. Forces sacks or gives up big plays.' },
                { id: 'prevent', name: 'Cover 4 (Prevent)', desc: 'Don\'t get beat deep. Gives up short yards.' }
            ],
            offense_4th: [
                { id: 'punt', name: 'Punt', desc: 'Kick the ball away.' },
                { id: 'fg', name: 'Field Goal', desc: 'Try for 3 points.' }
            ],
            defense_special: [
                { id: 'special_def', name: 'Special Teams Defense', desc: 'Field goal/Punt block unit.' }
            ],
            kickoff_offense: [
                { id: 'kickoff', name: 'Standard Kickoff', desc: 'Kick it deep.' },
                { id: 'onside', name: 'Onside Kick', desc: 'Try to recover it. Very low chance.' }
            ],
            kickoff_defense: [
                { id: 'return_normal', name: 'Standard Return', desc: 'Catch and run.' }
            ],
            pat_offense: [
                { id: 'xp', name: 'Extra Point (Kick)', desc: 'Safe 1 point (95%).' },
                { id: '2pt', name: '2-Pt Conversion', desc: 'One play from the 2. (45%).' }
            ],
            pat_defense: [
                { id: 'pat_def', name: 'PAT Defense', desc: 'Try to stop them.' }
            ]
        };

        let state = {
            p1: { team: null, score: 0, timeouts: 3, isP1: true, qScores: [0,0,0,0] },
            p2: { team: null, score: 0, timeouts: 3, isP1: false, qScores: [0,0,0,0] },
            quarter: 1,
            clock: 900,
            possession: 1,
            ballOn: 35, 
            down: 1,
            distance: 10,
            gamePhase: 'KICKOFF', 
            turnPhase: 'OFFENSE_SELECT',
            offensePlay: null,
            defensePlay: null,
            playLog: []
        };

        const SoundEngine = {
            ready: false,
            init: async function() {
                await Tone.start();
                this.ready = true;
                
                this.hitSynth = new Tone.MembraneSynth().toDestination();
                this.noiseSynth = new Tone.NoiseSynth({ 
                    noise: { type: 'white' }, 
                    envelope: { attack: 0.005, decay: 0.1, sustain: 0, release: 0.1 } 
                }).toDestination();

                // NEW: Crunch effect for sacks and tackles for loss
                this.crunchDistortion = new Tone.Distortion(0.6).toDestination();
                this.crunchFilter = new Tone.Filter(300, "lowpass").connect(this.crunchDistortion);
                this.crunchSynth = new Tone.NoiseSynth({
                    noise: { type: 'brown' },
                    envelope: { attack: 0.01, decay: 0.3, sustain: 0, release: 0.2 }
                }).connect(this.crunchFilter);
                
                this.whistleSynth = new Tone.Synth({ 
                    oscillator: { type: 'square' }, 
                    envelope: { attack: 0.01, decay: 0.1, sustain: 0.5, release: 0.2 } 
                }).toDestination();
                
                this.cheerSynth = new Tone.NoiseSynth({ 
                    noise: { type: 'pink' }, 
                    envelope: { attack: 1.5, decay: 1, sustain: 1, release: 3 } 
                });
                this.cheerFilter = new Tone.Filter(800, "bandpass").toDestination();
                
                // NEW: Modulated chorus to simulate thousands of people cheering
                this.crowdChorus = new Tone.Chorus(4, 2.5, 0.5).toDestination().start();
                this.cheerSynth.connect(this.cheerFilter);
                this.cheerFilter.connect(this.crowdChorus);
                
                this.arcadeSynth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "square" }
                }).toDestination();
            },
            playSnap: function() { 
                if(this.ready) this.noiseSynth.triggerAttackRelease("32n"); 
            },
            playHit: function() { 
                if(!this.ready) return; 
                this.hitSynth.triggerAttackRelease("C1", "8n"); 
                this.noiseSynth.triggerAttackRelease("16n"); 
            },
            playCrunch: function() {
                if(!this.ready) return;
                // Heavy, deep impact sound
                this.crunchSynth.triggerAttackRelease("8n");
                this.hitSynth.triggerAttackRelease("E0", "8n"); 
            },
            playKick: function() { 
                if(!this.ready) return; 
                this.hitSynth.triggerAttackRelease("G2", "8n"); 
            },
            playWhistle: function() { 
                if(!this.ready) return; 
                this.whistleSynth.triggerAttackRelease("C6", "16n"); 
                setTimeout(() => { if(this.ready) this.whistleSynth.triggerAttackRelease("C6", "8n"); }, 150);
            },
            playCheer: function(duration = "1m") { 
                if(!this.ready) return; 
                this.cheerSynth.triggerAttackRelease(duration); 
            },
            playRetroJingle: function(type) {
                if(!this.ready) return;
                const now = Tone.now();
                if(type === 'TD') {
                    this.arcadeSynth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                    this.arcadeSynth.triggerAttackRelease(["E4", "G4", "C5"], "8n", now + 0.2);
                    this.arcadeSynth.triggerAttackRelease(["G4", "C5", "E5"], "2n", now + 0.4);
                } else if(type === 'INT') {
                    this.arcadeSynth.triggerAttackRelease(["C4", "Gb3"], "16n", now);
                    this.arcadeSynth.triggerAttackRelease(["Bb3", "E3"], "16n", now + 0.1);
                    this.arcadeSynth.triggerAttackRelease(["Ab3", "D3"], "4n", now + 0.2);
                } else if(type === 'FG') {
                    this.arcadeSynth.triggerAttackRelease("C5", "8n", now);
                    this.arcadeSynth.triggerAttackRelease("G5", "4n", now + 0.2);
                }
            }
        };

        const getOffense = () => state.possession === 1 ? state.p1 : state.p2;
        const getDefense = () => state.possession === 1 ? state.p2 : state.p1;
        const getTeamData = (teamId) => teams.find(t => t.id === teamId);
        
        function getTeamLogoSVG(team, extraClasses = '') {
            if(!team) return '';
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="${extraClasses} drop-shadow-md">
                <path d="M 50 5 L 90 20 L 90 60 C 90 85 50 95 50 95 C 50 95 10 85 10 60 L 10 20 Z" fill="${team.color1}" stroke="${team.color2}" stroke-width="5"/>
                <path d="M 15 25 L 85 25 L 50 10 Z" fill="${team.color2}" opacity="0.6"/>
                <text x="50" y="58" font-family="Graduate, monospace" font-size="32" font-weight="bold" fill="#ffffff" stroke="#000000" stroke-width="1.5" text-anchor="middle" dominant-baseline="middle">${team.id}</text>
            </svg>`;
        }

        function formatClock(seconds) {
            if(seconds <= 0) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function logPlay(message) {
            state.playLog.unshift(message);
            const logEl = document.getElementById('game-log');
            logEl.innerHTML = state.playLog.map((msg, i) => 
                `<div class="border-b border-slate-700 pb-1 mb-1 ${i===0 ? 'text-white font-semibold' : ''}">${msg}</div>`
            ).join('');
        }

        function updateScoreboardUI() {
            document.getElementById('game-clock').innerText = formatClock(state.clock);
            document.getElementById('game-quarter').innerText = state.quarter > 4 ? 'Overtime' : `${state.quarter}${state.quarter === 1 ? 'st' : state.quarter === 2 ? 'nd' : state.quarter === 3 ? 'rd' : 'th'} Quarter`;
            
            document.getElementById('p1-score').innerText = state.p1.score;
            document.getElementById('p2-score').innerText = state.p2.score;
            
            document.getElementById('p1-timeouts').innerHTML = Array(state.p1.timeouts).fill('<div class="w-2 h-6 bg-yellow-400 rounded-sm shadow"></div>').join('');
            document.getElementById('p2-timeouts').innerHTML = Array(state.p2.timeouts).fill('<div class="w-2 h-6 bg-yellow-400 rounded-sm shadow"></div>').join('');

            document.getElementById('p1-possession').classList.toggle('hide', state.possession !== 1);
            document.getElementById('p2-possession').classList.toggle('hide', state.possession !== 2);

            for(let i=0; i<4; i++) {
                document.getElementById('p1-q-scores').cells[i+1].innerText = state.p1.qScores[i] !== undefined ? state.p1.qScores[i] : '-';
                document.getElementById('p2-q-scores').cells[i+1].innerText = state.p2.qScores[i] !== undefined ? state.p2.qScores[i] : '-';
            }
        }

        function getYardLineText() {
            if (state.gamePhase === 'PAT') return 'Ball on: 2 Yd Line';
            let teamName = state.ballOn <= 50 ? getOffense().team.id : getDefense().team.id;
            let line = state.ballOn <= 50 ? state.ballOn : 100 - state.ballOn;
            if (line === 50) return 'Ball on: 50';
            if (line === 0) return 'Goal Line';
            return `Ball on: ${teamName} ${line}`;
        }

        function getDownText() {
            if (state.gamePhase === 'KICKOFF') return 'Kickoff';
            if (state.gamePhase === 'PAT') return 'PAT Attempt';
            let distText = state.distance >= (100 - state.ballOn) ? 'Goal' : state.distance;
            let downStr = state.down === 1 ? '1st' : state.down === 2 ? '2nd' : state.down === 3 ? '3rd' : '4th';
            return `${downStr} & ${distText}`;
        }

        function renderField() {
            document.getElementById('down-distance').innerText = getDownText();
            document.getElementById('ball-on').innerText = getYardLineText();

            let drivingRight = false;
            if (state.possession === 1) {
                drivingRight = (state.quarter % 2 !== 0); 
            } else {
                drivingRight = (state.quarter % 2 === 0); 
            }

            const dirText = document.getElementById('drive-direction');
            if (dirText) {
                const offTeamName = getOffense().team.name;
                dirText.innerText = drivingRight ? `${offTeamName} Drives Left to Right ➡` : `⬅ ${offTeamName} Drives Right to Left`;
            }

            const gridiron = document.getElementById('gridiron');
            if(gridiron.querySelectorAll('.yard-number').length === 0) {
                [10, 20, 30, 40, 50, 40, 30, 20, 10].forEach((num, i) => {
                    const pct = (i + 1) * 10;
                    const span = document.createElement('div');
                    span.className = 'yard-number';
                    span.style.left = `${pct}%`;
                    span.innerText = num;
                    gridiron.appendChild(span);
                });
            }

            const los = document.getElementById('los-line');
            const firstDown = document.getElementById('first-down-line');
            const footballContainer = document.getElementById('football-container');

            const p1TeamData = getTeamData(state.p1.team.id);
            const p2TeamData = getTeamData(state.p2.team.id);
            
            const p1LogoBg = getTeamLogoSVG(p1TeamData, 'w-24 h-24 absolute opacity-25');
            const p2LogoBg = getTeamLogoSVG(p2TeamData, 'w-24 h-24 absolute opacity-25');

            document.getElementById('left-endzone').style.backgroundColor = p1TeamData.color1;
            document.getElementById('left-endzone').innerHTML = `${p1LogoBg}<span class="relative z-10">${p1TeamData.id}</span>`;
            
            document.getElementById('right-endzone').style.backgroundColor = p2TeamData.color1;
            document.getElementById('right-endzone').innerHTML = `${p2LogoBg}<span class="relative z-10">${p2TeamData.id}</span>`;

            const absLos = drivingRight ? state.ballOn : 100 - state.ballOn;
            const absFd = drivingRight ? state.ballOn + state.distance : 100 - (state.ballOn + state.distance);

            // Turn off container transition to snap ball to place instantly during resets
            footballContainer.style.transition = 'none';

            if (state.gamePhase === 'KICKOFF') {
                los.classList.remove('hide');
                los.style.left = `${absLos}%`;
                firstDown.classList.add('hide');
                footballContainer.classList.remove('hide');
                footballContainer.style.left = `${absLos}%`;
            } else if (state.gamePhase === 'PAT') {
                let patSpot = 98; 
                let absPat = drivingRight ? patSpot : 100 - patSpot;
                los.classList.remove('hide');
                los.style.left = `${absPat}%`;
                firstDown.classList.add('hide');
                footballContainer.classList.remove('hide');
                footballContainer.style.left = `${absPat}%`;
            } else {
                los.classList.remove('hide');
                firstDown.classList.remove('hide');
                footballContainer.classList.remove('hide');
                
                los.style.left = `${absLos}%`;
                firstDown.style.left = `${absFd}%`;
                if(state.ballOn + state.distance > 100) firstDown.classList.add('hide');
                
                footballContainer.style.left = `${absLos}%`;
            }

            // Force reflow to re-enable transitions
            void footballContainer.offsetWidth; 
        }

        function renderActionPanel() {
            const panel = document.getElementById('action-content');
            const title = document.getElementById('action-title');
            
            if (state.gamePhase === 'GAME_OVER') {
                title.innerText = "Game Over";
                panel.innerHTML = `<h3 class="text-3xl font-bold text-emerald-400">Final Score</h3>
                                   <p class="text-xl mt-2">${getOffense().team.name}: ${getOffense().score}</p>
                                   <p class="text-xl">${getDefense().team.name}: ${getDefense().score}</p>`;
                return;
            }

            if (state.turnPhase === 'OFFENSE_SELECT') {
                let off = getOffense();
                title.innerText = `Player ${off.isP1 ? '1' : '2'} (${off.team.id}) - Call Offense`;
                
                let pbs = [];
                if (state.gamePhase === 'KICKOFF') pbs = playbooks.kickoff_offense;
                else if (state.gamePhase === 'PAT') pbs = playbooks.pat_offense;
                else if (state.down === 4) pbs = [...playbooks.offense_4th, ...playbooks.offense_normal];
                else pbs = playbooks.offense_normal;

                let options = pbs.map(p => `<option value="${p.id}">${p.name} - ${p.desc}</option>`).join('');
                let timeoutBtn = off.timeouts > 0 ? `<button id="btn-timeout" class="text-xs bg-yellow-600 hover:bg-yellow-500 text-white py-1 px-3 rounded mt-2">Call Timeout (${off.timeouts} left)</button>` : '';

                panel.innerHTML = `
                    <div class="text-slate-300 mb-2 italic text-sm">Select your play and lock it in secretly.</div>
                    <select id="play-select" class="w-full max-w-sm bg-slate-700 border border-slate-600 rounded p-3 text-white focus:ring-2 focus:ring-blue-500 text-lg">
                        ${options}
                    </select>
                    <button id="btn-lock-play" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-bold text-lg mt-4 shadow-lg w-full max-w-sm">Lock In Play</button>
                    ${timeoutBtn}
                `;
                
                document.getElementById('btn-lock-play').onclick = () => {
                    state.offensePlay = document.getElementById('play-select').value;
                    state.turnPhase = 'PASS_TO_DEFENSE';
                    renderActionPanel();
                };
                if(document.getElementById('btn-timeout')) {
                    document.getElementById('btn-timeout').onclick = () => callTimeout(off);
                }

            } else if (state.turnPhase === 'PASS_TO_DEFENSE') {
                title.innerText = "Play Locked!";
                let def = getDefense();
                panel.innerHTML = `
                    <div class="text-2xl mb-4">🏈</div>
                    <p class="text-lg text-yellow-400 font-bold mb-4">Pass the device to Player ${def.isP1 ? '1' : '2'} (${def.team.id})</p>
                    <button id="btn-im-ready" class="bg-slate-600 hover:bg-slate-500 text-white px-6 py-2 rounded-lg font-bold text-lg shadow">I am ready - Call Defense</button>
                `;
                document.getElementById('btn-im-ready').onclick = () => {
                    state.turnPhase = 'DEFENSE_SELECT';
                    renderActionPanel();
                };

            } else if (state.turnPhase === 'DEFENSE_SELECT') {
                let def = getDefense();
                title.innerText = `Player ${def.isP1 ? '1' : '2'} (${def.team.id}) - Call Defense`;
                
                let pbs = [];
                if (state.gamePhase === 'KICKOFF') pbs = playbooks.kickoff_defense;
                else if (state.gamePhase === 'PAT') pbs = playbooks.pat_defense;
                else if (['punt', 'fg'].includes(state.offensePlay)) pbs = playbooks.defense_special;
                else pbs = playbooks.defense_normal;

                let options = pbs.map(p => `<option value="${p.id}">${p.name} - ${p.desc}</option>`).join('');
                let timeoutBtn = def.timeouts > 0 ? `<button id="btn-timeout" class="text-xs bg-yellow-600 hover:bg-yellow-500 text-white py-1 px-3 rounded mt-2">Call Timeout (${def.timeouts} left)</button>` : '';

                panel.innerHTML = `
                    <select id="play-select" class="w-full max-w-sm bg-slate-700 border border-slate-600 rounded p-3 text-white focus:ring-2 focus:ring-red-500 text-lg">
                        ${options}
                    </select>
                    <button id="btn-lock-play" class="bg-red-600 hover:bg-red-500 text-white px-6 py-2 rounded-lg font-bold text-lg mt-4 shadow-lg w-full max-w-sm">Lock In Defense</button>
                    ${timeoutBtn}
                `;
                document.getElementById('btn-lock-play').onclick = () => {
                    state.defensePlay = document.getElementById('play-select').value;
                    state.turnPhase = 'READY_TO_SNAP';
                    renderActionPanel();
                };
                if(document.getElementById('btn-timeout')) {
                    document.getElementById('btn-timeout').onclick = () => callTimeout(def);
                }

            } else if (state.turnPhase === 'READY_TO_SNAP') {
                title.innerText = "Plays Locked In!";
                panel.innerHTML = `
                    <div class="text-center">
                        <p class="text-slate-300 mb-6">Both players are ready.</p>
                        <button id="btn-snap" class="bg-emerald-600 hover:bg-emerald-500 text-white px-8 py-4 rounded-xl font-black text-2xl shadow-xl transform transition hover:scale-105 border-b-4 border-emerald-800 active:border-b-0 active:translate-y-1 w-full max-w-xs uppercase tracking-widest">Snap Ball</button>
                    </div>
                `;
                document.getElementById('btn-snap').onclick = () => {
                    const snapBtn = document.getElementById('btn-snap');
                    snapBtn.innerText = "Snapping...";
                    snapBtn.disabled = true;
                    
                    SoundEngine.playSnap();
                    setTimeout(() => { resolvePlay(); }, 400);
                };
            }
        }

        function callTimeout(teamState) {
            if (teamState.timeouts <= 0) return;
            teamState.timeouts--;
            logPlay(`${teamState.team.name} calls a Timeout.`);
            SoundEngine.playWhistle();
            updateScoreboardUI();
            renderActionPanel();
        }

        function resolvePlay() {
            let oPlay = state.offensePlay;
            let dPlay = state.defensePlay;
            let off = getOffense();
            let def = getDefense();
            
            // Build the result payload for the animator/applier
            let result = { 
                text: '', yards: 0, turnover: false, clockTicked: 15, 
                points: 0, newPhase: null, animType: 'run', specialEvent: null, ballEndPos: null,
                crunch: false, homeCheer: false
            };

            if (state.gamePhase === 'KICKOFF') {
                result.animType = 'kick';
                if (oPlay === 'kickoff') {
                    let stBonus = (off.team.stRating - 80);
                    let touchbackChance = 0.7 + (stBonus * 0.01);
                    
                    if(Math.random() < touchbackChance) {
                        result.yards = 65;
                        result.text = `${off.team.id} kicks off. Touchback.`;
                        result.turnover = true;
                        result.clockTicked = 5;
                        result.newBallOn = 30; 
                        result.ballEndPos = 100; // Ball travels deep
                    } else {
                        let returnSpot = 15 + Math.floor(Math.random() * 15) - Math.round(stBonus * 0.2); 
                        result.text = `${off.team.id} kicks off... Returned to the ${returnSpot} yard line!`;
                        result.turnover = true;
                        result.clockTicked = 10;
                        result.newBallOn = Math.max(1, returnSpot);
                        result.ballEndPos = result.newBallOn;
                    }
                } else if (oPlay === 'onside') {
                    let recover = Math.random() < 0.15;
                    result.ballEndPos = 45; // Travels 10 yards (35+10)
                    if(recover) {
                        result.text = `ONSIDE KICK RECOVERED BY ${off.team.id}!`;
                        result.turnover = false;
                    } else {
                        result.text = `Onside kick failed. ${def.team.id} recovers.`;
                        result.newBallOn = 45; 
                        result.turnover = true;
                    }
                    result.clockTicked = 3;
                }
                result.newPhase = 'NORMAL';
            } 
            else if (state.gamePhase === 'PAT') {
                result.animType = 'kick';
                if (oPlay === 'xp') {
                    if (Math.random() < 0.95) { 
                        result.text = "Extra Point is GOOD."; result.points = 1; result.specialEvent = 'FG_GOOD'; 
                    } else { 
                        result.text = "Extra Point MISSED."; 
                    }
                } else if (oPlay === '2pt') {
                    result.animType = 'pass';
                    if (Math.random() < 0.45) { 
                        result.text = "2-Point Conversion is SUCCESSFUL!"; result.points = 2; result.specialEvent = 'TD';
                    } else { 
                        result.text = "2-Point Conversion FAILED."; 
                    }
                }
                result.newPhase = 'KICKOFF'; 
                result.turnover = true;
                result.newBallOn = 35; 
                result.clockTicked = 0;
                result.ballEndPos = 100; // Into endzone
            }
            else if (oPlay === 'punt') {
                result.animType = 'kick';
                let stBonus = Math.round((off.team.stRating - 80) * 0.4);
                let puntYards = Math.floor(Math.random() * 20) + 35 + stBonus; 
                result.text = `${off.team.id} punts the ball ${puntYards} yards.`;
                result.turnover = true;
                result.clockTicked = 10;
                
                let receiveSpot = state.ballOn + puntYards;
                result.ballEndPos = receiveSpot;
                if(receiveSpot >= 100) {
                    result.text += " Touchback.";
                    result.newBallOn = 20; 
                } else {
                    result.newBallOn = 100 - receiveSpot;
                }
            }
            else if (oPlay === 'fg') {
                result.animType = 'kick';
                let kickDist = (100 - state.ballOn) + 17; 
                let chance = 1.0;
                if(kickDist > 65) chance = 0.05;
                else if(kickDist > 55) chance = 0.4;
                else if(kickDist > 45) chance = 0.7;
                else if(kickDist > 35) chance = 0.9;
                
                // Special Teams rating modifier
                let stBonus = (off.team.stRating - 80) * 0.015;
                chance += stBonus;
                chance = Math.max(0.01, Math.min(0.99, chance));
                
                result.ballEndPos = 105; // Through uprights
                if (Math.random() < chance) {
                    result.text = `${kickDist}-yard Field Goal is GOOD!`;
                    result.points = 3;
                    result.newPhase = 'KICKOFF';
                    result.turnover = true;
                    result.newBallOn = 35;
                    result.specialEvent = 'FG_GOOD';
                } else {
                    result.text = `${kickDist}-yard Field Goal MISSED.`;
                    result.turnover = true;
                    let kickSpotRelative = state.ballOn - 7;
                    let newTeamSpot = 100 - kickSpotRelative;
                    if (newTeamSpot < 20) newTeamSpot = 20;
                    result.newBallOn = newTeamSpot;
                }
                result.clockTicked = 5;
            }
            else {
                let chanceComplete = 1, minYds = 0, maxYds = 0, chanceTO = 0.01, chanceSack = 0.02;
                result.animType = oPlay.includes('run') ? 'run' : 'pass';

                let ratingDiff = off.team.offRating - def.team.defRating;

                if (oPlay === 'run_inside') {
                    if (dPlay === 'def_run') { minYds = -1; maxYds = 3; }
                    else if (dPlay === 'blitz') { minYds = -3; maxYds = 5; chanceTO = 0.04; }
                    else if (dPlay === 'def_pass') { minYds = 3; maxYds = 8; }
                    else if (dPlay === 'prevent') { minYds = 5; maxYds = 12; }
                } else if (oPlay === 'run_outside') {
                    if (dPlay === 'def_run') { minYds = -3; maxYds = 2; }
                    else if (dPlay === 'blitz') { minYds = -5; maxYds = 15; chanceTO = 0.05; }
                    else if (dPlay === 'def_pass') { minYds = 2; maxYds = 12; }
                    else if (dPlay === 'prevent') { minYds = 4; maxYds = 20; }
                } else if (oPlay === 'pass_short') {
                    if (dPlay === 'def_run') { chanceComplete = 0.8; minYds = 4; maxYds = 12; }
                    else if (dPlay === 'blitz') { chanceComplete = 0.75; chanceSack = 0.1; minYds = 5; maxYds = 15; chanceTO = 0.04;}
                    else if (dPlay === 'def_pass') { chanceComplete = 0.6; minYds = 2; maxYds = 8; chanceTO = 0.03; }
                    else if (dPlay === 'prevent') { chanceComplete = 0.9; minYds = 3; maxYds = 7; }
                } else if (oPlay === 'pass_med') {
                    if (dPlay === 'def_run') { chanceComplete = 0.7; minYds = 10; maxYds = 25; chanceSack = 0.05; }
                    else if (dPlay === 'blitz') { chanceComplete = 0.6; chanceSack = 0.15; minYds = 12; maxYds = 30; chanceTO = 0.06; }
                    else if (dPlay === 'def_pass') { chanceComplete = 0.5; minYds = 8; maxYds = 18; chanceTO = 0.05; }
                    else if (dPlay === 'prevent') { chanceComplete = 0.8; minYds = 5; maxYds = 12; }
                } else if (oPlay === 'pass_deep') {
                    if (dPlay === 'def_run') { chanceComplete = 0.5; minYds = 25; maxYds = 50; chanceSack = 0.05; }
                    else if (dPlay === 'blitz') { chanceComplete = 0.35; chanceSack = 0.25; minYds = 30; maxYds = 60; chanceTO = 0.10; }
                    else if (dPlay === 'def_pass') { chanceComplete = 0.4; minYds = 20; maxYds = 40; chanceTO = 0.08; }
                    else if (dPlay === 'prevent') { chanceComplete = 0.2; minYds = 15; maxYds = 25; chanceTO = 0.02; chanceSack = 0.1; }
                }

                // Apply Team Rating Modifiers mathematically
                let yardMod = Math.round(ratingDiff * 0.15); 
                maxYds += Math.max(-8, yardMod);
                minYds += Math.max(-3, Math.round(ratingDiff * 0.05));
                chanceTO -= (ratingDiff * 0.001); 
                chanceSack -= (ratingDiff * 0.0015);
                if (!oPlay.includes('run')) chanceComplete += (ratingDiff * 0.005);

                // Constrain values to realistic physical boundaries
                chanceTO = Math.max(0.005, Math.min(0.25, chanceTO));
                chanceSack = Math.max(0.01, Math.min(0.3, chanceSack));
                chanceComplete = Math.max(0.1, Math.min(0.95, chanceComplete));

                let rand = Math.random();
                if (rand < chanceTO) {
                    result.turnover = true;
                    result.text = oPlay.includes('run') ? "FUMBLE! Defense recovers." : "INTERCEPTED!";
                    let toSpot = state.ballOn + Math.floor(Math.random() * 10); 
                    result.ballEndPos = toSpot;
                    result.newBallOn = 100 - toSpot;
                    if(result.newBallOn < 0) result.newBallOn = 20;
                    result.clockTicked = 8;
                    if(!oPlay.includes('run')) result.specialEvent = 'INT';
                } else if (rand < chanceTO + chanceSack) {
                    let sackYds = Math.floor(Math.random() * 6) + 3;
                    result.yards = -sackYds;
                    result.text = `SACKED! Loss of ${sackYds} yards.`;
                    result.clockTicked = 25;
                    result.animType = 'run'; // QB moves backwards linearly
                    result.crunch = true;
                } else if (rand < chanceTO + chanceSack + (1 - chanceComplete)) {
                    result.text = "Incomplete pass.";
                    result.clockTicked = 5;
                    // Pass animates, but stops halfway or hits ground
                    result.ballEndPos = state.ballOn + minYds + 5; 
                } else {
                    result.yards = Math.floor(Math.random() * (maxYds - minYds + 1)) + minYds;
                    result.text = `Gain of ${result.yards} yards.`;
                    if (result.yards >= 15) result.text = `BIG PLAY! ` + result.text;
                    if (result.yards < 0) {
                        result.text = `Tackled for a loss of ${Math.abs(result.yards)} yards.`;
                        result.crunch = true;
                    }
                    result.clockTicked = Math.floor(Math.random() * 15) + 15;
                    
                    // Check for standard offensive Touchdown
                    if (state.ballOn + result.yards >= 100) {
                        result.specialEvent = 'TD';
                    }
                }
            }

            // Default ending position if not overwritten
            if(result.ballEndPos === null) {
                result.ballEndPos = state.ballOn + result.yards;
            }

            // Calculate context-based crowd cheers for Home Team (P1)
            let isHomeOffense = off.isP1;
            let isHomeDefense = def.isP1;
            let isBigGain = result.yards >= 10;
            let isFirstDown = result.yards >= state.distance && state.gamePhase === 'NORMAL';
            let isTD = result.specialEvent === 'TD' || result.points > 0;
            let isSackOrLoss = result.crunch;
            let isTurnover = result.turnover;

            if (isHomeOffense && (isBigGain || isFirstDown || isTD)) {
                result.homeCheer = true;
            } else if (isHomeDefense && (isSackOrLoss || isTurnover)) {
                result.homeCheer = true;
            }

            // Route to visualization before logic application
            executePlayAnimation(result, () => {
                applyPlayResult(result);
            });
        }

        function getRetroSVG(type) {
            if (type === 'TD') {
                return `<svg viewBox="0 0 16 16" class="w-full h-full" shape-rendering="crispEdges">
                    <rect x="7" y="1" width="2" height="2" fill="#FCD34D" />

                    <rect x="4" y="3" width="2" height="1" fill="#3B82F6" />

                    <rect x="11" y="2" width="1" height="2" fill="#3B82F6" />

                    <rect x="4" y="1" width="1" height="2" fill="#EF4444" />
                    <rect x="10" y="2" width="2" height="1" fill="#EF4444" />
                    <rect x="11" y="1" width="1" height="2" fill="#EF4444" />

                </svg>`;
            }
            return '';
        }

        function executePlayAnimation(result, callback) {
            let drivingRight = (state.possession === 1 && state.quarter % 2 !== 0) || (state.possession === 2 && state.quarter % 2 === 0);
            
            let endAbs = drivingRight ? result.ballEndPos : 100 - result.ballEndPos;
            endAbs = Math.max(0, Math.min(100, endAbs));

            const fbContainer = document.getElementById('football-container');
            const fbIcon = document.getElementById('football-icon');

            // Play initial kick/throw sound
            if (result.animType === 'kick') SoundEngine.playKick();

            // Set up horizontal linear movement
            fbContainer.style.transition = 'left 1s linear';
            fbContainer.style.left = `${endAbs}%`;

            // Apply parabolic arc for passes/kicks
            if (result.animType === 'pass' || result.animType === 'kick') {
                fbIcon.classList.add('anim-pass');
            }

            setTimeout(() => {
                // Ball landed/arrived
                fbIcon.classList.remove('anim-pass');
                
                // Play dynamic tackle/hit sounds
                if (result.animType !== 'kick') {
                    if (result.crunch) {
                        SoundEngine.playCrunch();
                    } else {
                        SoundEngine.playHit();
                    }
                }

                // Trigger Contextual Home Crowd Cheer
                if (result.homeCheer && !result.specialEvent) {
                    SoundEngine.playCheer("2m"); // Standard play cheer
                }

                if (result.specialEvent) {
                    // Trigger Retro Cutscene
                    const overlay = document.getElementById('cutscene-overlay');
                    const textEl = document.getElementById('cutscene-text');
                    const graphicEl = document.getElementById('cutscene-graphic');
                    
                    if (result.specialEvent === 'TD') {
                        textEl.innerText = "TOUCHDOWN!";
                        textEl.className = "text-5xl md:text-7xl font-black text-yellow-400 retro-text uppercase text-center mb-8 animate-pulse";
                        graphicEl.innerHTML = getRetroSVG('TD');
                    } else if (result.specialEvent === 'INT') {
                        textEl.innerText = "INTERCEPTED!";
                        textEl.className = "text-5xl md:text-7xl font-black text-red-500 retro-text uppercase text-center mb-8";
                        graphicEl.innerHTML = getRetroSVG('INT');
                    } else if (result.specialEvent === 'FG_GOOD') {
                        textEl.innerText = "IT'S GOOD!";
                        textEl.className = "text-5xl md:text-7xl font-black text-emerald-400 retro-text uppercase text-center mb-8";
                        graphicEl.innerHTML = getRetroSVG('FG_GOOD');
                    }

                    overlay.classList.remove('hide');
                    SoundEngine.playRetroJingle(result.specialEvent);

                    setTimeout(() => {
                        overlay.classList.add('hide');
                        callback();
                    }, 2800);

                } else {
                    // Standard resolution
                    callback();
                }
            }, 1000); // 1 second animation duration
        }

        function applyPlayResult(result) {
            let off = getOffense();
            let def = getDefense();
            let prevBallOn = state.ballOn;
            
            logPlay(`[${getDownText()}] ${result.text}`);

            state.clock -= result.clockTicked;
            if (state.clock <= 0) {
                state.clock = 0;
                logPlay(`END OF QUARTER ${state.quarter}`);
            }

            if (result.points > 0) {
                off.score += result.points;
                off.qScores[state.quarter - 1] += result.points;
                setTimeout(() => SoundEngine.playCheer(), 400);
            }

            if (!result.turnover && state.gamePhase === 'NORMAL') {
                state.ballOn += result.yards;
                
                if (state.ballOn >= 100) {
                    logPlay(`TOUCHDOWN ${off.team.name}!`);
                    if(result.points === 0) { // If normal TD and points weren't added directly yet
                        off.score += 6;
                        off.qScores[state.quarter - 1] += 6;
                        setTimeout(() => SoundEngine.playCheer(), 400);
                    }
                    state.gamePhase = 'PAT';
                } 
                else if (state.ballOn <= 0) {
                    logPlay(`SAFETY! Tackled in the endzone.`);
                    def.score += 2;
                    def.qScores[state.quarter - 1] += 2;
                    setTimeout(() => SoundEngine.playWhistle(), 800);
                    result.turnover = true;
                    result.newBallOn = 30;
                }
                else {
                    if (state.ballOn - prevBallOn >= state.distance) {
                        logPlay("First Down!");
                        state.down = 1;
                        state.distance = 10;
                    } else {
                        state.down++;
                        state.distance -= result.yards;
                        if (state.down > 4) {
                            logPlay("Turnover on downs!");
                            result.turnover = true;
                            result.newBallOn = 100 - state.ballOn;
                        }
                    }
                }
            }

            if (result.newPhase) state.gamePhase = result.newPhase;
            
            if (result.turnover) {
                state.possession = state.possession === 1 ? 2 : 1;
                state.ballOn = result.newBallOn !== undefined ? result.newBallOn : 100 - state.ballOn;
                state.down = 1;
                state.distance = 10;
            }

            if (state.clock === 0) {
                if (state.quarter === 2) {
                    logPlay("HALFTIME");
                    state.quarter++;
                    state.clock = 900;
                    state.p1.timeouts = 3; state.p2.timeouts = 3;
                    state.gamePhase = 'KICKOFF'; 
                    state.possession = 2; 
                    state.ballOn = 35;
                    state.down = 1; state.distance = 10;
                } else if (state.quarter === 4) {
                    if (state.p1.score === state.p2.score) {
                        logPlay("OVERTIME");
                        state.quarter++;
                        state.clock = 600; 
                        state.gamePhase = 'KICKOFF';
                        state.possession = Math.random() < 0.5 ? 1 : 2; 
                        state.ballOn = 35;
                        state.down = 1; state.distance = 10;
                    } else {
                        state.gamePhase = 'GAME_OVER';
                    }
                } else {
                    state.quarter++;
                    state.clock = 900;
                }
                setTimeout(() => SoundEngine.playWhistle(), 1000);
            }

            if (state.ballOn + state.distance > 100) {
                state.distance = 100 - state.ballOn;
            }

            state.offensePlay = null;
            state.defensePlay = null;
            state.turnPhase = 'OFFENSE_SELECT';

            updateScoreboardUI();
            renderField();
            renderActionPanel();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const p1Select = document.getElementById('p1-team');
            const p2Select = document.getElementById('p2-team');
            
            function updateSetupLogos() {
                const t1 = getTeamData(p1Select.value);
                const t2 = getTeamData(p2Select.value);
                document.getElementById('p1-logo-preview').innerHTML = getTeamLogoSVG(t1, 'w-full h-full');
                document.getElementById('p2-logo-preview').innerHTML = getTeamLogoSVG(t2, 'w-full h-full');
            }

            teams.forEach((t, index) => {
                let text = `${t.name} (OFF: ${t.offRating} | DEF: ${t.defRating} | ST: ${t.stRating})`;
                let opt1 = new Option(text, t.id);
                let opt2 = new Option(text, t.id);
                if(index === 0) opt1.selected = true;
                if(index === 1) opt2.selected = true;
                p1Select.add(opt1);
                p2Select.add(opt2);
            });
            
            p1Select.addEventListener('change', updateSetupLogos);
            p2Select.addEventListener('change', updateSetupLogos);
            updateSetupLogos();

            document.getElementById('start-game-btn').addEventListener('click', async () => {
                let t1Id = p1Select.value;
                let t2Id = p2Select.value;

                if(t1Id === t2Id) {
                    alert("Please select different teams.");
                    return;
                }

                await SoundEngine.init();
                SoundEngine.playWhistle();

                state.p1.team = getTeamData(t1Id);
                state.p2.team = getTeamData(t2Id);
                
                document.getElementById('p1-name').innerText = state.p1.team.id;
                document.getElementById('p2-name').innerText = state.p2.team.id;
                document.getElementById('p1-abbr').innerText = state.p1.team.id;
                document.getElementById('p2-abbr').innerText = state.p2.team.id;
                
                document.getElementById('p1-logo').innerHTML = getTeamLogoSVG(state.p1.team, 'w-full h-full');
                document.getElementById('p2-logo').innerHTML = getTeamLogoSVG(state.p2.team, 'w-full h-full');

                document.getElementById('p1-score-panel').style.borderBottomColor = state.p1.team.color1;
                document.getElementById('p1-score-panel').style.borderBottomWidth = "4px";
                document.getElementById('p2-score-panel').style.borderBottomColor = state.p2.team.color1;
                document.getElementById('p2-score-panel').style.borderBottomWidth = "4px";

                state.possession = Math.random() < 0.5 ? 1 : 2;
                logPlay(`Coin toss won by ${getOffense().team.name}. They elect to kick.`);
                
                document.getElementById('setup-screen').classList.add('hide');
                document.getElementById('game-screen').classList.remove('hide');

                updateScoreboardUI();
                renderField();
                renderActionPanel();
            });
        });
    </script>
</body>
