<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aleph-Bet Adventure - Hebrew Learning Game</title>
  <!-- Google Fonts & Canvas Confetti -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    :root {
      --primary: #4A90E2;
      --primary-dark: #2B6CB0;
      --secondary: #FF6B6B;
      --accent: #FFD166;
      --success: #06D6A0;
      --purple: #8338EC;
      --bg: #F0F4F8;
      --card-bg: #FFFFFF;
      --text: #2D3748;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Fredoka', cursive, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; padding: 15px; display: flex; flex-direction: column; align-items: center; }

    /* Header & Top Bar */
    header {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.4rem; font-weight: 700; color: var(--primary-dark); }
    .stats-bar { display: flex; align-items: center; gap: 12px; }
    .stat-badge {
      background: #EDF2F7;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
    }
    .stat-badge.coins { background: #FEFCBF; color: #744210; }
    .stat-badge.streak { background: #FEEBC8; color: #9C4221; }

    /* Track Selection UI */
    .track-container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 15px 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      text-align: center;
    }
    .track-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 700;
      color: #718096;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .track-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .track-btn {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 12px;
      border: 2px solid #CBD5E0;
      background: #FFFFFF;
      color: #4A5568;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .track-sub { font-size: 0.72rem; font-weight: 400; opacity: 0.85; }
    .track-btn:hover { border-color: var(--primary); color: var(--primary-dark); transform: translateY(-2px); }
    .track-btn.active {
      background: var(--primary);
      border-color: var(--primary-dark);
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.35);
    }

    /* Main Container & Board */
    main { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; }

    .game-board {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.06);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      position: relative;
    }

    .tile {
      aspect-ratio: 1;
      border-radius: 14px;
      background: #E2E8F0;
      border: 3px solid #CBD5E0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
      position: relative;
      font-weight: 700;
      font-size: 0.85rem;
      color: #4A5568;
      transition: transform 0.2s ease;
    }
    .tile.start { background: #C6F6D5; border-color: var(--success); }
    .tile.boss { background: #FED7D7; border-color: var(--secondary); }
    .tile.trap { background: #FEFCBF; border-color: var(--accent); }
    .tile.chest { background: #E9D8FD; border-color: var(--purple); }

    .tile-num { font-size: 0.75rem; opacity: 0.7; }
    .tile-icon { font-size: 1.4rem; }

    /* Player Token on Board */
    .player-token {
      width: 36px;
      height: 36px;
      background: #FFFFFF;
      border: 3px solid var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 10;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .player-token.jump { animation: jumpAnim 0.4s ease; }

    @keyframes jumpAnim {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -90%) scale(1.2); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }

    /* Controls & Actions */
    .controls {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      flex-wrap: wrap;
      gap: 10px;
    }

    .level-select {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 2px solid #CBD5E0;
      font-size: 0.95rem;
      outline: none;
      background: white;
      cursor: pointer;
    }

    .action-btn {
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .action-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .nav-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 2px solid #CBD5E0;
      background: white;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: #EDF2F7; }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 15px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-card { transform: scale(1); }

    .question-prompt {
      font-size: 1.25rem;
      margin: 15px 0;
      font-weight: 700;
      color: #2D3748;
    }
    .hebrew-text {
      font-family: 'Rubik', sans-serif;
      font-size: 2.2rem;
      color: var(--primary-dark);
      margin: 10px 0;
      direction: rtl;
    }

    .audio-btn {
      background: #EBF8FF;
      border: 2px solid #90CDF4;
      color: #2B6CB0;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      margin: 0 auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .audio-btn:hover { background: #BEE3F8; transform: scale(1.05); }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .option-btn {
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #E2E8F0;
      background: #F7FAFC;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      direction: rtl;
    }
    .option-btn:hover { border-color: var(--primary); background: #EBF8FF; }

    /* Boss Battle Header Overlay */
    .boss-header {
      background: #FFF5F5;
      border: 2px solid #FEB2B2;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .boss-avatar { font-size: 2.5rem; }
    .boss-hp-bar {
      flex: 1;
      height: 14px;
      background: #EDF2F7;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid #CBD5E0;
    }
    .boss-hp-fill {
      height: 100%;
      background: var(--secondary);
      width: 100%;
      transition: width 0.3s ease;
    }

    /* Shop & Bestiary Grid */
    .shop-grid, .bestiary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
      max-height: 320px;
      overflow-y: auto;
      padding: 10px;
      margin: 15px 0;
    }
    .shop-item, .bestiary-item {
      border: 2px solid #E2E8F0;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .shop-item.equipped { border-color: var(--success); background: #F0FFF4; }
  </style>
</head>
<body>

  <!-- Header Section -->
  <header>
    <div class="brand">
      <span>📜</span> Aleph-Bet Adventure
    </div>
    <div class="stats-bar">
      <div class="stat-badge coins" id="coin-display">🪙 0</div>
      <div class="stat-badge streak" id="streak-display">🔥 Track: BEGINNER</div>
      <button class="nav-btn" onclick="openShop()">🏪 Shop</button>
      <button class="nav-btn" onclick="openTrophyRoom()">🏆 Bestiary</button>
    </div>
  </header>

  <!-- Track Selector -->
  <div class="track-container">
    <span class="track-label">Select Learning Track:</span>
    <div class="track-buttons">
      <button class="track-btn active" id="btn-beginner" onclick="switchTrack('beginner')">
        🌱 Beginner<span class="track-sub">Aleph-Bet & Vowels</span>
      </button>
      <button class="track-btn" id="btn-intermediate" onclick="switchTrack('intermediate')">
        🚀 Intermediate<span class="track-sub">Phonetics & Vocabulary</span>
      </button>
      <button class="track-btn" id="btn-advanced" onclick="switchTrack('advanced')">
        🏆 Advanced<span class="track-sub">Sentences & Fluency</span>
      </button>
    </div>
  </div>

  <!-- Main Game Board -->
  <main>
    <div class="game-board" id="board">
      <div class="player-token" id="player-token">🦁</div>
      <!-- 20 Tiles (0 to 19) rendered by JS -->
    </div>

    <div class="controls">
      <div class="level-select">
        <label for="level-dropdown">Level:</label>
        <select id="level-dropdown" onchange="changeLevel(this.value)">
          <option value="1">Level 1</option>
          <option value="2">Level 2</option>
          <option value="3">Level 3</option>
          <option value="4">Level 4</option>
          <option value="5">Level 5</option>
          <option value="6">Level 6</option>
          <option value="7">Level 7</option>
          <option value="8">Level 8</option>
          <option value="9">Level 9</option>
          <option value="10">Level 10</option>
          <option value="11">Level 11</option>
          <option value="12">Level 12</option>
        </select>
      </div>

      <button class="action-btn" id="roll-btn" onclick="rollDice()">
        🎲 Roll Die (<span id="dice-val">?</span>)
      </button>
    </div>
  </main>

  <!-- Question / Encounter Modal -->
  <div class="modal-overlay" id="question-modal">
    <div class="modal-card">
      <div id="boss-overlay-header" style="display: none;">
        <div class="boss-header">
          <div class="boss-avatar" id="boss-avatar-icon">🐉</div>
          <div style="flex:1; text-align: left;">
            <strong id="boss-name">Level Boss</strong>
            <div class="boss-hp-bar">
              <div class="boss-hp-fill" id="boss-hp-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="question-prompt" id="q-prompt">Which letter is 'Aleph'?</div>
      <div class="hebrew-text" id="q-hebrew" style="display: none;">א</div>
      <button class="audio-btn" id="audio-pronounce-btn" onclick="speakCurrentQuestion()">🔊</button>

      <div class="options-grid" id="options-container">
        <!-- Option buttons generated by JS -->
      </div>
    </div>
  </div>

  <!-- Shop Modal -->
  <div class="modal-overlay" id="shop-modal">
    <div class="modal-card">
      <h2>🏪 Avatar Shop</h2>
      <p style="font-size:0.9rem; color:#718096; margin-top:4px;">Unlock avatars with your earned coins!</p>
      <div class="shop-grid" id="shop-items-container"></div>
      <button class="nav-btn" style="margin: 0 auto;" onclick="closeModal('shop-modal')">Close</button>
    </div>
  </div>

  <!-- Trophy Room / Bestiary Modal -->
  <div class="modal-overlay" id="trophy-modal">
    <div class="modal-card">
      <h2>🏆 Boss Bestiary</h2>
      <p style="font-size:0.9rem; color:#718096; margin-top:4px;">Defeat Level Bosses to collect them!</p>
      <div class="bestiary-grid" id="bestiary-container"></div>
      <button class="nav-btn" style="margin: 0 auto;" onclick="closeModal('trophy-modal')">Close</button>
    </div>
  </div>

  <script>
    // --- Web Audio Synthesizer ---
    class SoundFX {
      constructor() { this.ctx = null; }
      init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      playTone(freq, type, duration) {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }
      roll() { this.playTone(300, 'square', 0.15); }
      correct() { this.playTone(523.25, 'sine', 0.2); setTimeout(() => this.playTone(659.25, 'sine', 0.3), 150); }
      wrong() { this.playTone(180, 'sawtooth', 0.3); }
      bossHit() { this.playTone(120, 'square', 0.4); }
    }
    const sfx = new SoundFX();

    // --- State Management ---
    let currentTrack = localStorage.getItem('hebrew_game_track') || 'beginner';
    let currentLevel = parseInt(localStorage.getItem('hebrew_game_level'), 10) || 1;
    let playerPosition = 0;
    let coins = parseInt(localStorage.getItem('hebrew_coins'), 10) || 0;
    let currentAvatar = localStorage.getItem('hebrew_avatar') || '🦁';
    let unlockedAvatars = JSON.parse(localStorage.getItem('hebrew_unlocked_avatars')) || ['🦁'];
    let bestiary = JSON.parse(localStorage.getItem('hebrew_bestiary')) || [];
    let gameQuestions = [];
    let activeQuestion = null;
    let bossHP = 3;

    const AVATARS = [
      { icon: '🦁', price: 0 },
      { icon: '🦊', price: 50 },
      { icon: '🦄', price: 100 },
      { icon: '🤖', price: 150 },
      { icon: '🐉', price: 250 }
    ];

    const BOSSES = [
      { level: 1, name: 'Aleph Golem', icon: '🗿' },
      { level: 2, name: 'Vowel Viper', icon: '🐍' },
      { level: 3, name: 'Sofit Shadow', icon: '👤' },
      { level: 4, name: 'Kamatz Kraken', icon: '🐙' },
      { level: 5, name: 'Segol Specter', icon: '👻' },
      { level: 6, name: 'Cholam Chimera', icon: '🦁' },
      { level: 7, name: 'Animal Anubis', icon: '🐕' },
      { level: 8, name: 'Color Cyclops', icon: '👁️' },
      { level: 9, name: 'Number Sphinx', icon: '🦁' },
      { level: 10, name: 'Greeting Gargoyle', icon: '🗿' },
      { level: 11, name: 'Verb Valkyrie', icon: '⚔️' },
      { level: 12, name: 'Master Aleph Dragon', icon: '🐉' }
    ];

    // --- Track & Question Bank Loader ---
    function getQuestionFileForTrack(track) {
      switch (track) {
        case 'intermediate': return 'questions2.json';
        case 'advanced': return 'questions3.json';
        case 'beginner': default: return 'questions.json';
      }
    }

    async function loadQuestionBank() {
      const fileName = getQuestionFileForTrack(currentTrack);
      try {
        const response = await fetch(fileName);
        if (!response.ok) throw new Error(`HTTP ${response.status} - File not found: ${fileName}`);
        const data = await response.json();
        gameQuestions = data.levels || [];
      } catch (err) {
        console.warn(`Could not load ${fileName}. Falling back to default state.`, err);
        if (currentTrack !== 'beginner') {
          alert(`Could not locate ${fileName}. Returning to Beginner track.`);
          switchTrack('beginner');
          return;
        }
      } finally {
        updateTrackUI();
        initLevel(currentLevel);
      }
    }

    function switchTrack(track) {
      if (currentTrack === track && gameQuestions.length > 0) return;
      currentTrack = track;
      localStorage.setItem('hebrew_game_track', track);
      currentLevel = 1;
      localStorage.setItem('hebrew_game_level', currentLevel);
      playerPosition = 0;
      loadQuestionBank();
    }

    function updateTrackUI() {
      ['beginner', 'intermediate', 'advanced'].forEach(t => {
        const btn = document.getElementById(`btn-${t}`);
        if (btn) btn.classList.toggle('active', currentTrack === t);
      });
      updateUI();
    }

    // --- Board Setup ---
    function renderBoard() {
      const board = document.getElementById('board');
      board.querySelectorAll('.tile').forEach(t => t.remove());

      for (let i = 0; i < 20; i++) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.id = `tile-${i}`;

        let type = 'standard';
        let icon = '⭐';
        if (i === 0) { type = 'start'; icon = '🚀'; }
        else if (i === 19) { type = 'boss'; icon = '👑'; }
        else if (i === 5 || i === 12) { type = 'trap'; icon = '🌪️'; }
        else if (i === 8 || i === 15) { type = 'chest'; icon = '🎁'; }

        tile.classList.add(type);
        tile.innerHTML = `<span class="tile-num">${i}</span><span class="tile-icon">${icon}</span>`;
        board.appendChild(tile);
      }
      positionPlayerToken(false);
    }

    function positionPlayerToken(animate = true) {
      const tile = document.getElementById(`tile-${playerPosition}`);
      const token = document.getElementById('player-token');
      token.textContent = currentAvatar;
      if (tile) {
        tile.appendChild(token);
        if (animate) {
          token.classList.add('jump');
          setTimeout(() => token.classList.remove('jump'), 400);
        }
      }
    }

    // --- Game Loop & Mechanics ---
    function rollDice() {
      sfx.roll();
      const roll = Math.floor(Math.random() * 6) + 1;
      document.getElementById('dice-val').textContent = roll;
      
      let target = playerPosition + roll;
      if (target >= 19) target = 19;

      let current = playerPosition;
      const interval = setInterval(() => {
        if (current < target) {
          current++;
          playerPosition = current;
          positionPlayerToken(true);
        } else {
          clearInterval(interval);
          handleTileLanding(playerPosition);
        }
      }, 350);
    }

    function handleTileLanding(pos) {
      if (pos === 19) {
        triggerBossBattle();
      } else {
        triggerStandardQuestion();
      }
    }

    function triggerStandardQuestion() {
      const lvlData = gameQuestions.find(l => l.level === currentLevel) || gameQuestions[0];
      if (!lvlData || !lvlData.questions || lvlData.questions.length === 0) {
        alert("No questions available for this level yet!");
        return;
      }
      
      activeQuestion = lvlData.questions[Math.floor(Math.random() * lvlData.questions.length)];
      document.getElementById('boss-overlay-header').style.display = 'none';
      presentQuestion(activeQuestion);
    }

    function triggerBossBattle() {
      bossHP = 3;
      updateBossHPDisplay();
      const boss = BOSSES.find(b => b.level === currentLevel) || BOSSES[0];
      document.getElementById('boss-avatar-icon').textContent = boss.icon;
      document.getElementById('boss-name').textContent = boss.name;
      document.getElementById('boss-overlay-header').style.display = 'block';

      triggerStandardQuestion();
    }

    function presentQuestion(q) {
      document.getElementById('q-prompt').textContent = q.q;
      
      const hasHebrew = /[\u0590-\u05FF]/.test(q.q);
      const hebrewElem = document.getElementById('q-hebrew');
      if (hasHebrew) {
        hebrewElem.textContent = q.q.match(/[\u0590-\u05FF]+/)?.[0] || '';
        hebrewElem.style.display = 'block';
      } else {
        hebrewElem.style.display = 'none';
      }

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      q.opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt);
        container.appendChild(btn);
      });

      document.getElementById('question-modal').classList.add('active');
    }

    function checkAnswer(selected) {
      if (selected === activeQuestion.a) {
        sfx.correct();
        coins += 10;
        localStorage.setItem('hebrew_coins', coins);

        if (playerPosition === 19) {
          bossHP--;
          updateBossHPDisplay();
          if (bossHP <= 0) {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            unlockBestiaryBoss(currentLevel);
            closeModal('question-modal');
            alert(`🏆 Victory! You defeated the Level ${currentLevel} Boss!`);
            if (currentLevel < 12) {
              currentLevel++;
              localStorage.setItem('hebrew_game_level', currentLevel);
              initLevel(currentLevel);
            }
            playerPosition = 0;
            positionPlayerToken();
            return;
          }
        } else {
          closeModal('question-modal');
        }
      } else {
        sfx.wrong();
        alert(`Oops! The correct answer was: ${activeQuestion.a}`);
        closeModal('question-modal');
      }
      updateUI();
    }

    function updateBossHPDisplay() {
      const fill = document.getElementById('boss-hp-fill');
      fill.style.width = `${(bossHP / 3) * 100}%`;
    }

    function speakCurrentQuestion() {
      if ('speechSynthesis' in window && activeQuestion) {
        window.speechSynthesis.cancel();
        const textToSpeak = activeQuestion.a || activeQuestion.q;
        const utt = new SpeechSynthesisUtterance(textToSpeak);
        utt.lang = 'he-IL';
        utt.rate = 0.85;
        window.speechSynthesis.speak(utt);
      }
    }

    // --- UI & Level Navigation ---
    function initLevel(lvl) {
      currentLevel = parseInt(lvl, 10) || 1;
      localStorage.setItem('hebrew_game_level', currentLevel);
      playerPosition = 0;
      positionPlayerToken(false);
      updateUI();
    }

    function changeLevel(lvl) {
      initLevel(lvl);
    }

    function updateUI() {
      document.getElementById('coin-display').textContent = `🪙 ${coins}`;
      document.getElementById('streak-display').textContent = `🔥 Track: ${currentTrack.toUpperCase()}`;
      
      const select = document.getElementById('level-dropdown');
      if (select) {
        if (select.children.length === 0) {
          for (let i = 1; i <= 12; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = `Level ${i}`;
            select.appendChild(opt);
          }
        }
        select.value = currentLevel;
      }
    }

    // --- Shop & Bestiary ---
    function openShop() {
      const container = document.getElementById('shop-items-container');
      container.innerHTML = '';
      AVATARS.forEach(av => {
        const item = document.createElement('div');
        item.className = `shop-item ${currentAvatar === av.icon ? 'equipped' : ''}`;
        const isUnlocked = unlockedAvatars.includes(av.icon);
        item.innerHTML = `
          <span style="font-size:2rem;">${av.icon}</span>
          <span style="font-size:0.85rem; font-weight:700;">${isUnlocked ? (currentAvatar === av.icon ? 'Equipped' : 'Unlocked') : `🪙 ${av.price}`}</span>
        `;
        item.onclick = () => {
          if (isUnlocked) {
            currentAvatar = av.icon;
            localStorage.setItem('hebrew_avatar', currentAvatar);
            positionPlayerToken();
            openShop();
          } else if (coins >= av.price) {
            coins -= av.price;
            unlockedAvatars.push(av.icon);
            currentAvatar = av.icon;
            localStorage.setItem('hebrew_coins', coins);
            localStorage.setItem('hebrew_unlocked_avatars', JSON.stringify(unlockedAvatars));
            localStorage.setItem('hebrew_avatar', currentAvatar);
            positionPlayerToken();
            updateUI();
            openShop();
          } else {
            alert('Not enough coins to unlock this avatar!');
          }
        };
        container.appendChild(item);
      });
      document.getElementById('shop-modal').classList.add('active');
    }

    function unlockBestiaryBoss(lvl) {
      if (!bestiary.includes(lvl)) {
        bestiary.push(lvl);
        localStorage.setItem('hebrew_bestiary', JSON.stringify(bestiary));
      }
    }

    function openTrophyRoom() {
      const container = document.getElementById('bestiary-container');
      container.innerHTML = '';
      BOSSES.forEach(b => {
        const isDefeated = bestiary.includes(b.level);
        const item = document.createElement('div');
        item.className = 'bestiary-item';
        item.style.opacity = isDefeated ? '1' : '0.4';
        item.innerHTML = `
          <span style="font-size:2rem;">${isDefeated ? b.icon : '❓'}</span>
          <strong style="font-size:0.8rem;">${b.name}</strong>
          <span style="font-size:0.7rem;">${isDefeated ? 'Defeated' : 'Locked'}</span>
        `;
        container.appendChild(item);
      });
      document.getElementById('trophy-modal').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // App Initialization
    document.addEventListener('DOMContentLoaded', () => {
      updateUI();
      renderBoard();
      loadQuestionBank();
    });
  </script>
</body>
</html>
