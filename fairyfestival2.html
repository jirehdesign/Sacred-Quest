  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'Comic Sans MS', 'cursive', 'sans-serif'],
          },
          animation: {
            'float-slow': 'floatSlow 4s ease-in-out infinite',
            'sparkle-pulse': 'sparklePulse 2s ease-in-out infinite',
            'bounce-gentle': 'bounceGentle 2.2s infinite',
            'shimmer': 'shimmer 2.5s linear infinite',
          },
          keyframes: {
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' },
            },
            sparklePulse: {
              '0%, 100%': { opacity: '1', transform: 'scale(1)' },
              '50%': { opacity: '0.65', transform: 'scale(1.08)' },
            },
            bounceGentle: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-5px)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    };

  <style>
    /* Base typography & touch responsiveness */
    * {
      font-family: 'Fredoka', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 35%, #e0f2fe 70%, #fef9c3 100%);
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* Custom whimsical scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #f472b6, #a855f7);
      border-radius: 999px;
    }

    /* Tactile 3D-style candy buttons for kids */
    .fairy-btn {
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, filter 0.14s ease;
      box-shadow: 0 4px 0 rgba(109, 40, 217, 0.25), 0 8px 16px rgba(168, 85, 247, 0.18);
    }
    .fairy-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }
    .fairy-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(109, 40, 217, 0.25), 0 3px 8px rgba(168, 85, 247, 0.15);
    }
    .fairy-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Rare item golden shimmer card border */
    .rare-card {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fce7f3 100%);
      border: 2.5px solid #f59e0b;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.32);
    }

    /* Floating sparkle particles on equip/win */
    @keyframes popStar {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.4) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(180deg);

    .sparkle-burst {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: popStar 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;

      box-shadow: 0 10px 30px -5px rgba(147, 51, 234, 0.12), 0 4px 10px -2px rgba(236, 72, 153, 0.08);

  <script>
    /**
     * ============================================================================
     * FAIRY-FESTIVAL: WHIMSICAL EDUCATIONAL FANTASY ADVENTURE
     * Complete single-file engine containing:
     *  1. Procedural Web Audio API Music-Box & SFX Synthesizer
     *  2. Browser Speech Synthesis Voice Engine (Spelling Scroll)
     *  3. Game Data Catalog (8 Festival Structures, 38 Boutique Items, 56 Words, 8 Badges)
     *  4. Procedural SVG Character Renderer (`renderDollSVG`) & Structure Artwork
     *  5. LocalStorage Persistence Manager
     *  6. Interactive Views: Menu, Creator, Festival Build Track, Math Wand,
     *     Spelling Scroll, Glitter Boutique, and Achievements & Badges
     * ============================================================================
     */

    /* --------------------------------------------------------------------------
     * 1. PROCEDURAL WEB AUDIO API SOUND ENGINE
     * -------------------------------------------------------------------------- */
    const SoundEngine = (() => {
      let ctx = null;
      let isMuted = localStorage.getItem('fairy_festival_muted') === 'true';
      let bgmTimer = null;
      let stepIndex = 0;

      // Enchanted 3/4 Music-Box Waltz melody (MIDI note numbers, 0 = rest)
      // Gentle major-pentatonic / lullaby progression in F/C major
      const waltzSequence = [
        // Measure 1 (Fmaj)
        65, 72, 77,   69, 72, 77,
        // Measure 2 (Cmaj)
        60, 72, 76,   67, 72, 76,
        // Measure 3 (Dm)
        62, 69, 74,   65, 69, 74,
        // Measure 4 (Bb -> C)
        58, 70, 74,   60, 72, 79,
        // Measure 5 (Fmaj)
        65, 74, 77,   69, 76, 79,
        // Measure 6 (Am)
        57, 69, 76,   64, 72, 76,
        // Measure 7 (Bb)
        58, 69, 74,   62, 70, 74,
        // Measure 8 (C -> F)
        60, 67, 76,   65, 72, 0
      ];

      function midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      function initContext() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            ctx = new AudioCtx();
          }
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        if (ctx && !bgmTimer && !isMuted) {
          startMusicLoop();
        }
      }

      // Soft bell-like music box tone
      function playBellNote(freq, duration = 0.65, volume = 0.045, type = 'sine') {
        if (isMuted || !ctx || ctx.state !== 'running') return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const overtone = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);

        // Octave shimmer harmonic for authentic music-box chime
        overtone.type = 'sine';
        overtone.frequency.setValueAtTime(freq * 2, now);

        const overtoneGain = ctx.createGain();
        overtoneGain.gain.setValueAtTime(volume * 0.25, now);
        overtoneGain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.45);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        overtone.connect(overtoneGain);
        overtoneGain.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        overtone.start(now);
        osc.stop(now + duration + 0.02);
        overtone.stop(now + duration + 0.02);
      }

      function startMusicLoop() {
        if (bgmTimer) clearInterval(bgmTimer);
        // 3/4 waltz tempo: ~340ms per beat
        bgmTimer = setInterval(() => {
          if (isMuted || !ctx || ctx.state !== 'running') return;
          const note = waltzSequence[stepIndex % waltzSequence.length];
          const isDownbeat = (stepIndex % 3) === 0;
          if (note > 0) {
            playBellNote(
              midiToFreq(note),
              isDownbeat ? 0.95 : 0.6,
              isDownbeat ? 0.038 : 0.026,
              'sine'
            );
          }
          stepIndex++;
        }, 350);
      }

      function toggleMute() {
        initContext();
        isMuted = !isMuted;
        localStorage.setItem('fairy_festival_muted', String(isMuted));
        if (!isMuted) {
          startMusicLoop();
          playClick();
        }
        return isMuted;
      }

      function getMuted() {
        return isMuted;
      }

      // UI Tap / Pop
      function playClick() {
        initContext();
        playBellNote(784, 0.14, 0.07, 'sine'); // G5
      }

      // Compass Spinner Wheel Tick
      function playSpinTick(speedRatio = 1) {
        initContext();
        const freq = 520 + Math.min(350, speedRatio * 260);
        playBellNote(freq, 0.07, 0.055, 'triangle');
      }

      // Resource Harvest Chime
      function playHarvest(isRare = false) {
        initContext();
        const notes = isRare ? [587.33, 739.99, 880, 1174.66] : [523.25, 659.25, 783.99];
        notes.forEach((f, idx) => {
          setTimeout(() => playBellNote(f, 0.45, 0.08, 'sine'), idx * 85);
        });
      }

      // Grumpy Raincloud Appearance
      function playThunder() {
        initContext();
        if (isMuted || !ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(135, now);
        osc.frequency.exponentialRampToValueAtTime(52, now + 0.55);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(240, now);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.62);
      }

      // Clearing Raincloud with Strawberry
      function playCloudClear() {
        initContext();
        const gliss = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
        gliss.forEach((f, i) => {
          setTimeout(() => playBellNote(f, 0.42, 0.075, 'sine'), i * 65);
        });
      }

      // Wishing Well Sparkle Trade
      function playWish() {
        initContext();
        const notes = [659.25, 987.77, 1318.51];
        notes.forEach((f, i) => {
          setTimeout(() => playBellNote(f, 0.55, 0.075, 'sine'), i * 100);
        });
      }

      // Structure Built Royal Fanfare
      function playBuildFanfare() {
        initContext();
        const fanfare = [
          { f: 523.25, t: 0, d: 0.25 },
          { f: 659.25, t: 130, d: 0.25 },
          { f: 783.99, t: 260, d: 0.25 },
          { f: 1046.50, t: 400, d: 0.55 },
          { f: 880.00, t: 620, d: 0.25 },
          { f: 1046.50, t: 780, d: 0.9 }
        ];
        fanfare.forEach(n => {
          setTimeout(() => playBellNote(n.f, n.d, 0.095, 'triangle'), n.t);
        });
      }

      // Boutique Item Purchase
      function playPurchase() {
        initContext();
        const notes = [783.99, 1046.50, 1318.51, 1567.98];
        notes.forEach((f, i) => {
          setTimeout(() => playBellNote(f, 0.45, 0.08, 'sine'), i * 75);
        });
      }

      // Equip / Unequip Pop
      function playEquip() {
        initContext();
        playBellNote(698.46, 0.16, 0.065, 'sine');
        setTimeout(() => playBellNote(932.33, 0.25, 0.065, 'sine'), 70);
      }

      // Educational Minigame Correct Answer
      function playSuccess() {
        initContext();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, i) => {
          setTimeout(() => playBellNote(f, 0.4, 0.085, 'sine'), i * 80);
        });
      }

      // Gentle Encouraging Try-Again Sound
      function playRetry() {
        initContext();
        playBellNote(392.00, 0.22, 0.06, 'triangle'); // G4
        setTimeout(() => playBellNote(349.23, 0.3, 0.06, 'triangle'), 150); // F4
      }

      return {
        initContext,
        toggleMute,
        getMuted,
        playClick,
        playSpinTick,
        playHarvest,
        playThunder,
        playCloudClear,
        playWish,
        playBuildFanfare,
        playPurchase,
        playEquip,
        playSuccess,
        playRetry
      };
    })();

    // Unlock audio on first user interaction anywhere
    ['pointerdown', 'keydown'].forEach(evt => {
      window.addEventListener(evt, () => SoundEngine.initContext(), { once: true });
    });

    /* --------------------------------------------------------------------------
     * 2. BROWSER SPEECH SYNTHESIS ENGINE (SPELLING SCROLL)
     * -------------------------------------------------------------------------- */
    const SpeechEngine = (() => {
      let preferredVoice = null;

      function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        if (!voices.length) return;
        preferredVoice =
          voices.find(v => /Google US English|Samantha|Victoria|Microsoft Zira/i.test(v.name)) ||
          voices.find(v => v.lang && v.lang.startsWith('en-US')) ||
          voices.find(v => v.lang && v.lang.startsWith('en')) ||
          voices[0];
      }

      if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }

      function speak(text) {
        if (!('speechSynthesis' in window)) return false;
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          if (!preferredVoice) loadVoices();
          if (preferredVoice) utter.voice = preferredVoice;
          utter.pitch = 1.2;  // Child-friendly warm higher pitch
          utter.rate = 0.85;  // Clear, unhurried pace for 6-7 year olds
          utter.volume = 1.0;
          window.speechSynthesis.speak(utter);
          return true;
        } catch (e) {
          return false;
        }
      }

      function speakWord(word) {
        return speak(`Spell the word: ${word}`);
      }

      function speakSentence(word, sentence) {
        return speak(`${word}. ${sentence}`);
      }

      return { speakWord, speakSentence };
    })();

    function loadAllProfiles() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveAllProfiles(profiles) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
      } catch (e) {
        console.warn('Could not save to localStorage', e);
      }
    }

      return AppState.profiles.find(p => p.id === AppState.activeHeroId) || null;

    function persistHero(hero) {
      const idx = AppState.profiles.findIndex(p => p.id === hero.id);
      if (idx !== -1) {
        AppState.profiles[idx] = hero;
      } else {
        AppState.profiles.push(hero);
      }
      saveAllProfiles(AppState.profiles);
      localStorage.setItem(ACTIVE_KEY, hero.id);

    /* --------------------------------------------------------------------------
     * 6. UI HELPERS: TOASTS, SPARKLE BURSTS & CONFIRM MODAL
     * -------------------------------------------------------------------------- */
    function showToast(message, tone = 'magic') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        magic:   'bg-gradient-to-r from-purple-600 to-pink-500 text-white border-pink-200',
        success: 'bg-gradient-to-r from-emerald-500 to-teal-500 text-white border-emerald-200',
        warn:    'bg-gradient-to-r from-amber-500 to-orange-500 text-white border-amber-200'
      };

      const el = document.createElement('div');
      el.className = `px-5 py-3 rounded-2xl shadow-xl border-2 font-bold text-base sm:text-lg text-center transform transition-all duration-300 translate-y-0 opacity-100 ${styles[tone] || styles.magic}`;
      el.textContent = message;
      container.appendChild(el);

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-12px)';
        setTimeout(() => el.remove(), 300);
      }, 2700);
    }

    function spawnSparkleBurst(x, y, emojis = ['✨', '🌟', '💖', '🌸']) {
      for (let i = 0; i < 12; i++) {
        const sp = document.createElement('div');
        sp.className = 'sparkle-burst text-2xl';
        sp.textContent = emojis[i % emojis.length];
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 45 + Math.random() * 65;
        sp.style.left = `${x}px`;
        sp.style.top = `${y}px`;
        sp.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        sp.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
        document.body.appendChild(sp);
        setTimeout(() => sp.remove(), 900);
      }
    }

    function showConfirmModal(title, message, onConfirm) {
      const modal = document.getElementById('confirm-modal');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      const cancelBtn = document.getElementById('confirm-cancel-btn');
      const okBtn = document.getElementById('confirm-ok-btn');

      const close = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };

      cancelBtn.onclick = () => {
        SoundEngine.playClick();
        close();
      };
      okBtn.onclick = () => {
        SoundEngine.playClick();
        close();
        onConfirm();
      };
    }

    /* --------------------------------------------------------------------------
     * 7. EDUCATIONAL MINIGAME GENERATORS (MATH WAND & SPELLING SCROLL)
     * -------------------------------------------------------------------------- */
    function generateMathProblem(level = 1) {
      const isAddition = Math.random() < 0.58;
      let maxNum = 10;
      if (level >= 3 && level <= 5) maxNum = 15;
      if (level >= 6) maxNum = 22;

      let a, b, op, answer;
      if (isAddition) {
        a = Math.floor(Math.random() * (maxNum - 2)) + 1;
        b = Math.floor(Math.random() * (maxNum - a)) + 1;
        op = '+';
        answer = a + b;
      } else {
        a = Math.floor(Math.random() * (maxNum - 3)) + 4;
        b = Math.floor(Math.random() * (a - 1)) + 1;
        op = '-';
        answer = a - b;
      }

      AppState.mathProblem = { a, b, op, answer };
      AppState.mathInput = '';
      AppState.mathFeedback = null;
    }

    function pickNewSpellingWord(speakNow = true) {
      const hero = getActiveHero();
      const lvl = hero ? hero.level : 1;
      // Gently favor 3-4 letter words at levels 1-2, and include 5-7 letter words as levels rise
      const pool = SPELLING_WORDS.filter(item => {
        if (lvl <= 2) return item.word.length <= 5;
        return true;
      });
      let chosen = pool[Math.floor(Math.random() * pool.length)];
      if (AppState.spellItem && chosen.word === AppState.spellItem.word && pool.length > 1) {
        chosen = pool[(pool.indexOf(chosen) + 1) % pool.length];
      }
      AppState.spellItem = chosen;
      AppState.spellInput = '';
      AppState.spellFeedback = null;

      if (speakNow) {
        setTimeout(() => SpeechEngine.speakWord(chosen.word), 180);
      }
    }

    /* --------------------------------------------------------------------------
     * 8. COMPASS SPINNER WHEEL LOGIC
     * -------------------------------------------------------------------------- */
    const COMPASS_SLICES = [
      { label: '+2 🍓', short: '🍓', type: 'strawberry', amount: 2, gold: 0,  stardust: 0, bg: '#FDA4AF' },
      { label: '+2 🐚', short: '🐚', type: 'pearl',      amount: 2, gold: 0,  stardust: 0, bg: '#67E8F9' },
      { label: '+2 ✨', short: '✨', type: 'pixieDust',  amount: 2, gold: 0,  stardust: 0, bg: '#FDE047' },
      { label: '+1 💎', short: '💎', type: 'gem',        amount: 1, gold: 0,  stardust: 0, bg: '#D8B4FE' },
      { label: '+1 🍓 +10🪙', short: '🍓', type: 'strawberry', amount: 1, gold: 10, stardust: 0, bg: '#FECDD3' },
      { label: '+1 🐚 +10🪙', short: '🐚', type: 'pearl',      amount: 1, gold: 10, stardust: 0, bg: '#CFFAFE' },
      { label: '+1 ✨ +10🪙', short: '✨', type: 'pixieDust',  amount: 1, gold: 10, stardust: 0, bg: '#FEF08A' },
      { label: '+1 🌟 +25🪙', short: '🌟', type: 'jackpot',    amount: 0, gold: 25, stardust: 1, bg: '#F9A8D4' }
    ];

    function spinMagicCompass(evt) {
      const hero = getActiveHero();
      if (!hero || AppState.isSpinning) return;

      if (hero.raincloudActive) {
        SoundEngine.playThunder();
        showToast('⛈️ Give the Grumpy Raincloud 1 🍓 Strawberry first!', 'warn');
        return;
      }

      if (hero.sunsetSteps <= 0) {
        SoundEngine.playRetry();
        showToast('🌙 The sun has set! Tap "Rest Until Sunrise" to spin again.', 'warn');
        return;
      }

      SoundEngine.initContext();
      AppState.isSpinning = true;
      renderApp();

      const sliceDeg = 360 / COMPASS_SLICES.length; // 45 deg per slice
      const extraSpins = 4 + Math.floor(Math.random() * 3); // 4-6 full spins
      const randomOffset = Math.floor(Math.random() * 360);
      const startAngle = AppState.compassAngle;
      const targetAngle = startAngle + extraSpins * 360 + randomOffset;
      const duration = 2600;
      const startTime = performance.now();
      let lastTickSlice = Math.floor(startAngle / sliceDeg);

      function animateWheel(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        // Smooth cubic ease-out deceleration
        const eased = 1 - Math.pow(1 - t, 3);
        const currentAngle = startAngle + (targetAngle - startAngle) * eased;
        AppState.compassAngle = currentAngle;

        const wheelEl = document.getElementById('compass-wheel-rotor');
        if (wheelEl) {
          wheelEl.style.transform = `rotate(${currentAngle}deg)`;
        }

        const currentSlice = Math.floor(currentAngle / sliceDeg);
        if (currentSlice !== lastTickSlice) {
          lastTickSlice = currentSlice;
          SoundEngine.playSpinTick(1 - t);
        }

        if (t < 1) {
          requestAnimationFrame(animateWheel);
        } else {
          // Determine winning slice under top pointer (0 deg / 360 deg)
          const normalized = ((360 - (currentAngle % 360)) + 360) % 360;
          const winningIdx = Math.floor(normalized / sliceDeg) % COMPASS_SLICES.length;
          const prize = COMPASS_SLICES[winningIdx];

          AppState.isSpinning = false;
          hero.sunsetSteps = Math.max(0, hero.sunsetSteps - 1);
          hero.stats.spinsCount = (hero.stats.spinsCount || 0) + 1;

          if (prize.type !== 'jackpot' && prize.amount > 0) {
            hero.commodities[prize.type] = (hero.commodities[prize.type] || 0) + prize.amount;
          }
          if (prize.gold > 0) {
            hero.gold += prize.gold;
            hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + prize.gold;
          }
          if (prize.stardust > 0) {
            hero.stardust += prize.stardust;
            hero.stats.totalStardustEarned = (hero.stats.totalStardustEarned || 0) + prize.stardust;
          }

          SoundEngine.playHarvest(prize.type === 'gem' || prize.type === 'jackpot');
          showToast(`🧭 Magic Compass landed on: ${prize.label}!`, 'success');

          if (evt && evt.clientX) {
            spawnSparkleBurst(evt.clientX, evt.clientY, [prize.short, '✨', '🌟']);
          }

          // ~28% chance of Grumpy Raincloud obstacle after the 2nd spin
          if (hero.stats.spinsCount >= 2 && hero.sunsetSteps > 0 && Math.random() < 0.28) {
            hero.raincloudActive = true;
            setTimeout(() => {
              SoundEngine.playThunder();
              showToast('⛈️ Oh no! A Grumpy Raincloud floated over the compass!', 'warn');
              renderApp();
            }, 650);
          }

          persistHero(hero);
          renderApp();
        }
      }

      requestAnimationFrame(animateWheel);
    }

    // SCREEN 3: MAIN GAMEPLAY (FESTIVAL BUILD TRACK, COMPASS, RAINCLOUD & WISHING WELL)
    function renderFestivalScreen(hero) {
      const allBuilt = hero.builtStructures.length >= 8;
      const currentStruct = FESTIVAL_STRUCTURES.find(s => s.level === hero.level) || FESTIVAL_STRUCTURES[7];

      // Check if hero has enough commodities for current structure
      const canBuild = !allBuilt && Object.entries(currentStruct.cost).every(([k, req]) => (hero.commodities[k] || 0) >= req);

      // Build SVG slices for Magic Compass
      const sliceDeg = 360 / COMPASS_SLICES.length;
      const wheelSlicesSVG = COMPASS_SLICES.map((s, idx) => {
        const startRad = ((idx * sliceDeg - 90) * Math.PI) / 180;
        const endRad = (((idx + 1) * sliceDeg - 90) * Math.PI) / 180;
        const x1 = 100 + 92 * Math.cos(startRad);
        const y1 = 100 + 92 * Math.sin(startRad);
        const x2 = 100 + 92 * Math.cos(endRad);
        const y2 = 100 + 92 * Math.sin(endRad);
        const midAngle = idx * sliceDeg + sliceDeg / 2;
        const midRad = ((midAngle - 90) * Math.PI) / 180;
        const tx = 100 + 60 * Math.cos(midRad);
        const ty = 100 + 60 * Math.sin(midRad);

        return `
          <g>
            <path d="M100,100 L${x1.toFixed(1)},${y1.toFixed(1)} A92,92 0 0,1 ${x2.toFixed(1)},${y2.toFixed(1)} Z"
              fill="${s.bg}" stroke="#FFFFFF" stroke-width="2" />
            <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
              transform="rotate(${midAngle} ${tx.toFixed(1)} ${ty.toFixed(1)})"
              font-size="22">${s.short}</text>
          </g>
        `;
      }).join('');

      return `
        <main class="flex-1 max-w-7xl mx-auto w-full px-3 sm:px-5 py-4 space-y-5">
          <!-- Sequential Festival Build Track Stepper (Levels 1-8) -->
          <section class="fairy-panel rounded-3xl p-4 sm:p-5">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
              <h2 class="text-lg sm:text-2xl font-bold text-purple-950 flex items-center gap-2">
                <span>🎪</span>
                <span>Fairy Festival Build Track</span>
              </h2>
              <span class="px-3 py-1 rounded-full bg-pink-100 text-pink-800 font-bold text-xs sm:text-sm">
                ${hero.builtStructures.length} / 8 Structures Built
              </span>
            </div>

            <!-- Horizontal Level Nodes -->
            <div class="grid grid-cols-4 sm:grid-cols-8 gap-2 mb-4">
              ${FESTIVAL_STRUCTURES.map(st => {
                const built = hero.builtStructures.includes(st.level);
                const current = !allBuilt && st.level === hero.level;
                return `
                  <div class="p-2 rounded-2xl border-2 text-center transition-all ${
                    built
                      ? 'bg-emerald-100 border-emerald-400 text-emerald-900'
                      : current
                        ? 'bg-gradient-to-b from-pink-100 to-purple-100 border-pink-500 text-purple-950 shadow-md scale-[1.03]'
                        : 'bg-white/60 border-slate-200 text-slate-400'
                  }">
                    <div class="text-xs font-bold">Lvl ${st.level}</div>
                    <div class="text-lg my-0.5">${built ? '✅' : current ? '✨' : '🔒'}</div>
                    <div class="text-[11px] font-bold truncate">${st.name.split(' ')[0]}</div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Active Structure Card OR Grand Completion Celebration -->
            ${allBuilt ? `
              <div class="rounded-3xl bg-gradient-to-r from-amber-100 via-pink-100 to-purple-100 border-2 border-amber-300 p-5 flex flex-col md:flex-row items-center gap-5">
                <div class="w-full md:w-64 flex-shrink-0">
                  ${renderStructureSVG(8, true)}
                </div>
                <div class="flex-1 text-center md:text-left">
                  <div class="inline-block px-3 py-1 rounded-full bg-amber-400 text-amber-950 font-bold text-xs mb-2">
                    👑 ROYAL FESTIVAL COMPLETE!
                  </div>
                  <h3 class="text-2xl sm:text-3xl font-bold text-purple-950 mb-1">
                    Hooray, ${escapeHTML(hero.name)}! The Fairy Festival is Open!
                  </h3>
                  <p class="text-slate-700 mb-4">
                    All 8 magical structures are built and glowing! Keep spinning the Magic Compass, playing Math & Spelling games, and collecting all 38 outfits in the Glitter Boutique!
                  </p>
                  <button onclick="resetFestivalTrack()" class="fairy-btn px-5 py-2.5 rounded-2xl bg-white border-2 border-purple-300 text-purple-900 font-bold text-sm">
                    🔄 Build Festival Again (Keep All Gold & Outfits)
                  </button>
                </div>
              </div>
            ` : `
              <div class="rounded-3xl bg-gradient-to-r from-purple-50 via-pink-50 to-amber-50 border-2 border-pink-200 p-4 sm:p-5 grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                <div class="md:col-span-4">
                  ${renderStructureSVG(currentStruct.level, false)}
                </div>
                <div class="md:col-span-8 flex flex-col justify-between">
                  <div>
                    <div class="flex flex-wrap items-center gap-2 mb-1">
                      <span class="px-3 py-0.5 rounded-full bg-purple-600 text-white font-bold text-xs">
                        Level ${currentStruct.level} Goal
                      </span>
                      <span class="px-3 py-0.5 rounded-full bg-amber-100 text-amber-900 font-bold text-xs border border-amber-300">
                        Reward: +${currentStruct.rewardGold} 🪙 & +${currentStruct.rewardStardust} 🌟
                      </span>
                    </div>
                    <h3 class="text-2xl font-bold text-purple-950">${currentStruct.name}</h3>
                    <p class="text-slate-600 text-sm sm:text-base mb-3">${currentStruct.description}</p>
                  </div>

                  <!-- Required Commodities & Build Button -->
                  <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-pink-200/70">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="text-xs font-bold text-purple-900 uppercase tracking-wide">Needs:</span>
                      ${Object.entries(currentStruct.cost).map(([k, req]) => {
                        const have = hero.commodities[k] || 0;
                        const met = have >= req;
                        const meta = COMMODITY_META[k];
                        return `
                          <span class="px-3 py-1.5 rounded-xl font-bold text-sm border-2 flex items-center gap-1 ${
                            met
                              ? 'bg-emerald-100 border-emerald-400 text-emerald-900'
                              : 'bg-white border-rose-200 text-slate-700'
                          }">
                            <span>${meta.emoji}</span>
                            <span>${have}/${req}</span>
                            ${met ? '<span>✓</span>' : ''}
                          </span>
                        `;
                      }).join('')}
                    </div>

                    <button onclick="buildCurrentStructure(event)" ${canBuild ? '' : 'disabled'}
                      class="fairy-btn px-6 py-3 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-500 text-white font-bold text-base sm:text-lg flex items-center gap-2">
                      <span>✨ Build ${currentStruct.name}!</span>
                    </button>
                  </div>
                </div>
              </div>
            `}
          </section>

          <!-- Bottom Two-Column Interactive Playground: Magic Compass + Wishing Well -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- LEFT: Magic Compass (Spinner Wheel), Sunset Clock & Grumpy Raincloud -->
            <section class="lg:col-span-7 fairy-panel rounded-3xl p-5 flex flex-col items-center relative overflow-hidden">
              <div class="w-full flex flex-wrap items-center justify-between gap-2 mb-3">
                <h2 class="text-xl sm:text-2xl font-bold text-purple-950 flex items-center gap-2">
                  <span>🧭</span>
                  <span>Magic Compass</span>
                </h2>

                <!-- Sunset Clock Progress Tracker -->
                <div class="flex items-center gap-1.5 bg-amber-50 px-3 py-1.5 rounded-2xl border border-amber-300">
                  <span class="text-sm font-bold text-amber-900">
                    ${hero.sunsetSteps > 0 ? '☀️ Sun Steps:' : '🌙 Sunset!'}
                  </span>
                  <div class="flex gap-1">
                    ${Array.from({ length: hero.maxSunsetSteps }).map((_, i) => `
                      <span class="w-2.5 h-2.5 rounded-full ${i < hero.sunsetSteps ? 'bg-amber-400' : 'bg-indigo-900/25'}"></span>
                    `).join('')}
                  </div>
                  <span class="text-xs font-bold text-amber-900 ml-1">${hero.sunsetSteps}/${hero.maxSunsetSteps}</span>
                </div>
              </div>

              <!-- Compass Wheel Container -->
              <div class="relative w-64 h-64 sm:w-72 sm:h-72 my-2 flex items-center justify-center">
                <!-- Top Pointer Jewel -->
                <div class="absolute -top-2 left-1/2 -translate-x-1/2 z-20 drop-shadow-md">
                  <svg width="34" height="36" viewBox="0 0 34 36">
                    <polygon points="17,34 3,6 31,6" fill="#EC4899" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" />
                    <circle cx="17" cy="11" r="4" fill="#FEF08A" />
                  </svg>
                </div>

                <!-- Rotating SVG Wheel -->
                <div id="compass-wheel-rotor"
                  onclick="spinMagicCompass(event)"
                  class="w-full h-full cursor-pointer select-none"
                  style="transform: rotate(${AppState.compassAngle}deg);">
                  <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-lg">
                    <circle cx="100" cy="100" r="97" fill="#F59E0B" />
                    ${wheelSlicesSVG}
                    <circle cx="100" cy="100" r="93" fill="none" stroke="#FDE047" stroke-width="4" />
                    <!-- Center Compass Rose -->
                    <circle cx="100" cy="100" r="22" fill="#FFFFFF" stroke="#EC4899" stroke-width="4" />
                    <text x="100" y="101" text-anchor="middle" dominant-baseline="central" font-size="20">🧭</text>
                  </svg>
                </div>

                <!-- GRUMPY RAINCLOUD OBSTACLE OVERLAY -->
                ${hero.raincloudActive ? `
                  <div class="absolute inset-0 z-30 rounded-3xl bg-slate-900/75 backdrop-blur-xs flex flex-col items-center justify-center p-4 text-center text-white animate-float-slow">
                    <div class="text-6xl mb-1">⛈️</div>

                <div class="text-3xl mb-1">🎪</div>
                <div class="text-xs font-bold text-purple-700 uppercase">Current Level</div>
                <div class="text-2xl font-bold text-purple-950">Level ${hero.level} / 8</div>
              </div>

              <div class="rounded-2xl bg-amber-50 border-2 border-amber-200 p-4 text-center">
                <div class="text-3xl mb-1">🪙</div>
                <div class="text-xs font-bold text-amber-700 uppercase">Total Gold Earned</div>
                <div class="text-2xl font-bold text-amber-950">${hero.stats.totalGoldEarned || hero.gold}</div>
              </div>

              <div class="rounded-2xl bg-indigo-50 border-2 border-indigo-200 p-4 text-center">
                <div class="text-3xl mb-1">🌟</div>
                <div class="text-xs font-bold text-indigo-700 uppercase">Stardust Collected</div>
                <div class="text-2xl font-bold text-indigo-950">${hero.stats.totalStardustEarned || hero.stardust}</div>
              </div>

              <div class="rounded-2xl bg-pink-50 border-2 border-pink-200 p-4 text-center">
                <div class="text-3xl mb-1">👗</div>
                <div class="text-xs font-bold text-pink-700 uppercase">Wardrobe Unlocked</div>
                <div class="text-2xl font-bold text-pink-950">${wardrobePct}% (${hero.unlockedItems.length}/38)</div>
              </div>
            </div>

            <!-- Wardrobe Completion Progress Bar -->
            <div class="bg-pink-100 rounded-full h-5 p-1 border border-pink-300">
              <div class="h-full rounded-full bg-gradient-to-r from-pink-500 via-purple-500 to-amber-400 transition-all duration-500"
                style="width: ${wardrobePct}%"></div>
            </div>
          </section>

          <!-- 8 Illustrated Fairy Badges -->
          <section class="fairy-panel rounded-3xl p-5 sm:p-6">
            <h2 class="text-xl sm:text-2xl font-bold text-purple-950 mb-4">✨ Magical Fairy Badges ✨</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              ${ACHIEVEMENT_BADGES.map(b => {
                const earned = b.check(hero);
                return `
                  <div class="rounded-3xl p-4 border-2 text-center flex flex-col items-center transition-all ${
                    earned
                      ? 'bg-gradient-to-b from-amber-50 to-white border-amber-400 shadow-md'
                      : 'bg-slate-50/80 border-slate-200 opacity-75'
                  }">
                    <div class="w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-2 shadow-inner ${
                      earned ? `bg-gradient-to-br ${b.color} text-white` : 'bg-slate-200 text-slate-400 grayscale'
                    }">
                      ${b.icon}
                    </div>
                    <h3 class="font-bold text-purple-950 text-base mb-1">${b.title}</h3>
                    <p class="text-xs text-slate-600 mb-3 flex-1">${b.desc}</p>
                    <span class="px-3 py-1 rounded-full text-xs font-bold ${
                      earned
                        ? 'bg-emerald-100 text-emerald-800 border border-emerald-300'
                        : 'bg-slate-200 text-slate-600'
                    }">
                      ${earned ? '🌟 Unlocked!' : `Progress: ${b.progress(hero)}`}
                    </span>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        </main>
      `;
    }

    /* --------------------------------------------------------------------------
     * 10. EVENT HANDLERS & GAMEPLAY ACTIONS
     * -------------------------------------------------------------------------- */
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function handleToggleMusic() {
      SoundEngine.toggleMute();
      renderApp();
    }

    function handleSwitchToMenu() {
      SoundEngine.playClick();
      AppState.screen = 'menu';
      renderApp();
    }

    function navigateScreen(screenName) {
      SoundEngine.playClick();
      AppState.screen = screenName;
      if (screenName === 'math' && !AppState.mathProblem) {
        const hero = getActiveHero();
        generateMathProblem(hero ? hero.level : 1);
      }
      if (screenName === 'spelling') {
        if (!AppState.spellItem) {
          pickNewSpellingWord(true);
        } else {
          setTimeout(() => SpeechEngine.speakWord(AppState.spellItem.word), 180);
        }
      }
      renderApp();
    }

    // Menu & Creator handlers
    function openCreatorScreen() {
      SoundEngine.playClick();
      AppState.draft = {
        name: RANDOM_FAIRY_NAMES[Math.floor(Math.random() * RANDOM_FAIRY_NAMES.length)],
        skinTone: Math.floor(Math.random() * SKIN_TONES.length),
        eyeStyle: 0,
        hairStyle: Math.floor(Math.random() * HAIR_STYLES.length),
        hairColor: Math.floor(Math.random() * HAIR_COLORS.length)
      };
      AppState.screen = 'creator';
      renderApp();
    }

    function updateDraftName(val) {
      AppState.draft.name = val;
    }

    function randomizeDraftName() {
      SoundEngine.playClick();
      const next = RANDOM_FAIRY_NAMES[Math.floor(Math.random() * RANDOM_FAIRY_NAMES.length)];
      AppState.draft.name = next;
      renderApp();
    }

    function updateDraftField(field, value) {
      SoundEngine.playClick();
      AppState.draft[field] = value;
      renderApp();
    }

    function saveCreatedHero() {
      const hero = createDefaultHero(AppState.draft);
      persistHero(hero);
      AppState.activeHeroId = hero.id;
      AppState.screen = 'festival';
      SoundEngine.playBuildFanfare();
      showToast(`🧚‍♀️ Welcome to Fairy-Festival, ${hero.name}!`, 'success');
      renderApp();
    }

    function selectHeroProfile(id) {
      SoundEngine.playClick();
      AppState.activeHeroId = id;
      localStorage.setItem(ACTIVE_KEY, id);
      AppState.screen = 'festival';
      renderApp();
    }

    function confirmDeleteHero(id) {
      SoundEngine.playClick();
      const hero = AppState.profiles.find(p => p.id === id);
      if (!hero) return;
      showConfirmModal(
        'Say Goodbye to Hero?',
        `Are you sure you want to delete ${hero.name}'s adventure progress?`,
        () => {
          AppState.profiles = AppState.profiles.filter(p => p.id !== id);
          saveAllProfiles(AppState.profiles);
          if (AppState.activeHeroId === id) {
            AppState.activeHeroId = null;
            localStorage.removeItem(ACTIVE_KEY);
          }
          showToast(`Removed ${hero.name}'s profile.`, 'magic');
          renderApp();
        }
      );
    }

    // Festival Build Track & Obstacles
    function buildCurrentStructure(evt) {
      const hero = getActiveHero();
      if (!hero) return;
      const st = FESTIVAL_STRUCTURES.find(s => s.level === hero.level);
      if (!st) return;

      const canAfford = Object.entries(st.cost).every(([k, req]) => (hero.commodities[k] || 0) >= req);
      if (!canAfford) return;

      // Deduct required commodities
      Object.entries(st.cost).forEach(([k, req]) => {
        hero.commodities[k] -= req;
      });

      // Mark built & grant rewards
      if (!hero.builtStructures.includes(st.level)) {
        hero.builtStructures.push(st.level);
      }
      hero.gold += st.rewardGold;
      hero.stardust += st.rewardStardust;
      hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + st.rewardGold;
      hero.stats.totalStardustEarned = (hero.stats.totalStardustEarned || 0) + st.rewardStardust;

      if (hero.level < 8) {
        hero.level += 1;
      }

      SoundEngine.playBuildFanfare();
      showToast(`🎉 Built ${st.name}! +${st.rewardGold} 🪙 & +${st.rewardStardust} 🌟!`, 'success');
      if (evt && evt.clientX) {
        spawnSparkleBurst(evt.clientX, evt.clientY, ['🎉', '✨', '👑', '🌸']);
      }

      persistHero(hero);
      renderApp();
    }

    function resetFestivalTrack() {
      const hero = getActiveHero();
      if (!hero) return;
      SoundEngine.playClick();
      hero.level = 1;
      hero.builtStructures = [];
      persistHero(hero);
      showToast('🎪 Festival Track reset to Level 1! All outfits & gold kept!', 'magic');
      renderApp();
    }

    function clearGrumpyRaincloud(evt) {
      const hero = getActiveHero();
      if (!hero || !hero.raincloudActive) return;
      if ((hero.commodities.strawberry || 0) < 1) return;

      hero.commodities.strawberry -= 1;
      hero.raincloudActive = false;
      hero.gold += 15;
      hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + 15;
      hero.stats.cloudsCleared = (hero.stats.cloudsCleared || 0) + 1;

      SoundEngine.playCloudClear();
      showToast('🌈 Yay! The Grumpy Raincloud turned into a happy rainbow! +15 🪙', 'success');
      if (evt && evt.clientX) {
        spawnSparkleBurst(evt.clientX, evt.clientY, ['🌈', '🍓', '✨']);
      }
      persistHero(hero);
      renderApp();
    }

    function restUntilSunrise(evt) {
      const hero = getActiveHero();
      if (!hero) return;
      hero.sunsetSteps = hero.maxSunsetSteps;
      SoundEngine.playCloudClear();
      showToast('🌅 Good morning! A bright new day begins with 8 Sun Steps!', 'success');
      if (evt && evt.clientX) {
        spawnSparkleBurst(evt.clientX, evt.clientY, ['☀️', '🌸', '✨']);
      }
      persistHero(hero);
      renderApp();
    }

    // Wishing Well Trades
    function tradeCommodities(evt) {
      const hero = getActiveHero();
      if (!hero) return;
      const from = AppState.wishFrom;
      const to = AppState.wishTo;
      if (from === to || (hero.commodities[from] || 0) < 2) return;

      hero.commodities[from] -= 2;
      hero.commodities[to] = (hero.commodities[to] || 0) + 1;
      hero.stats.tradesMade = (hero.stats.tradesMade || 0) + 1;

      SoundEngine.playWish();
      showToast(`⛲ Wished 2 ${COMMODITY_META[from].emoji} for 1 ${COMMODITY_META[to].emoji}!`, 'success');
      if (evt && evt.clientX) spawnSparkleBurst(evt.clientX, evt.clientY, ['⛲', '✨', COMMODITY_META[to].emoji]);
      persistHero(hero);
      renderApp();
    }

    function tradeStardustForCommodity(evt) {
      const hero = getActiveHero();
      if (!hero || hero.stardust < 3) return;
      const to = AppState.stardustWishTo;

      hero.stardust -= 3;
      hero.commodities[to] = (hero.commodities[to] || 0) + 1;
      hero.stats.tradesMade = (hero.stats.tradesMade || 0) + 1;

      SoundEngine.playWish();
      showToast(`🌟 Wished 3 Stardust for 1 ${COMMODITY_META[to].emoji} ${COMMODITY_META[to].singular}!`, 'success');
      if (evt && evt.clientX) spawnSparkleBurst(evt.clientX, evt.clientY, ['🌟', '✨', COMMODITY_META[to].emoji]);
      persistHero(hero);
      renderApp();
    }

    function tradeStardustForGold(evt) {
      const hero = getActiveHero();
      if (!hero || hero.stardust < 1) return;

      hero.stardust -= 1;
      hero.gold += 15;
      hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + 15;
      hero.stats.tradesMade = (hero.stats.tradesMade || 0) + 1;

      SoundEngine.playWish();
      showToast('🌟 Wished 1 Stardust for +15 🪙 Glitter Gold!', 'success');
      if (evt && evt.clientX) spawnSparkleBurst(evt.clientX, evt.clientY, ['🪙', '🌟', '✨']);
      persistHero(hero);
      renderApp();
    }

    // Math Wand Handlers
    function pressMathDigit(digit) {
      SoundEngine.playClick();
      if (AppState.mathInput.length < 3) {
        AppState.mathInput += digit;
        AppState.mathFeedback = null;
        renderApp();
      }
    }

    function clearMathInput() {
      SoundEngine.playClick();
      AppState.mathInput = '';
      AppState.mathFeedback = null;
      renderApp();
    }

    function skipMathProblem() {
      SoundEngine.playClick();
      const hero = getActiveHero();
      generateMathProblem(hero ? hero.level : 1);
      renderApp();
    }

    function submitMathAnswer(evt) {
      const hero = getActiveHero();
      if (!hero || !AppState.mathProblem || AppState.mathInput === '') return;

      const guess = Number(AppState.mathInput);
      if (guess === AppState.mathProblem.answer) {
        AppState.mathFeedback = 'correct';
        AppState.mathStreak += 1;

        const keys = Object.keys(COMMODITY_META);
        const bonusKey = keys[Math.floor(Math.random() * keys.length)];

        hero.stardust += 1;
        hero.gold += 10;
        hero.commodities[bonusKey] = (hero.commodities[bonusKey] || 0) + 1;
        hero.stats.totalStardustEarned = (hero.stats.totalStardustEarned || 0) + 1;
        hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + 10;
        hero.stats.mathSolved = (hero.stats.mathSolved || 0) + 1;

        SoundEngine.playSuccess();
        showToast(`🪄 Correct! +1 🌟, +10 🪙 & +1 ${COMMODITY_META[bonusKey].emoji}!`, 'success');
        if (evt && evt.clientX) {
          spawnSparkleBurst(evt.clientX, evt.clientY, ['🌟', '🪄', COMMODITY_META[bonusKey].emoji]);
        }
        persistHero(hero);
        renderApp();

        setTimeout(() => {
          generateMathProblem(hero.level);
          renderApp();
        }, 750);
      } else {
        AppState.mathFeedback = 'wrong';
        AppState.mathStreak = 0;
        SoundEngine.playRetry();
        renderApp();
      }
    }

    // Spelling Scroll Handlers
    function replaySpellWord() {
      SoundEngine.playClick();
      if (AppState.spellItem) {
        const ok = SpeechEngine.speakWord(AppState.spellItem.word);
        if (!ok) {
          showToast(`📜 Word to spell: ${AppState.spellItem.word}`, 'magic');
        }
      }
    }

    function replaySpellHint() {
      SoundEngine.playClick();
      if (AppState.spellItem) {
        const ok = SpeechEngine.speakSentence(AppState.spellItem.word, AppState.spellItem.sentence);
        if (!ok) {
          showToast(`💬 ${AppState.spellItem.sentence}`, 'magic');
        }
      }
    }

    function pressSpellLetter(letter) {
      SoundEngine.playClick();
      if (!AppState.spellItem) return;
      if (AppState.spellInput.length < AppState.spellItem.word.length) {
        AppState.spellInput += letter;
        AppState.spellFeedback = null;
        renderApp();
      }
    }

    function backspaceSpellLetter() {
      SoundEngine.playClick();
      AppState.spellInput = AppState.spellInput.slice(0, -1);
      AppState.spellFeedback = null;
      renderApp();
    }

    function submitSpellingAnswer(evt) {
      const hero = getActiveHero();
      if (!hero || !AppState.spellItem) return;

      const target = AppState.spellItem.word.toUpperCase();
      const attempt = AppState.spellInput.toUpperCase();

      if (attempt === target) {
        AppState.spellFeedback = 'correct';
        AppState.spellStreak += 1;

        const keys = Object.keys(COMMODITY_META);
        const bonusKey = keys[Math.floor(Math.random() * keys.length)];

        hero.stardust += 1;
        hero.gold += 10;
        hero.commodities[bonusKey] = (hero.commodities[bonusKey] || 0) + 1;
        hero.stats.totalStardustEarned = (hero.stats.totalStardustEarned || 0) + 1;
        hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + 10;
        hero.stats.wordsSpelled = (hero.stats.wordsSpelled || 0) + 1;

        SoundEngine.playSuccess();
        showToast(`📜 Wonderful! You spelled ${target}! +1 🌟, +10 🪙 & +1 ${COMMODITY_META[bonusKey].emoji}!`, 'success');
        if (evt && evt.clientX) {
          spawnSparkleBurst(evt.clientX, evt.clientY, ['📜', '🌟', COMMODITY_META[bonusKey].emoji]);
        }
        persistHero(hero);
        renderApp();

        setTimeout(() => {
          pickNewSpellingWord(true);
          renderApp();
        }, 850);
      } else {
        AppState.spellFeedback = 'wrong';
        AppState.spellStreak = 0;
        SoundEngine.playRetry();
        SpeechEngine.speakWord(target);
        renderApp();
      }
    }

    // Glitter Boutique Handlers
    function toggleEquipItem(itemId, evt) {
      const hero = getActiveHero();
      const item = getBoutiqueItem(itemId);
      if (!hero || !item) return;

      const eq = hero.equipped;
      if (eq[item.category] === item.id) {
        // Unequip
        eq[item.category] = null;
        SoundEngine.playEquip();
      } else {
        // Equip (smart mutual exclusion between Dress/Tail and Top/Bottom)
        if (item.category === 'dress') {
          eq.top = null;
          eq.bottom = null;
        } else if (item.category === 'top' || item.category === 'bottom') {
          eq.dress = null;
        }
        eq[item.category] = item.id;
        SoundEngine.playEquip();
        if (evt && evt.clientX) {
          spawnSparkleBurst(evt.clientX, evt.clientY, ['✨', '💖', '👗']);
        }
      }
      persistHero(hero);
      renderApp();
    }

    function handleBoutiqueItemClick(itemId, evt) {
      const hero = getActiveHero();
      const item = getBoutiqueItem(itemId);
      if (!hero || !item) return;

      if (hero.unlockedItems.includes(item.id)) {
        toggleEquipItem(item.id, evt);
        return;
      }

      // Attempt purchase
      if (hero.gold < item.price) {
        SoundEngine.playRetry();
        const diff = item.price - hero.gold;
        showToast(`🪙 You need ${diff} more Glitter Gold for ${item.name}!`, 'warn');
        return;
      }

      hero.gold -= item.price;
      hero.unlockedItems.push(item.id);
      SoundEngine.playPurchase();
      showToast(`🛍️ Unlocked ${item.name}!`, 'success');
      if (evt && evt.clientX) {
        spawnSparkleBurst(evt.clientX, evt.clientY, ['🪙', '✨', '👑', '💖']);
      }
      toggleEquipItem(item.id, null);
    }

    // Global physical keyboard listener for Math Wand & Spelling Scroll
    window.addEventListener('keydown', (e) => {
      if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        return;
      }
      if (AppState.screen === 'math') {
        if (/^[0-9]$/.test(e.key)) {
          pressMathDigit(e.key);
        } else if (e.key === 'Backspace') {
          clearMathInput();
        } else if (e.key === 'Enter') {
          submitMathAnswer(null);
        }
      } else if (AppState.screen === 'spelling') {
        if (/^[a-zA-Z]$/.test(e.key)) {
          pressSpellLetter(e.key.toUpperCase());
        } else if (e.key === 'Backspace') {
          backspaceSpellLetter();
        } else if (e.key === 'Enter') {
          submitSpellingAnswer(null);
        }
      }
    });

    /* --------------------------------------------------------------------------
     * 11. MAIN RENDER ORCHESTRATOR & INITIALIZATION
     * -------------------------------------------------------------------------- */
    function renderApp() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      const hero = getActiveHero();
      if (!hero && AppState.screen !== 'creator') {
        AppState.screen = 'menu';
      }

      if (AppState.screen === 'menu') {
        appEl.innerHTML = renderMenuScreen();
        return;
      }

      if (AppState.screen === 'creator') {
        appEl.innerHTML = renderCreatorScreen();
        return;
      }

      // Gameplay views include the sticky top header
      let bodyHTML = '';
      switch (AppState.screen) {
        case 'math':
          bodyHTML = renderMathScreen(hero);
          break;
        case 'spelling':
          bodyHTML = renderSpellingScreen(hero);
          break;
        case 'boutique':
          bodyHTML = renderBoutiqueScreen(hero);
          break;
        case 'badges':
          bodyHTML = renderBadgesScreen(hero);
          break;
        case 'festival':
        default:
          bodyHTML = renderFestivalScreen(hero);
          break;
      }

      appEl.innerHTML = `${renderTopHeader(hero)}${bodyHTML}`;
    }

    // Populate gentle floating ambient fairy sparkles
    function initAmbientSparkles() {
      const container = document.getElementById('bg-sparkles');
      if (!container) return;
      const icons = ['✨', '🌸', '⭐', '🦋', '💫'];
      let html = '';
      for (let i = 0; i < 16; i++) {
        const left = (i * 6.5 + 3) % 96;
        const top = (i * 11 + 5) % 92;
        const delay = (i * 0.4).toFixed(1);
        html += `<div class="absolute text-lg sm:text-xl opacity-35 animate-float-slow" style="left:${left}%; top:${top}%; animation-delay:${delay}s;">${icons[i % icons.length]}</div>`;
      }
      container.innerHTML = html;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initAmbientSparkles();
      renderApp();
    });
  </script>
</body>
</html>
