
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fairy-Festival ✨ Magical Fantasy Adventure</title>
  <!-- Google Fonts: Fredoka for warm, rounded child-friendly typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'Comic Sans MS', 'cursive', 'sans-serif'],
          },
          animation: {
            'float-slow': 'floatSlow 3.8s ease-in-out infinite',
            'bounce-gentle': 'bounceGentle 2.1s infinite',
            'wave-bar': 'waveBar 0.7s ease-in-out infinite',
          },
          keyframes: {
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-7px)' },
            },
            bounceGentle: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-5px)' },
            },
            waveBar: {
              '0%, 100%': { transform: 'scaleY(0.35)' },
              '50%': { transform: 'scaleY(1.15)' },
            }
          }
        }
      }
    };
  </script>
  <style>
    * {
      font-family: 'Fredoka', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 35%, #e0f2fe 70%, #fef9c3 100%);
      background-attachment: fixed;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* Custom whimsical scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.45);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #f472b6, #a855f7);
      border-radius: 999px;
    }

    /* Tactile 3D candy buttons for 6-7 year olds */
    .fairy-btn {
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, filter 0.14s ease;
      box-shadow: 0 4px 0 rgba(109, 40, 217, 0.24), 0 8px 16px rgba(168, 85, 247, 0.16);
    }
    .fairy-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }
    .fairy-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(109, 40, 217, 0.24), 0 3px 8px rgba(168, 85, 247, 0.14);
    }
    .fairy-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Rare boutique item golden shimmer card */
    .rare-card {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 50%, #fce7f3 100%);
      border: 2.5px solid #f59e0b;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.34);
    }

    /* Floating sparkle burst animation on equip/win */
    @keyframes popStar {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.45) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(1.35) rotate(180deg);
      }
    }
    .sparkle-burst {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: popStar 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Glassmorphic fairy panel */
    .fairy-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 10px 30px -5px rgba(147, 51, 234, 0.12), 0 4px 10px -2px rgba(236, 72, 153, 0.08);
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-pink-200 selection:text-purple-900">

  <!-- Decorative Floating Background Sparkles -->
  <div id="bg-sparkles" aria-hidden="true" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

  <!-- Toast Notification Banner (Replaces alert) -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 pointer-events-none w-11/12 max-w-md"></div>

  <!-- Custom Confirmation Modal (Replaces confirm) -->
  <div id="confirm-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-purple-950/45 backdrop-blur-sm p-4">
    <div class="fairy-panel rounded-3xl p-6 max-w-sm w-full text-center border-4 border-pink-200 animate-bounce-gentle">
      <div class="text-5xl mb-3">🧚‍♀️💫</div>
      <h3 id="confirm-title" class="text-2xl font-bold text-purple-900 mb-2">Are you sure?</h3>
      <p id="confirm-message" class="text-slate-600 text-base mb-6">Do you really want to do this?</p>
      <div class="flex gap-3 justify-center">
        <button id="confirm-cancel-btn" class="fairy-btn flex-1 py-3 px-4 rounded-2xl bg-slate-100 text-slate-700 font-bold text-lg border-2 border-slate-200">
          Keep Hero
        </button>
        <button id="confirm-ok-btn" class="fairy-btn flex-1 py-3 px-4 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-500 text-white font-bold text-lg">
          Yes, Delete
        </button>
      </div>
    </div>
  </div>

  <!-- Main App Mount Point -->
  <div id="app" class="relative z-10 min-h-screen flex flex-col"></div>

  <script>
    /**
     * ============================================================================
     * FAIRY-FESTIVAL: WHIMSICAL EDUCATIONAL FANTASY ADVENTURE
     * Complete Single-File Engine:
     *  1. Upbeat 132 BPM 16-Bar 3-Voice Web Audio API Music & SFX Synthesizer
     *  2. Bulletproof Browser Speech Synthesis Engine (`window._fairyUtterance`)
     *  3. Game Data Catalog (8 Festival Structures, 38 Boutique Items, 54 Words, 8 Badges)
     *  4. Redesigned Storybook Chibi Fairy SVG Character Renderer (`renderDollSVG`)
     *  5. LocalStorage Persistence & Interactive Screens
     * ============================================================================
     */

    /* --------------------------------------------------------------------------
     * 1. UPBEAT 132 BPM 16-BAR 3-VOICE WEB AUDIO API SOUND ENGINE
     * -------------------------------------------------------------------------- */
    const SoundEngine = (() => {
      let ctx = null;
      let isMuted = localStorage.getItem('fairy_festival_muted') === 'true';
      let bgmTimer = null;
      let stepIndex = 0;

      // 132 BPM -> 1 quarter note = 454.5ms -> 1 eighth-note step = 227ms
      const EIGHTH_MS = 227;

      // 16-Bar (128 eighth-note steps) Bouncy Fairy-Tale Celesta Lead Melody in C Major / G Major
      // 0 = rest, MIDI numbers: C5=72, D5=74, E5=76, F5=77, G5=79, A5=81, B5=83, C6=84, D6=86, E6=88
      const leadMelody16Bars = [
        // Bar 1 (C): Bouncy fairytale opening hook!
        72, 76, 79, 84,   83, 79, 76, 74,
        // Bar 2 (G): Playful skipping response
        74, 79, 83, 86,   84, 83, 79, 0,
        // Bar 3 (Am): Twirling up
        81, 84, 88, 84,   79, 81, 76, 72,
        // Bar 4 (F -> G): Cheerful turnaround
        77, 76, 74, 72,   74, 0,  79, 0,

        // Bar 5 (C): Hook reprise with high sparkle
        72, 76, 79, 84,   86, 84, 83, 79,
        // Bar 6 (G): Joyful leap
        79, 83, 86, 88,   86, 83, 79, 74,
        // Bar 7 (F/G): Bright cascading stairs
        77, 81, 84, 81,   79, 83, 86, 83,
        // Bar 8 (C): Happy phrase resolution!
        84, 0,  79, 76,   72, 0,  0,  0,

        // Bar 9 (Am): Whimsical B-section woodland dance
        81, 0,  84, 81,   76, 79, 81, 84,
        // Bar 10 (Em): Light tiptoe
        79, 0,  83, 79,   76, 74, 76, 79,
        // Bar 11 (F): Heartwarming lift
        77, 76, 77, 81,   84, 81, 77, 76,
        // Bar 12 (C): Sweet landing
        76, 79, 84, 79,   76, 0,  72, 0,

        // Bar 13 (F): Grand build-up
        77, 81, 84, 86,   84, 81, 77, 81,
        // Bar 14 (G): Sparkling climb
        79, 83, 86, 88,   86, 83, 79, 83,
        // Bar 15 (G7): Anticipation trills
        86, 84, 83, 81,   79, 81, 83, 86,
        // Bar 16 (C): Joyful finale!
        84, 0,  88, 0,    84, 0,  0,  0
      ];

      // 16-Bar Bouncy Pizzicato Bassline (128 eighth-note steps)
      // Outlines: C - G - Am - F - C - G - F/G - C | Am - Em - F - C | F - G - G7 - C
      // MIDI: C3=48, D3=50, E3=52, F3=53, G3=55, A3=57, B3=59, C4=60
      const bassLine16Bars = [
        // Bar 1 (C)
        48, 0, 55, 0,  52, 0, 55, 0,
        // Bar 2 (G)
        55, 0, 50, 0,  59, 0, 55, 0,
        // Bar 3 (Am)
        57, 0, 52, 0,  60, 0, 57, 0,
        // Bar 4 (F)
        53, 0, 60, 0,  57, 0, 55, 0,

        // Bar 5 (C)
        48, 0, 55, 0,  52, 0, 55, 0,
        // Bar 6 (G)
        55, 0, 59, 0,  50, 0, 55, 0,
        // Bar 7 (F / G)
        53, 0, 57, 0,  55, 0, 59, 0,
        // Bar 8 (C)
        48, 0, 55, 0,  48, 0, 0,  0,

        // Bar 9 (Am)
        57, 0, 60, 0,  52, 0, 57, 0,
        // Bar 10 (Em)
        52, 0, 59, 0,  55, 0, 52, 0,
        // Bar 11 (F)
        53, 0, 57, 0,  60, 0, 53, 0,
        // Bar 12 (C)
        48, 0, 52, 0,  55, 0, 48, 0,

        // Bar 13 (F)
        53, 0, 60, 0,  57, 0, 53, 0,
        // Bar 14 (G)
        55, 0, 59, 0,  62, 0, 55, 0,
        // Bar 15 (G7)
        55, 0, 53, 0,  50, 0, 55, 0,
        // Bar 16 (C)
        48, 0, 55, 0,  48, 0, 0,  0
      ];

      // 16-Bar Shimmering Harp/Bell Chord Arpeggio Layer (128 eighth-note steps)
      const arpLayer16Bars = [
        // Bar 1 (C)
        64, 67, 72, 67,  64, 67, 72, 67,
        // Bar 2 (G)
        62, 67, 71, 67,  62, 67, 71, 67,
        // Bar 3 (Am)
        64, 69, 72, 69,  64, 69, 72, 69,
        // Bar 4 (F)
        65, 69, 72, 69,  67, 71, 74, 0,

        // Bar 5 (C)
        64, 67, 72, 67,  64, 67, 72, 67,
        // Bar 6 (G)
        62, 67, 71, 67,  62, 67, 71, 67,
        // Bar 7 (F / G)
        65, 69, 72, 69,  67, 71, 74, 71,
        // Bar 8 (C)
        64, 67, 72, 76,  79, 84, 88, 0,

        // Bar 9 (Am)
        64, 69, 72, 69,  64, 69, 72, 69,
        // Bar 10 (Em)
        64, 67, 71, 67,  64, 67, 71, 67,
        // Bar 11 (F)
        65, 69, 72, 69,  65, 69, 72, 69,
        // Bar 12 (C)
        64, 67, 72, 67,  64, 72, 79, 0,

        // Bar 13 (F)
        65, 69, 72, 77,  65, 69, 72, 77,
        // Bar 14 (G)
        67, 71, 74, 79,  67, 71, 74, 79,
        // Bar 15 (G7)
        65, 67, 71, 74,  65, 67, 71, 74,
        // Bar 16 (C)
        64, 67, 72, 76,  79, 84, 91, 96
      ];

      function midiToFreq(midi) {
        return 440 * Math.pow(2, (midi - 69) / 12);
      }

      function initContext() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            ctx = new AudioCtx();
          }
        }
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        if (ctx && !bgmTimer && !isMuted) {
          startMusicLoop();
        }
      }

      // Voice 1: Sparkling Celesta / Music-Box Bell (Triangle + Octave Sine Overtone)
      function playCelestaLead(freq, duration = 0.36, volume = 0.05) {
        if (isMuted || !ctx || ctx.state !== 'running') return;
        const now = ctx.currentTime;

        const fundamental = ctx.createOscillator();
        const harmonic = ctx.createOscillator();
        const mainGain = ctx.createGain();
        const harmGain = ctx.createGain();

        fundamental.type = 'triangle';
        fundamental.frequency.setValueAtTime(freq, now);

        harmonic.type = 'sine';
        harmonic.frequency.setValueAtTime(freq * 2, now);

        mainGain.gain.setValueAtTime(0.0001, now);
        mainGain.gain.linearRampToValueAtTime(volume, now + 0.012);
        mainGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        harmGain.gain.setValueAtTime(0.0001, now);
        harmGain.gain.linearRampToValueAtTime(volume * 0.35, now + 0.008);
        harmGain.gain.exponentialRampToValueAtTime(0.0001, now + duration * 0.45);

        fundamental.connect(mainGain);
        harmonic.connect(harmGain);
        harmGain.connect(mainGain);
        mainGain.connect(ctx.destination);

        fundamental.start(now);
        harmonic.start(now);
        fundamental.stop(now + duration + 0.02);
        harmonic.stop(now + duration + 0.02);
      }

      // Voice 2: Warm Bouncy Pizzicato Bassline
      function playPizzicatoBass(freq, duration = 0.28, volume = 0.055) {
        if (isMuted || !ctx || ctx.state !== 'running') return;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(freq * 3.5, now);
        filter.frequency.exponentialRampToValueAtTime(freq * 1.1, now + duration);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.014);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      // Voice 3: Gentle Shimmering Harp Arpeggio & Phrase Chimes
      function playShimmerArp(freq, duration = 0.26, volume = 0.022) {
        if (isMuted || !ctx || ctx.state !== 'running') return;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + duration + 0.02);
      }

      function startMusicLoop() {
        if (bgmTimer) clearInterval(bgmTimer);
        bgmTimer = setInterval(() => {
          if (isMuted || !ctx || ctx.state !== 'running') return;

          const idx = stepIndex % leadMelody16Bars.length;
          const leadNote = leadMelody16Bars[idx];
          const bassNote = bassLine16Bars[idx];
          const arpNote  = arpLayer16Bars[idx];
          const isPhraseEnd = (idx === 31 || idx === 63 || idx === 95 || idx === 127);

          if (leadNote > 0) {
            playCelestaLead(midiToFreq(leadNote), 0.38, 0.048);
          }
          if (bassNote > 0) {
            playPizzicatoBass(midiToFreq(bassNote), 0.28, 0.055);
          }
          if (arpNote > 0) {
            playShimmerArp(
              midiToFreq(arpNote),
              isPhraseEnd ? 0.55 : 0.25,
              isPhraseEnd ? 0.036 : 0.02
            );
          }

          stepIndex++;
        }, EIGHTH_MS);
      }

      function toggleMute() {
        initContext();
        isMuted = !isMuted;
        localStorage.setItem('fairy_festival_muted', String(isMuted));
        if (!isMuted) {
          if (ctx && ctx.state === 'suspended') {
            ctx.resume().catch(() => {});
          }
          startMusicLoop();
          playClick();
        }
        return isMuted;
      }

      function getMuted() {
        return isMuted;
      }

      function playClick() {
        initContext();
        playCelestaLead(880, 0.14, 0.065); // A5 pop
      }

      function playSpinTick(speedRatio = 1) {
        initContext();
        const freq = 540 + Math.min(380, speedRatio * 280);
        playCelestaLead(freq, 0.08, 0.05);
      }

      function playHarvest(isRare = false) {
        initContext();
        const notes = isRare ? [587.33, 739.99, 880, 1174.66] : [523.25, 659.25, 783.99];
        notes.forEach((f, idx) => {
          setTimeout(() => playCelestaLead(f, 0.42, 0.075), idx * 80);
        });
      }

      function playThunder() {
        initContext();
        if (isMuted || !ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(135, now);
        osc.frequency.exponentialRampToValueAtTime(52, now + 0.55);

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(240, now);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.62);
      }

      function playCloudClear() {
        initContext();
        const gliss = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
        gliss.forEach((f, i) => {
          setTimeout(() => playCelestaLead(f, 0.4, 0.07), i * 60);
        });
      }

      function playWish() {
        initContext();
        const notes = [659.25, 987.77, 1318.51];
        notes.forEach((f, i) => {
          setTimeout(() => playCelestaLead(f, 0.5, 0.075), i * 95);
        });
      }

      function playBuildFanfare() {
        initContext();
        const fanfare = [
          { f: 523.25, t: 0, d: 0.24 },
          { f: 659.25, t: 120, d: 0.24 },
          { f: 783.99, t: 240, d: 0.24 },
          { f: 1046.50, t: 370, d: 0.52 },
          { f: 880.00, t: 580, d: 0.24 },
          { f: 1046.50, t: 730, d: 0.85 }
        ];
        fanfare.forEach(n => {
          setTimeout(() => playCelestaLead(n.f, n.d, 0.09), n.t);
        });
      }

      function playPurchase() {
        initContext();
        const notes = [783.99, 1046.50, 1318.51, 1567.98];
        notes.forEach((f, i) => {
          setTimeout(() => playCelestaLead(f, 0.42, 0.075), i * 70);
        });
      }

      function playEquip() {
        initContext();
        playCelestaLead(698.46, 0.16, 0.06);
        setTimeout(() => playCelestaLead(932.33, 0.24, 0.06), 65);
      }

      function playSuccess() {
        initContext();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((f, i) => {
          setTimeout(() => playCelestaLead(f, 0.38, 0.08), i * 75);
        });
      }

      function playRetry() {
        initContext();
        playCelestaLead(392.00, 0.22, 0.055);
        setTimeout(() => playCelestaLead(349.23, 0.28, 0.055), 145);
      }

      return {
        initContext,
        toggleMute,
        getMuted,
        playClick,
        playSpinTick,
        playHarvest,
        playThunder,
        playCloudClear,
        playWish,
        playBuildFanfare,
        playPurchase,
        playEquip,
        playSuccess,
        playRetry
      };
    })();

    /* --------------------------------------------------------------------------
     * 2. BULLETPROOF BROWSER SPEECH SYNTHESIS ENGINE (SPELLING SCROLL)
     * -------------------------------------------------------------------------- */
    const SpeechEngine = (() => {
      let preferredVoice = null;
      let unlocked = false;
      let isSpeaking = false;

      function loadVoices() {
        if (!('speechSynthesis' in window)) return;
        const voices = window.speechSynthesis.getVoices();
        if (!voices || !voices.length) return;
        preferredVoice =
          voices.find(v => /Google US English|Samantha|Victoria|Microsoft Zira|Microsoft Aria|Jenny|Karen/i.test(v.name)) ||
          voices.find(v => v.lang && (v.lang === 'en-US' || v.lang === 'en-GB')) ||
          voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) ||
          voices[0];
      }

      if ('speechSynthesis' in window) {
        loadVoices();
        window.speechSynthesis.onvoiceschanged = loadVoices;
      }

      function unlockSpeech() {
        if (unlocked || !('speechSynthesis' in window)) return;
        unlocked = true;
        loadVoices();
        try {
          const primer = new SpeechSynthesisUtterance('');
          primer.volume = 0;
          window._fairyUtterance = primer;
          window.speechSynthesis.speak(primer);
        } catch (e) {}
      }

      function setVisualizerState(speaking) {
        isSpeaking = speaking;
        const viz = document.getElementById('speech-wave-visualizer');
        const btn = document.getElementById('hear-word-btn');
        if (viz) {
          viz.classList.toggle('opacity-100', speaking);
          viz.classList.toggle('opacity-40', !speaking);
          viz.querySelectorAll('.wave-bar').forEach(bar => {
            if (speaking) {
              bar.classList.add('animate-wave-bar');
            } else {
              bar.classList.remove('animate-wave-bar');
            }
          });
        }
        if (btn) {
          btn.classList.toggle('ring-4', speaking);
          btn.classList.toggle('ring-sky-300', speaking);
        }
      }

      function speak(text, rate = 0.85, pitch = 1.15) {
        if (!('speechSynthesis' in window)) return false;
        try {
          loadVoices();
          window.speechSynthesis.cancel();
          window.speechSynthesis.resume();

          const utter = new SpeechSynthesisUtterance(text);
          // Anchor on window to prevent Chrome/Safari garbage collection mid-speech
          window._fairyUtterance = utter;

          if (preferredVoice) {
            utter.voice = preferredVoice;
          }
          utter.lang = (preferredVoice && preferredVoice.lang) ? preferredVoice.lang : 'en-US';
          utter.rate = rate;
          utter.pitch = pitch;
          utter.volume = 1.0;

          utter.onstart = () => setVisualizerState(true);
          utter.onend = () => setVisualizerState(false);
          utter.onerror = () => setVisualizerState(false);

          // 45ms timeout after cancel() prevents Chrome/Edge speech queue drop bug
          setTimeout(() => {
            try {
              window.speechSynthesis.resume();
              window.speechSynthesis.speak(utter);
            } catch (err) {
              setVisualizerState(false);
            }
          }, 45);

          return true;
        } catch (e) {
          setVisualizerState(false);
          return false;
        }
      }

      function speakWord(word) {
        return speak(word.toLowerCase(), 0.85, 1.15);
      }

      function speakSlow(word) {
        // Speak slowly at rate 0.6 so a 6-7 year old can sound out the phonics
        return speak(word.toLowerCase(), 0.6, 1.15);
      }

      function getIsSpeaking() {
        return isSpeaking;
      }

      return { unlockSpeech, speakWord, speakSlow, getIsSpeaking };
    })();

      return BOUTIQUE_ITEMS.find(item => item.id === id) || null;

    /**

    function renderDollSVG(hero, uid = 'doll', extraClasses = 'w-full h-full') {

      const bottomItem = getBoutiqueItem(eq.bottom);

      const hasRareAura = [dressItem, topItem, bottomItem, shoesItem, tiaraItem, wandItem].some(i => i && i.rare);

      // Layer 1 (Back): Multi-volume back hair behind shoulders

          case 6: // High Ponytail

      // Layer 3 (Front): Bangs + face-framing locks + glossy anime hair-shine highlights
      function renderFrontHair() {
        const capBase = `<path d="M68,82 C68,48 152,48 152,82 C146,62 128,56 110,56 C92,56 74,62 68,82 Z" fill="${hair.main}" stroke="${hair.dark}" stroke-width="1.5" />`;
        const glossyShine = `

          <path d="M115,63 Q126,57 139,64" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity="0.45" />
        `;

        switch (hairStyle) {
          case 0: // Twin Pigtails blunt kawaii bangs
          case 1: // Space Buns
          case 5: // Cute Pixie Bob
            return `
              ${capBase}
              <path d="M70,80 C76,52 144,52 150,80 C138,72 126,74 119,79 C114,72 106,72 101,79 C94,74 82,72 70,80 Z" fill="${hair.main}" stroke="${hair.dark}" stroke-width="1.4" />

          case 2: // Long Fairy Waves
          case 7: // Mermaid Locks
          case 8: // Ribbon Twintails
            return `
              ${capBase}
              <path d="M69,76 C65,102 68,128 75,140 C79,124 79,102 80,80 Z" fill="${hair.main}" stroke="${hair.dark}" stroke-width="1.4" />
              <path d="M151,76 C155,102 152,128 145,140 C141,124 141,102 140,80 Z" fill="${hair.main}" stroke="${hair.dark}" stroke-width="1.4" />

          case 9: // Side Braid swept bangs
            return `

      // Large Luminous Glossy Storybook Eyes (4 Distinct Styles)
      function renderChibiEyes() {
        const irisUrl = `url(#${uid}-iris)`;
        const leftCx = 92;
        const rightCx = 128;
        const cy = 91;

        const specialCatchlight = (cx) => {
          if (eyeCfg.id === 0) {
            // Starry Sparkle golden star inside lower iris
            return `<polygon points="${cx+2.5},${cy+3.5} ${cx+3.4},${cy+5.2} ${cx+5.2},${cy+5.4} ${cx+3.9},${cy+6.6} ${cx+4.2},${cy+8.4} ${cx+2.5},${cy+7.5} ${cx+0.8},${cy+8.4} ${cx+1.1},${cy+6.6} ${cx-0.2},${cy+5.4} ${cx+1.6},${cy+5.2}" fill="#FEF08A" />`;
          }
          if (eyeCfg.id === 2) {
            // Heart Twinkle pink heart catchlight
            return `<path d="M${cx+2.5},${cy+4.5} C${cx+1.3},${cy+3} ${cx-0.5},${cy+4.2} ${cx-0.5},${cy+5.8} C${cx-0.5},${cy+7.4} ${cx+2.5},${cy+9} ${cx+2.5},${cy+9} C${cx+2.5},${cy+9} ${cx+5.5},${cy+7.4} ${cx+5.5},${cy+5.8} C${cx+5.5},${cy+4.2} ${cx+3.7},${cy+3} ${cx+2.5},${cy+4.5} Z" fill="#FBCFE8" />`;
          }
          if (eyeCfg.id === 3) {
            // Ocean Dream crescent moon catchlight
            return `<path d="M${cx+3},${cy+3.5} A3.6,3.6 0 1,0 ${cx+3},${cy+9.2} A2.5,2.5 0 1,1 ${cx+3},${cy+3.5} Z" fill="#FEF9C3" />`;
          }
          // Emerald Dew luminous oval catchlight
          return `<ellipse cx="${cx+2.8}" cy="${cy+5.8}" rx="2.4" ry="1.8" fill="#A7F3D0" />`;
        };

        return `
          <g>
            <!-- Delicate Eyebrows -->
            <path d="M84,78 Q92,75 100,78" fill="none" stroke="${hair.dark}" stroke-width="1.8" stroke-linecap="round" />
            <path d="M120,78 Q128,75 136,78" fill="none" stroke="${hair.dark}" stroke-width="1.8" stroke-linecap="round" />

            <!-- Left Glossy Chibi Eye -->
            <ellipse cx="${leftCx}" cy="${cy}" rx="9.2" ry="10.4" fill="#FFFFFF" />
            <ellipse cx="${leftCx}" cy="${cy+0.5}" rx="8.2" ry="9.4" fill="${irisUrl}" />
            <circle cx="${leftCx}" cy="${cy+0.8}" r="4.1" fill="#1E1B4B" />
            ${specialCatchlight(leftCx)}
            <!-- Dual White Catchlights -->
            <circle cx="${leftCx-3.2}" cy="${cy-3.6}" r="3.1" fill="#FFFFFF" />
            <circle cx="${leftCx+3.4}" cy="${cy-1.2}" r="1.5" fill="#FFFFFF" />
            <!-- Curved Upper Eyelash -->
            <path d="M81,87 Q92,77 103,87" fill="none" stroke="#1E1B4B" stroke-width="2.8" stroke-linecap="round" />
            <path d="M81,86 L78.5,83.5" stroke="#1E1B4B" stroke-width="2.2" stroke-linecap="round" />

            <!-- Right Glossy Chibi Eye -->
            <ellipse cx="${rightCx}" cy="${cy}" rx="9.2" ry="10.4" fill="#FFFFFF" />
            <ellipse cx="${rightCx}" cy="${cy+0.5}" rx="8.2" ry="9.4" fill="${irisUrl}" />
            <circle cx="${rightCx}" cy="${cy+0.8}" r="4.1" fill="#1E1B4B" />
            ${specialCatchlight(rightCx)}
            <!-- Dual White Catchlights -->
            <circle cx="${rightCx-3.2}" cy="${cy-3.6}" r="3.1" fill="#FFFFFF" />
            <circle cx="${rightCx+3.4}" cy="${cy-1.2}" r="1.5" fill="#FFFFFF" />
            <!-- Curved Upper Eyelash -->
            <path d="M117,87 Q128,77 139,87" fill="none" stroke="#1E1B4B" stroke-width="2.8" stroke-linecap="round" />
            <path d="M139,86 L141.5,83.5" stroke="#1E1B4B" stroke-width="2.2" stroke-linecap="round" />
          </g>
        `;
      }

      // Equipped Shoes (hidden when wearing a Mermaid Tail)
      function renderShoes() {

      // Layered Ruffled Fairy Dress / Mermaid Tail OR Top + Skirt

              <rect x="95" y="156" width="30" height="6" rx="3" fill="${dressItem.color2}" />
            </g>`;
        }

        const bCol1 = bottomItem ? bottomItem.color1 : '#F472B6';
        const bCol2 = bottomItem ? bottomItem.color2 : '#FBCFE8';

    /* --------------------------------------------------------------------------
     * 5. LOCALSTORAGE PERSISTENCE & APPLICATION STATE
     * -------------------------------------------------------------------------- */
    const STORAGE_KEY = 'fairy_festival_profiles_v2';
    const ACTIVE_KEY  = 'fairy_festival_active_id_v2';

    function loadAllProfiles() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function saveAllProfiles(profiles) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
      } catch (e) {
        console.warn('Could not save to localStorage', e);
      }
    }

    function showToast(message, tone = 'magic') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        magic:   'bg-gradient-to-r from-purple-600 to-pink-500 text-white border-pink-200',
        success: 'bg-gradient-to-r from-emerald-500 to-teal-500 text-white border-emerald-200',

      const el = document.createElement('div');
      el.className = `px-5 py-3 rounded-2xl shadow-xl border-2 font-bold text-base sm:text-lg text-center transform transition-all duration-300 translate-y-0 opacity-100 ${styles[tone] || styles.magic}`;
      el.textContent = message;
      container.appendChild(el);

      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-12px)';
        setTimeout(() => el.remove(), 300);
      }, 2700);
    }

    function spawnSparkleBurst(x, y, emojis = ['✨', '🌟', '💖', '🌸']) {
      for (let i = 0; i < 12; i++) {
        const sp = document.createElement('div');
        sp.className = 'sparkle-burst text-2xl';
        sp.textContent = emojis[i % emojis.length];
        const angle = (Math.PI * 2 * i) / 12;
        const dist = 45 + Math.random() * 65;
        sp.style.left = `${x}px`;
        sp.style.top = `${y}px`;
        sp.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        sp.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
        document.body.appendChild(sp);
        setTimeout(() => sp.remove(), 900);
      }
    }

      const modal = document.getElementById('confirm-modal');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-message').textContent = message;

      modal.classList.add('flex');

      const cancelBtn = document.getElementById('confirm-cancel-btn');
      const okBtn = document.getElementById('confirm-ok-btn');

      const close = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      };

      cancelBtn.onclick = () => {
        SoundEngine.playClick();
        close();
      };
      okBtn.onclick = () => {

    /* --------------------------------------------------------------------------

     * -------------------------------------------------------------------------- */
    function generateMathProblem(level = 1) {
      const isAddition = Math.random() < 0.58;
      let maxNum = 10;
      if (level >= 3 && level <= 5) maxNum = 15;
      if (level >= 6) maxNum = 22;

      let a, b, op, answer;
      if (isAddition) {
        a = Math.floor(Math.random() * (maxNum - 2)) + 1;
        b = Math.floor(Math.random() * (maxNum - a)) + 1;
        op = '+';
        answer = a + b;
      } else {
        a = Math.floor(Math.random() * (maxNum - 3)) + 4;
        b = Math.floor(Math.random() * (a - 1)) + 1;
        op = '-';
        answer = a - b;
      }

      AppState.mathProblem = { a, b, op, answer };
      AppState.mathInput = '';
      AppState.mathFeedback = null;
    }

    function pickNewSpellingWord(speakNow = true) {
      const hero = getActiveHero();
      const lvl = hero ? hero.level : 1;
      const pool = SPELLING_WORDS.filter(item => {
        if (lvl <= 2) return item.word.length <= 5;
        return true;
      });
      let chosen = pool[Math.floor(Math.random() * pool.length)];
      if (AppState.spellItem && chosen.word === AppState.spellItem.word && pool.length > 1) {
        chosen = pool[(pool.indexOf(chosen) + 1) % pool.length];
      }
      AppState.spellItem = chosen;
      AppState.spellInput = '';
      AppState.spellAttempts = 0;
      AppState.spellFirstLetterRevealed = false;
      AppState.spellSolvedBanner = null;
      AppState.spellFeedback = null;

      if (speakNow) {
        setTimeout(() => SpeechEngine.speakWord(chosen.word), 220);
      }
    }

    /* --------------------------------------------------------------------------
     * 8. COMPASS SPINNER WHEEL LOGIC
     * -------------------------------------------------------------------------- */
    const COMPASS_SLICES = [
      { label: '+2 🍓', short: '🍓', type: 'strawberry', amount: 2, gold: 0,  stardust: 0, bg: '#FDA4AF' },
      { label: '+2 🐚', short: '🐚', type: 'pearl',      amount: 2, gold: 0,  stardust: 0, bg: '#67E8F9' },
      { label: '+2 ✨', short: '✨', type: 'pixieDust',  amount: 2, gold: 0,  stardust: 0, bg: '#FDE047' },
      { label: '+1 💎', short: '💎', type: 'gem',        amount: 1, gold: 0,  stardust: 0, bg: '#D8B4FE' },
      { label: '+1 🍓 +10🪙', short: '🍓', type: 'strawberry', amount: 1, gold: 10, stardust: 0, bg: '#FECDD3' },
      { label: '+1 🐚 +10🪙', short: '🐚', type: 'pearl',      amount: 1, gold: 10, stardust: 0, bg: '#CFFAFE' },
      { label: '+1 ✨ +10🪙', short: '✨', type: 'pixieDust',  amount: 1, gold: 10, stardust: 0, bg: '#FEF08A' },
      { label: '+1 🌟 +25🪙', short: '🌟', type: 'jackpot',    amount: 0, gold: 25, stardust: 1, bg: '#F9A8D4' }
    ];

    function spinMagicCompass(evt) {
      const hero = getActiveHero();
      if (!hero || AppState.isSpinning) return;

      if (hero.raincloudActive) {
        SoundEngine.playThunder();
        showToast('⛈️ Give the Grumpy Raincloud 1 🍓 Strawberry first!', 'warn');
        return;
      }

      if (hero.sunsetSteps <= 0) {
        SoundEngine.playRetry();
        showToast('🌙 The sun has set! Tap "Rest Until Sunrise" to spin again.', 'warn');
        return;
      }

      SoundEngine.initContext();
      AppState.isSpinning = true;
      renderApp();

      const sliceDeg = 360 / COMPASS_SLICES.length;
      const extraSpins = 4 + Math.floor(Math.random() * 3);
      const randomOffset = Math.floor(Math.random() * 360);
      const startAngle = AppState.compassAngle;
      const targetAngle = startAngle + extraSpins * 360 + randomOffset;
      const duration = 2600;
      const startTime = performance.now();
      let lastTickSlice = Math.floor(startAngle / sliceDeg);

      function animateWheel(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        const currentAngle = startAngle + (targetAngle - startAngle) * eased;
        AppState.compassAngle = currentAngle;

        const wheelEl = document.getElementById('compass-wheel-rotor');
        if (wheelEl) {
          wheelEl.style.transform = `rotate(${currentAngle}deg)`;
        }

        const currentSlice = Math.floor(currentAngle / sliceDeg);
        if (currentSlice !== lastTickSlice) {
          lastTickSlice = currentSlice;
          SoundEngine.playSpinTick(1 - t);
        }

        if (t < 1) {
          requestAnimationFrame(animateWheel);
        } else {
          const normalized = ((360 - (currentAngle % 360)) + 360) % 360;
          const winningIdx = Math.floor(normalized / sliceDeg) % COMPASS_SLICES.length;
          const prize = COMPASS_SLICES[winningIdx];

          AppState.isSpinning = false;
          hero.sunsetSteps = Math.max(0, hero.sunsetSteps - 1);
          hero.stats.spinsCount = (hero.stats.spinsCount || 0) + 1;

          if (prize.type !== 'jackpot' && prize.amount > 0) {
            hero.commodities[prize.type] = (hero.commodities[prize.type] || 0) + prize.amount;
          }
          if (prize.gold > 0) {
            hero.gold += prize.gold;
            hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + prize.gold;
          }
          if (prize.stardust > 0) {
            hero.stardust += prize.stardust;
            hero.stats.totalStardustEarned = (hero.stats.totalStardustEarned || 0) + prize.stardust;
          }

          SoundEngine.playHarvest(prize.type === 'gem' || prize.type === 'jackpot');
          showToast(`🧭 Magic Compass landed on: ${prize.label}!`, 'success');

          if (evt && evt.clientX) {
            spawnSparkleBurst(evt.clientX, evt.clientY, [prize.short, '✨', '🌟']);
          }

          if (hero.stats.spinsCount >= 2 && hero.sunsetSteps > 0 && Math.random() < 0.28) {
            hero.raincloudActive = true;
            setTimeout(() => {
              SoundEngine.playThunder();
              showToast('⛈️ Oh no! A Grumpy Raincloud floated over the compass!', 'warn');
              renderApp();
            }, 650);
          }

          persistHero(hero);
          renderApp();
        }
      }

      requestAnimationFrame(animateWheel);
    }

    // SCREEN 3: MAIN GAMEPLAY (FESTIVAL BUILD TRACK, COMPASS, RAINCLOUD & WISHING WELL)

      const allBuilt = hero.builtStructures.length >= 8;
      const currentStruct = FESTIVAL_STRUCTURES.find(s => s.level === hero.level) || FESTIVAL_STRUCTURES[7];
      const canBuild = !allBuilt && Object.entries(currentStruct.cost).every(([k, req]) => (hero.commodities[k] || 0) >= req);

      const sliceDeg = 360 / COMPASS_SLICES.length;
      const wheelSlicesSVG = COMPASS_SLICES.map((s, idx) => {
        const startRad = ((idx * sliceDeg - 90) * Math.PI) / 180;
        const endRad = (((idx + 1) * sliceDeg - 90) * Math.PI) / 180;
        const x1 = 100 + 92 * Math.cos(startRad);
        const y1 = 100 + 92 * Math.sin(startRad);
        const x2 = 100 + 92 * Math.cos(endRad);
        const y2 = 100 + 92 * Math.sin(endRad);
        const midAngle = idx * sliceDeg + sliceDeg / 2;
        const midRad = ((midAngle - 90) * Math.PI) / 180;
        const tx = 100 + 60 * Math.cos(midRad);
        const ty = 100 + 60 * Math.sin(midRad);

        return `
          <g>
            <path d="M100,100 L${x1.toFixed(1)},${y1.toFixed(1)} A92,92 0 0,1 ${x2.toFixed(1)},${y2.toFixed(1)} Z"
              fill="${s.bg}" stroke="#FFFFFF" stroke-width="2" />
            <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="central"
              transform="rotate(${midAngle} ${tx.toFixed(1)} ${ty.toFixed(1)})"
              font-size="22">${s.short}</text>
          </g>
        `;
      }).join('');

      return `

          <!-- Sequential Festival Build Track (Levels 1–8) -->

                <span>🎪</span>
                <span>Fairy Festival Build Track</span>
              </h2>
              <span class="px-3 py-1 rounded-full bg-pink-100 text-pink-800 font-bold text-xs sm:text-sm">
                ${hero.builtStructures.length} / 8 Structures Built

            </div>

            <div class="grid grid-cols-4 sm:grid-cols-8 gap-2 mb-4">

                const built = hero.builtStructures.includes(st.level);
                const current = !allBuilt && st.level === hero.level;
                return `
                  <div class="p-2 rounded-2xl border-2 text-center transition-all ${
                    built
                      ? 'bg-emerald-100 border-emerald-400 text-emerald-900'

                        ? 'bg-gradient-to-b from-pink-100 to-purple-100 border-pink-500 text-purple-950 shadow-md scale-[1.03]'

                `;
              }).join('')}
            </div>

            ${allBuilt ? `

                <div class="flex-1 text-center md:text-left">
                  <div class="inline-block px-3 py-1 rounded-full bg-amber-400 text-amber-950 font-bold text-xs mb-2">
                    👑 ROYAL FESTIVAL COMPLETE!

          <!-- Bottom Two-Column Interactive Playground: Magic Compass + Wishing Well -->

                    ${wheelSlicesSVG}
                    <circle cx="100" cy="100" r="93" fill="none" stroke="#FDE047" stroke-width="4" />
                    <circle cx="100" cy="100" r="22" fill="#FFFFFF" stroke="#EC4899" stroke-width="4" />
                    <text x="100" y="101" text-anchor="middle" dominant-baseline="central" font-size="20">🧭</text>

                ${hero.raincloudActive ? `

                      <p class="text-xs bg-amber-500/30 border border-amber-300 rounded-xl px-3 py-2 text-amber-100">

              </div>

              <div class="mt-3 w-full max-w-sm">
                ${hero.sunsetSteps > 0 ? `
                  <button onclick="spinMagicCompass(event)" ${AppState.isSpinning || hero.raincloudActive ? 'disabled' : ''}
                    class="fairy-btn w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white font-bold text-lg sm:text-xl flex items-center justify-center gap-2">

                    <span>🌅</span>
                    <span>Rest Until Sunrise (+8 Steps)</span>

                  <span>Enchanted Wishing Well</span>

                  <div class="grid grid-cols-2 gap-2 mb-2.5">
                    <div>
                      <label class="block text-xs font-bold text-slate-600 mb-1">Give 2 of:</label>
                      <select onchange="AppState.wishFrom = this.value; renderApp();"
                        class="w-full px-2.5 py-2 rounded-xl border-2 border-sky-300 bg-white font-bold text-sm text-slate-800">
                        ${Object.entries(COMMODITY_META).map(([k, m]) => `
                          <option value="${k}" ${AppState.wishFrom === k ? 'selected' : ''}>
                            ${m.emoji} ${m.label} (${hero.commodities[k] || 0})
                          </option>
                        `).join('')}
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-600 mb-1">Receive 1 of:</label>
                      <select onchange="AppState.wishTo = this.value; renderApp();"
                        class="w-full px-2.5 py-2 rounded-xl border-2 border-sky-300 bg-white font-bold text-sm text-slate-800">
                        ${Object.entries(COMMODITY_META).map(([k, m]) => `
                          <option value="${k}" ${AppState.wishTo === k ? 'selected' : ''}>
                            ${m.emoji} ${m.singular}
                          </option>
                        `).join('')}
                      </select>
                    </div>
                  </div>
                  <button onclick="tradeCommodities(event)"
                    ${(hero.commodities[AppState.wishFrom] || 0) < 2 || AppState.wishFrom === AppState.wishTo ? 'disabled' : ''}
                    class="fairy-btn w-full py-2.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 text-white font-bold text-sm">
                    Make 2-for-1 Wish ✨
                  </button>
                </div>

                <div class="bg-indigo-50/90 border-2 border-indigo-200 rounded-2xl p-3.5">
                  <div class="font-bold text-indigo-950 text-sm mb-2">🌟 Star Stardust Wishes (You have ${hero.stardust} 🌟)</div>
                  <div class="flex gap-2 mb-2.5">
                    <select onchange="AppState.stardustWishTo = this.value; renderApp();"
                      class="flex-1 px-2.5 py-2 rounded-xl border-2 border-indigo-300 bg-white font-bold text-sm text-slate-800">
                      ${Object.entries(COMMODITY_META).map(([k, m]) => `
                        <option value="${k}" ${AppState.stardustWishTo === k ? 'selected' : ''}>
                          1 ${m.emoji} ${m.singular}

                      `).join('')}
                    </select>
                    <button onclick="tradeStardustForCommodity(event)" ${hero.stardust < 3 ? 'disabled' : ''}
                      class="fairy-btn px-3.5 py-2 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold text-xs sm:text-sm whitespace-nowrap">
                      Trade 3 🌟 → 1
                    </button>
                  </div>
                  <button onclick="tradeStardustForGold(event)" ${hero.stardust < 1 ? 'disabled' : ''}
                    class="fairy-btn w-full py-2 rounded-xl bg-amber-400 text-amber-950 font-bold text-xs sm:text-sm border border-amber-500">

                  </button>

              </div>

              <div class="pt-2 border-t border-purple-100">
                <div class="text-xs font-bold text-purple-900 mb-2">Need more 🌟 Stardust or 🍓 Strawberries?</div>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="navigateScreen('math')" class="fairy-btn py-2.5 px-3 rounded-2xl bg-purple-100 text-purple-900 border-2 border-purple-300 font-bold text-xs sm:text-sm">

                    📜 Spelling Scroll
                  </button>
                </div>
              </div>
            </section>
          </div>
        </main>
      `;

    /* --------------------------------------------------------------------------
     * 10. EVENT HANDLERS & GAMEPLAY ACTIONS
     * -------------------------------------------------------------------------- */
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function handleToggleMusic() {
      SoundEngine.toggleMute();
      renderApp();
    }

    function handleSwitchToMenu() {
      SoundEngine.playClick();
      AppState.screen = 'menu';
      renderApp();
    }

    function navigateScreen(screenName) {
      SoundEngine.playClick();
      SpeechEngine.unlockSpeech();
      AppState.screen = screenName;
      if (screenName === 'math' && !AppState.mathProblem) {
        const hero = getActiveHero();
        generateMathProblem(hero ? hero.level : 1);
      }
      if (screenName === 'spelling') {
        if (!AppState.spellItem) {
          pickNewSpellingWord(true);
        } else {
          setTimeout(() => SpeechEngine.speakWord(AppState.spellItem.word), 220);
        }
      }
      renderApp();
    }

    function openCreatorScreen() {
      SoundEngine.playClick();
      AppState.draft = {
        name: RANDOM_FAIRY_NAMES[Math.floor(Math.random() * RANDOM_FAIRY_NAMES.length)],
        skinTone: Math.floor(Math.random() * SKIN_TONES.length),
        eyeStyle: 0,
        hairStyle: Math.floor(Math.random() * HAIR_STYLES.length),
        hairColor: Math.floor(Math.random() * HAIR_COLORS.length)
      };
      AppState.screen = 'creator';
      renderApp();
    }

    function updateDraftName(val) {
      AppState.draft.name = val;
    }

    function randomizeDraftName() {
      SoundEngine.playClick();
      const next = RANDOM_FAIRY_NAMES[Math.floor(Math.random() * RANDOM_FAIRY_NAMES.length)];
      AppState.draft.name = next;
      renderApp();
    }

    function updateDraftField(field, value) {
      SoundEngine.playClick();
      AppState.draft[field] = value;
      renderApp();
    }

    function saveCreatedHero() {
      const hero = createDefaultHero(AppState.draft);
      persistHero(hero);
      AppState.activeHeroId = hero.id;
      AppState.screen = 'festival';
      SoundEngine.playBuildFanfare();
      showToast(`🧚‍♀️ Welcome to Fairy-Festival, ${hero.name}!`, 'success');
      renderApp();
    }

    function selectHeroProfile(id) {
      SoundEngine.playClick();
      AppState.activeHeroId = id;
      localStorage.setItem(ACTIVE_KEY, id);
      AppState.screen = 'festival';
      renderApp();
    }

    function confirmDeleteHero(id) {
      SoundEngine.playClick();
      const hero = AppState.profiles.find(p => p.id === id);
      if (!hero) return;
      showConfirmModal(
        'Say Goodbye to Hero?',
        `Are you sure you want to delete ${hero.name}'s adventure progress?`,
        () => {
          AppState.profiles = AppState.profiles.filter(p => p.id !== id);
          saveAllProfiles(AppState.profiles);
          if (AppState.activeHeroId === id) {
            AppState.activeHeroId = null;
            localStorage.removeItem(ACTIVE_KEY);
          }
          showToast(`Removed ${hero.name}'s profile.`, 'magic');
          renderApp();
        }
      );
    }

    function buildCurrentStructure(evt) {
      const hero = getActiveHero();
      if (!hero) return;
      const st = FESTIVAL_STRUCTURES.find(s => s.level === hero.level);
      if (!st) return;

      const canAfford = Object.entries(st.cost).every(([k, req]) => (hero.commodities[k] || 0) >= req);
      if (!canAfford) return;

      Object.entries(st.cost).forEach(([k, req]) => {
        hero.commodities[k] -= req;
      });

      if (!hero.builtStructures.includes(st.level)) {
        hero.builtStructures.push(st.level);
      }
      hero.gold += st.rewardGold;
      hero.stardust += st.rewardStardust;
      hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + st.rewardGold;
      hero.stats.totalStardustEarned = (hero.stats.totalStardustEarned || 0) + st.rewardStardust;

      if (hero.level < 8) {
        hero.level += 1;
      }

      SoundEngine.playBuildFanfare();
      showToast(`🎉 Built ${st.name}! +${st.rewardGold} 🪙 & +${st.rewardStardust} 🌟!`, 'success');
      if (evt && evt.clientX) {
        spawnSparkleBurst(evt.clientX, evt.clientY, ['🎉', '✨', '👑', '🌸']);
      }

      persistHero(hero);
      renderApp();
    }

    function resetFestivalTrack() {
      const hero = getActiveHero();
      if (!hero) return;
      SoundEngine.playClick();
      hero.level = 1;
      hero.builtStructures = [];
      persistHero(hero);
      showToast('🎪 Festival Track reset to Level 1! All outfits & gold kept!', 'magic');
      renderApp();
    }

    function clearGrumpyRaincloud(evt) {
      const hero = getActiveHero();
      if (!hero || !hero.raincloudActive) return;
      if ((hero.commodities.strawberry || 0) < 1) return;

      hero.commodities.strawberry -= 1;
      hero.raincloudActive = false;
      hero.gold += 15;
      hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + 15;
      hero.stats.cloudsCleared = (hero.stats.cloudsCleared || 0) + 1;

      SoundEngine.playCloudClear();
      showToast('🌈 Yay! The Grumpy Raincloud turned into a happy rainbow! +15 🪙', 'success');
      if (evt && evt.clientX) {
        spawnSparkleBurst(evt.clientX, evt.clientY, ['🌈', '🍓', '✨']);
      }
      persistHero(hero);
      renderApp();
    }

    function restUntilSunrise(evt) {
      const hero = getActiveHero();
      if (!hero) return;
      hero.sunsetSteps = hero.maxSunsetSteps;
      SoundEngine.playCloudClear();
      showToast('🌅 Good morning! A bright new day begins with 8 Sun Steps!', 'success');
      if (evt && evt.clientX) {
        spawnSparkleBurst(evt.clientX, evt.clientY, ['☀️', '🌸', '✨']);
      }
      persistHero(hero);
      renderApp();
    }

    function tradeCommodities(evt) {
      const hero = getActiveHero();
      if (!hero) return;
      const from = AppState.wishFrom;
      const to = AppState.wishTo;
      if (from === to || (hero.commodities[from] || 0) < 2) return;

      hero.commodities[from] -= 2;
      hero.commodities[to] = (hero.commodities[to] || 0) + 1;
      hero.stats.tradesMade = (hero.stats.tradesMade || 0) + 1;

      SoundEngine.playWish();
      showToast(`⛲ Wished 2 ${COMMODITY_META[from].emoji} for 1 ${COMMODITY_META[to].emoji}!`, 'success');
      if (evt && evt.clientX) spawnSparkleBurst(evt.clientX, evt.clientY, ['⛲', '✨', COMMODITY_META[to].emoji]);
      persistHero(hero);
      renderApp();
    }

    function tradeStardustForCommodity(evt) {
      const hero = getActiveHero();
      if (!hero || hero.stardust < 3) return;
      const to = AppState.stardustWishTo;

      hero.stardust -= 3;
      hero.commodities[to] = (hero.commodities[to] || 0) + 1;
      hero.stats.tradesMade = (hero.stats.tradesMade || 0) + 1;

      SoundEngine.playWish();
      showToast(`🌟 Wished 3 Stardust for 1 ${COMMODITY_META[to].emoji} ${COMMODITY_META[to].singular}!`, 'success');
      if (evt && evt.clientX) spawnSparkleBurst(evt.clientX, evt.clientY, ['🌟', '✨', COMMODITY_META[to].emoji]);
      persistHero(hero);
      renderApp();
    }

    function tradeStardustForGold(evt) {
      const hero = getActiveHero();
      if (!hero || hero.stardust < 1) return;

      hero.stardust -= 1;
      hero.gold += 15;
      hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + 15;
      hero.stats.tradesMade = (hero.stats.tradesMade || 0) + 1;

      SoundEngine.playWish();
      showToast('🌟 Wished 1 Stardust for +15 🪙 Glitter Gold!', 'success');
      if (evt && evt.clientX) spawnSparkleBurst(evt.clientX, evt.clientY, ['🪙', '🌟', '✨']);
      persistHero(hero);
      renderApp();
    }

    function pressMathDigit(digit) {
      SoundEngine.playClick();
      if (AppState.mathInput.length < 3) {
        AppState.mathInput += digit;
        AppState.mathFeedback = null;
        renderApp();
      }
    }

    function clearMathInput() {
      SoundEngine.playClick();
      AppState.mathInput = '';
      AppState.mathFeedback = null;
      renderApp();
    }

    function skipMathProblem() {
      SoundEngine.playClick();
      const hero = getActiveHero();
      generateMathProblem(hero ? hero.level : 1);
      renderApp();
    }

    function submitMathAnswer(evt) {
      const hero = getActiveHero();
      if (!hero || !AppState.mathProblem || AppState.mathInput === '') return;

      const guess = Number(AppState.mathInput);
      if (guess === AppState.mathProblem.answer) {
        AppState.mathFeedback = 'correct';
        AppState.mathStreak += 1;

        const keys = Object.keys(COMMODITY_META);
        const bonusKey = keys[Math.floor(Math.random() * keys.length)];

        hero.stardust += 1;
        hero.gold += 10;
        hero.commodities[bonusKey] = (hero.commodities[bonusKey] || 0) + 1;
        hero.stats.totalStardustEarned = (hero.stats.totalStardustEarned || 0) + 1;
        hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + 10;
        hero.stats.mathSolved = (hero.stats.mathSolved || 0) + 1;

        SoundEngine.playSuccess();
        showToast(`🪄 Correct! +1 🌟, +10 🪙 & +1 ${COMMODITY_META[bonusKey].emoji}!`, 'success');
        if (evt && evt.clientX) {
          spawnSparkleBurst(evt.clientX, evt.clientY, ['🌟', '🪄', COMMODITY_META[bonusKey].emoji]);
        }
        persistHero(hero);
        renderApp();

        setTimeout(() => {
          generateMathProblem(hero.level);
          renderApp();
        }, 750);
      } else {
        AppState.mathFeedback = 'wrong';
        AppState.mathStreak = 0;
        SoundEngine.playRetry();
        renderApp();
      }
    }

    // Spelling Scroll Handlers (Audio-Only Prompt — NEVER reveals spelling prior to solving)
    function replaySpellWord() {
      SpeechEngine.unlockSpeech();
      if (AppState.spellItem) {
        const ok = SpeechEngine.speakWord(AppState.spellItem.word);
        if (!ok) {
          showToast('🔊 Listen to your device speakers and use the picture clue!', 'magic');
        }
      }
    }

    function replaySpellSlow() {
      SpeechEngine.unlockSpeech();
      if (AppState.spellItem) {
        const ok = SpeechEngine.speakSlow(AppState.spellItem.word);
        if (!ok) {
          showToast('🐢 Sound out each letter using the picture clue!', 'magic');
        }
      }
    }

    function revealFirstLetterHint() {
      SoundEngine.playClick();
      AppState.spellFirstLetterRevealed = true;
      renderApp();
    }

    function pressSpellLetter(letter) {
      SoundEngine.playClick();
      if (!AppState.spellItem || AppState.spellFeedback === 'correct') return;
      if (AppState.spellInput.length < AppState.spellItem.word.length) {
        AppState.spellInput += letter;
        AppState.spellFeedback = null;
        renderApp();
      }
    }

    function backspaceSpellLetter() {
      SoundEngine.playClick();
      if (AppState.spellFeedback === 'correct') return;
      AppState.spellInput = AppState.spellInput.slice(0, -1);
      AppState.spellFeedback = null;
      renderApp();
    }

    function submitSpellingAnswer(evt) {
      const hero = getActiveHero();
      if (!hero || !AppState.spellItem || AppState.spellFeedback === 'correct') return;

      const target = AppState.spellItem.word.toUpperCase();
      const attempt = AppState.spellInput.toUpperCase();

      if (attempt === target) {
        AppState.spellFeedback = 'correct';
        AppState.spellStreak += 1;

        const keys = Object.keys(COMMODITY_META);
        const bonusKey = keys[Math.floor(Math.random() * keys.length)];

        hero.stardust += 1;
        hero.gold += 10;
        hero.commodities[bonusKey] = (hero.commodities[bonusKey] || 0) + 1;
        hero.stats.totalStardustEarned = (hero.stats.totalStardustEarned || 0) + 1;
        hero.stats.totalGoldEarned = (hero.stats.totalGoldEarned || 0) + 10;
        hero.stats.wordsSpelled = (hero.stats.wordsSpelled || 0) + 1;

        SoundEngine.playSuccess();
        showToast(`📜 Wonderful! You spelled ${target}! +1 🌟, +10 🪙 & +1 ${COMMODITY_META[bonusKey].emoji}!`, 'success');
        if (evt && evt.clientX) {
          spawnSparkleBurst(evt.clientX, evt.clientY, ['📜', '🌟', '🎉', COMMODITY_META[bonusKey].emoji]);
        } else {
          spawnSparkleBurst(window.innerWidth / 2, window.innerHeight / 3, ['📜', '🌟', '🎉', COMMODITY_META[bonusKey].emoji]);
        }
        persistHero(hero);
        renderApp();

        setTimeout(() => {
          pickNewSpellingWord(true);
          renderApp();
        }, 1250);
      } else {
        AppState.spellFeedback = 'wrong';
        AppState.spellStreak = 0;
        AppState.spellAttempts += 1;
        SoundEngine.playRetry();
        SpeechEngine.speakSlow(target);
        renderApp();
      }
    }

    // Glitter Boutique Handlers
    function toggleEquipItem(itemId, evt) {
      const hero = getActiveHero();
      const item = getBoutiqueItem(itemId);
      if (!hero || !item) return;

      const eq = hero.equipped;
      if (eq[item.category] === item.id) {
        eq[item.category] = null;
        SoundEngine.playEquip();
      } else {
        if (item.category === 'dress') {
          eq.top = null;
          eq.bottom = null;
        } else if (item.category === 'top' || item.category === 'bottom') {
          eq.dress = null;
        }
        eq[item.category] = item.id;
        SoundEngine.playEquip();
        if (evt && evt.clientX) {
          spawnSparkleBurst(evt.clientX, evt.clientY, ['✨', '💖', '👗']);
        }
      }
      persistHero(hero);
      renderApp();
    }

    function handleBoutiqueItemClick(itemId, evt) {
      const hero = getActiveHero();
      const item = getBoutiqueItem(itemId);
      if (!hero || !item) return;

      if (hero.unlockedItems.includes(item.id)) {
        toggleEquipItem(item.id, evt);
        return;
      }

      if (hero.gold < item.price) {
        SoundEngine.playRetry();
        const diff = item.price - hero.gold;
        showToast(`🪙 You need ${diff} more Glitter Gold for ${item.name}!`, 'warn');
        return;
      }

      hero.gold -= item.price;
      hero.unlockedItems.push(item.id);
      SoundEngine.playPurchase();
      showToast(`🛍️ Unlocked ${item.name}!`, 'success');
      if (evt && evt.clientX) {
        spawnSparkleBurst(evt.clientX, evt.clientY, ['🪙', '✨', '👑', '💖']);
      }
      toggleEquipItem(item.id, null);
    }

    // Physical keyboard support for Math Wand & Spelling Scroll
    window.addEventListener('keydown', (e) => {
      if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
        return;
      }
      if (AppState.screen === 'math') {
        if (/^[0-9]$/.test(e.key)) {
          pressMathDigit(e.key);
        } else if (e.key === 'Backspace') {
          clearMathInput();
        } else if (e.key === 'Enter') {
          submitMathAnswer(null);
        }
      } else if (AppState.screen === 'spelling') {
        if (/^[a-zA-Z]$/.test(e.key)) {
          pressSpellLetter(e.key.toUpperCase());
        } else if (e.key === 'Backspace') {
          backspaceSpellLetter();
        } else if (e.key === 'Enter') {
          submitSpellingAnswer(null);
        }
      }
    });

    /* --------------------------------------------------------------------------
     * 11. MAIN RENDER ORCHESTRATOR & INITIALIZATION
     * -------------------------------------------------------------------------- */
    function renderApp() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      const hero = getActiveHero();
      if (!hero && AppState.screen !== 'creator') {
        AppState.screen = 'menu';
      }

      if (AppState.screen === 'menu') {
        appEl.innerHTML = renderMenuScreen();
        return;
      }

      if (AppState.screen === 'creator') {
        appEl.innerHTML = renderCreatorScreen();
        return;
      }

      let bodyHTML = '';
      switch (AppState.screen) {
        case 'math':
          bodyHTML = renderMathScreen(hero);
          break;
        case 'spelling':
          bodyHTML = renderSpellingScreen();
          break;
        case 'boutique':
          bodyHTML = renderBoutiqueScreen(hero);
          break;
        case 'badges':
          bodyHTML = renderBadgesScreen(hero);
          break;
        case 'festival':
        default:
          bodyHTML = renderFestivalScreen(hero);
          break;
      }

      appEl.innerHTML = `${renderTopHeader(hero)}${bodyHTML}`;
    }

    function initAmbientSparkles() {
      const container = document.getElementById('bg-sparkles');
      if (!container) return;
      const icons = ['✨', '🌸', '⭐', '🦋', '💫'];
      let html = '';
      for (let i = 0; i < 16; i++) {
        const left = (i * 6.5 + 3) % 96;
        const top = (i * 11 + 5) % 92;
        const delay = (i * 0.4).toFixed(1);
        html += `<div class="absolute text-lg sm:text-xl opacity-35 animate-float-slow" style="left:${left}%; top:${top}%; animation-delay:${delay}s;">${icons[i % icons.length]}</div>`;
      }
      container.innerHTML = html;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initAmbientSparkles();
      renderApp();
    });
  </script>
</body>
</html>
