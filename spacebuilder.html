  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
          },
          animation: {
            'float-slow': 'floatSlow 4s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 2.2s ease-in-out infinite',
            'bounce-gentle': 'bounceGentle 1.8s ease-in-out infinite',
            'zap': 'zapShake 0.45s ease-in-out infinite',
          },
          keyframes: {
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.78', transform: 'scale(1)' },
              '50%': { opacity: '1', transform: 'scale(1.06)' },
            },
            bounceGentle: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-4px)' },
            },
            zapShake: {
              '0%, 100%': { transform: 'translateX(0) rotate(0deg)' },
              '25%': { transform: 'translateX(-3px) rotate(-1.2deg)' },
              '75%': { transform: 'translateX(3px) rotate(1.2deg)' },
            }
          }
        }
      }
    };

  <style>
    * {
      font-family: 'Fredoka', sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 1.2s ease;
    }

    /* Dynamic Sky Themes across the 20-Turn Sundown Clock */
    body.sky-day {
      background: radial-gradient(circle at 80% 15%, #38bdf8 0%, #2563eb 34%, #312e81 78%, #1e1b4b 100%);
    }
    body.sky-sunset {
      background: radial-gradient(circle at 75% 45%, #fb923c 0%, #e11d48 36%, #6d28d9 75%, #1e1b4b 100%);
    }
    body.sky-night {
      background: radial-gradient(circle at 25% 20%, #312e81 0%, #1e1b4b 45%, #070b14 100%);
    }

    /* Glossy 3D Kid-Friendly Tactile Buttons */
    .btn-space {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, filter 0.15s ease;
      box-shadow: 0 5px 0 rgba(15, 23, 42, 0.45);
    }
    .btn-space:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }
    .btn-space:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(15, 23, 42, 0.45);
    }
    .btn-space:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Glassmorphism Space Cards */
    .space-panel {
      background: rgba(15, 23, 42, 0.74);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.36);
    }

    /* GPU-Accelerated Spinner Rotor */
    #compass-wheel-rotor {
      transform-origin: 50% 50%;
      will-change: transform;
    }

    /* Pointer Tick Spring */
    #compass-pointer {
      transform-origin: 50% 15%;
      transition: transform 0.09s ease-out;
      pointer-events: none;
    }

    /* Starfield twinkling background */
    .star-dot {
      position: fixed;
      background: white;
      border-radius: 9999px;
      pointer-events: none;
      z-index: 0;
      animation: twinkle var(--dur, 3s) ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.22; transform: scale(0.85); }
      50% { opacity: 0.95; transform: scale(1.25); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.4);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(129, 140, 248, 0.5);
      border-radius: 999px;
    }
  </style>

    /* --------------------------------------------------------------------------
     * 3. PROCEDURAL WEB AUDIO API SOUND ENGINE
     * -------------------------------------------------------------------------- */
    class SpaceSoundEngine {
      constructor() {
        this.ctx = null;
        this.musicOn = false;
        this.sfxOn = true;
        this.musicTimer = null;
        this.noteStep = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playTone(freq, duration = 0.2, type = 'sine', volume = 0.14, delay = 0, slideTo = null) {
        if (!this.sfxOn) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
        }

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(volume, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.03);
      }

      playSpinStart() {
        this.playTone(260, 0.28, 'sine', 0.14, 0, 620);
      }

      playTick() {
        this.playTone(760, 0.04, 'triangle', 0.1, 0, 440);
      }

      playClick() {
        this.playTone(520, 0.08, 'sine', 0.1, 0, 660);
      }

      playHarvest() {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          this.playTone(f, 0.24, 'triangle', 0.14, idx * 0.07);
        });
      }

      playStormZap() {
        this.playTone(190, 0.45, 'sawtooth', 0.16, 0, 58);
        this.playTone(440, 0.18, 'square', 0.1, 0.08, 120);
        this.playTone(320, 0.3, 'sawtooth', 0.12, 0.2, 70);
      }

      playStormClear() {
        [392, 493.88, 587.33, 783.99, 987.77, 1174.66].forEach((f, idx) => {
          this.playTone(f, 0.3, 'sine', 0.14, idx * 0.055);
        });
      }

      playBuild() {
        this.playTone(240, 0.09, 'square', 0.11, 0, 340);
        this.playTone(240, 0.09, 'square', 0.11, 0.12, 360);
        this.playTone(587.33, 0.25, 'triangle', 0.15, 0.25, 880);
      }

      playWinFanfare() {
        const notes = [
          { f: 523.25, d: 0.16, t: 0 },
          { f: 659.25, d: 0.16, t: 0.15 },
          { f: 783.99, d: 0.16, t: 0.30 },
          { f: 1046.5, d: 0.32, t: 0.45 },
          { f: 880.00, d: 0.18, t: 0.78 },
          { f: 1046.5, d: 0.50, t: 0.96 }
        ];
        notes.forEach(n => this.playTone(n.f, n.d, 'triangle', 0.17, n.t));
      }

      playPurchase() {
        this.playTone(880, 0.12, 'sine', 0.14, 0);
        this.playTone(1318.5, 0.3, 'triangle', 0.15, 0.09);
      }

      playSuccess() {
        this.playTone(587.33, 0.15, 'sine', 0.14, 0);
        this.playTone(880, 0.28, 'triangle', 0.15, 0.11);
      }

      playGentleOops() {
        this.playTone(260, 0.22, 'sine', 0.11, 0, 210);
      }

      toggleMusic() {
        this.init();
        this.musicOn = !this.musicOn;
        if (this.musicOn) {
          this.startMusicLoop();
        } else {
          this.stopMusicLoop();
        }
        return this.musicOn;
      }

      startMusicLoop() {
        this.stopMusicLoop();
        const melody = [
          261.63, 329.63, 392.00, 493.88,
          523.25, 493.88, 392.00, 329.63,
          293.66, 349.23, 440.00, 523.25,
          392.00, 329.63, 293.66, 246.94
        ];
        this.musicTimer = setInterval(() => {
          if (!this.musicOn || !this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
          const freq = melody[this.noteStep % melody.length];
          this.noteStep++;

          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.038, now + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.58);
        }, 560);
      }

      stopMusicLoop() {
        if (this.musicTimer) {
          clearInterval(this.musicTimer);
          this.musicTimer = null;
        }
      }
    }

    /* --------------------------------------------------------------------------
     * 4. BROWSER SPEECH SYNTHESIS ENGINE (HEBREW SIGHT-WORD AUDIO)
     * -------------------------------------------------------------------------- */
    function speakHebrewWord(wordObj, slow = false) {
      if (!('speechSynthesis' in window)) {
        showToast('Speech audio not supported in this browser — read the phonetic hint!', 'amber');
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const voices = window.speechSynthesis.getVoices();
        const hebrewVoice = voices.find(v =>
          v.lang && (v.lang.toLowerCase().startsWith('he') || v.lang.toLowerCase().startsWith('iw'))
        );

        const utterance = new SpeechSynthesisUtterance();
        if (hebrewVoice) {
          utterance.voice = hebrewVoice;
          utterance.lang = hebrewVoice.lang;
          utterance.text = wordObj.hebrew;
        } else {
          utterance.lang = 'en-US';
          utterance.text = wordObj.translit.replace(/-/g, ' ');
        }

        utterance.rate = slow ? 0.55 : 0.92;
        utterance.pitch = slow ? 1.0 : 1.06;
        utterance.volume = 1.0;
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        console.warn('SpeechSynthesis error:', e);
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    function loadProfiles() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            state.profiles = parsed.map(p => ({
              ...p,
              inventory: {
                iron: p.inventory?.iron ?? 2,
                titanium: p.inventory?.titanium ?? 1,
                solar: p.inventory?.solar ?? 2,
                fuel: p.inventory?.fuel ?? p.inventory?.quartz ?? 0
              }
            }));
          }
        }
      } catch (err) {
        console.error('Failed to load profiles:', err);
        state.profiles = [];
      }
    }

    function saveProfiles() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.profiles));
      } catch (err) {
        console.error('Failed to save profiles:', err);
      }
    }

    function getActiveProfile() {
      return state.profiles.find(p => p.id === state.activeProfileId) || null;
    }

    function createNewProfile(name, skinTone) {
      const cleanName = (name || '').trim() || 'Captain Leo';
      const newHero = {
        id: 'hero_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        name: cleanName.slice(0, 20),
        skinTone: skinTone || SKIN_TONES[2].hex,
        coins: 50,
        stardust: 3,
        inventory: {
          iron: 2,
          titanium: 1,
          solar: 2,
          fuel: 0
        },
        level: 1,
        buildStage: 0,
        masterCompleted: false,
        spinsRemaining: MAX_SUNDOWN_SPINS, // 20 turns!
        dayCount: 1,
        stormActive: false,
        unlockedItems: ['suit_cadet', 'helmet_none', 'boots_standard'],
        equipped: {
          suit: 'suit_cadet',
          helmet: 'helmet_none',
          boots: 'boots_standard'
        },
        stats: {
          totalSpins: 0,
          stormsCleared: 0,
          mathSolved: 0,
          hebrewSolved: 0
        }
      };

      state.profiles.push(newHero);
      saveProfiles();
      return newHero;
    }

    function deleteProfileById(id) {
      state.profiles = state.profiles.filter(p => p.id !== id);
      if (state.activeProfileId === id) {
        state.activeProfileId = null;
        state.screen = 'menu';

      saveProfiles();

    function updateSkyTheme() {
      const hero = getActiveProfile();
      const body = document.body;
      body.classList.remove('sky-day', 'sky-sunset', 'sky-night');

      if (!hero || state.screen !== 'game') {
        body.classList.add('sky-day');
        return;
      }

      const left = hero.spinsRemaining;
      if (left >= 11) {
        body.classList.add('sky-day');
      } else if (left >= 5) {
        body.classList.add('sky-sunset');
      } else {
        body.classList.add('sky-night');
      }
    }

    function buildStarfield() {
      const container = document.getElementById('starfield');
      if (!container) return;
      let html = '';
      for (let i = 0; i < 42; i++) {
        const left = (i * 37) % 100;
        const top = (i * 53) % 100;
        const size = (i % 3) + 1.5;
        const dur = 2.2 + (i % 4) * 0.9;
        html += `<div class="star-dot" style="left:${left}%;top:${top}%;width:${size}px;height:${size}px;--dur:${dur}s;"></div>`;
      }
      container.innerHTML = html;
    }

    /* --------------------------------------------------------------------------
     * 9. CUSTOM TOAST & MODAL HELPERS (ZERO alert() / confirm())
     * -------------------------------------------------------------------------- */
    function showToast(message, tone = 'indigo') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const palette = {
        indigo: 'bg-indigo-600 border-indigo-300 text-white',
        emerald: 'bg-emerald-600 border-emerald-300 text-white',
        amber: 'bg-amber-500 border-yellow-200 text-slate-950 font-bold',
        red: 'bg-rose-600 border-rose-300 text-white',
        purple: 'bg-purple-600 border-purple-300 text-white'
      };

      const toast = document.createElement('div');
      toast.className = `${palette[tone] || palette.indigo} border-2 px-5 py-3 rounded-2xl shadow-2xl text-sm sm:text-base font-semibold text-center transition-all duration-300 transform translate-y-2 opacity-0`;
      toast.textContent = message;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function openModal(innerHTML) {
      const root = document.getElementById('modal-root');
      if (!root) return;
      root.innerHTML = `
        <div class="space-panel rounded-3xl p-6 sm:p-8 max-w-md w-full border-2 border-indigo-300/40 text-center animate-bounce-gentle">

      root.classList.remove('hidden');
      root.classList.add('flex');
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (!root) return;
      root.classList.add('hidden');
      root.classList.remove('flex');
      root.innerHTML = '';
    }

    /* --------------------------------------------------------------------------
     * 10. GUARANTEED SMOOTH REQUESTANIMATIONFRAME SPINNER & STORM LOGIC
     * -------------------------------------------------------------------------- */
    function spinSpaceCompass() {
      const hero = getActiveProfile();
      if (!hero || state.isSpinning) return;

      if (hero.stormActive) {
        sound.playStormZap();
        showToast('⛈️ Space Storm active! Clear it with 1 Solar Crystal first!', 'red');
        return;
      }

      if (hero.spinsRemaining <= 0) {
        promptCosmicDawnReset();
        return;
      }

      sound.init();
      sound.playSpinStart();

      state.isSpinning = true;
      state.highlightedWedgeIndex = -1;

      // Update button disabled state immediately without replacing the wheel DOM
      const spinBtn = document.getElementById('spin-compass-btn');
      if (spinBtn) {
        spinBtn.disabled = true;
        spinBtn.textContent = '🌀 Spinning Orbit...';
      }

      // Select winning wedge (protect Turn 1 from triggering a storm)
      let wedgeIndex = Math.floor(Math.random() * WHEEL_WEDGES.length);
      if ((hero.stats.totalSpins || 0) === 0 && WHEEL_WEDGES[wedgeIndex].type === 'storm') {
        wedgeIndex = 1; // Solar Crystal on very first spin
      }

      const sliceDeg = 360 / WHEEL_WEDGES.length; // 45°
      const targetCenter = wedgeIndex * sliceDeg + sliceDeg / 2;
      const desiredMod = (360 - targetCenter) % 360;
      const startAngle = state.wheelAngle;
      const currentMod = ((startAngle % 360) + 360) % 360;
      const delta = (desiredMod - currentMod + 360) % 360;
      const fullRotations = (4 + Math.floor(Math.random() * 3)) * 360; // 4 to 6 full spins (1440°–2160°)
      const totalRotation = fullRotations + delta;
      const targetAngle = startAngle + totalRotation;

      const duration = 2700; // ms
      const startTime = performance.now();
      let lastSpoke = Math.floor(startAngle / sliceDeg);

      function step(now) {
        try {
          const elapsed = now - startTime;
          const t = Math.min(1, Math.max(0, elapsed / duration));
          // Smooth cubic ease-out deceleration
          const easeOut = 1 - Math.pow(1 - t, 3);
          const currentAngle = startAngle + totalRotation * easeOut;
          state.wheelAngle = currentAngle;

          // Update rotor element directly via GPU transform
          const rotor = document.getElementById('compass-wheel-rotor');
          if (rotor) {
            rotor.style.transform = `rotate(${currentAngle.toFixed(2)}deg)`;
          }

          // Play tick & deflect pointer whenever a wedge spoke passes the top pointer
          const currentSpoke = Math.floor(currentAngle / sliceDeg);
          if (currentSpoke !== lastSpoke) {
            lastSpoke = currentSpoke;
            sound.playTick();
            const pointer = document.getElementById('compass-pointer');
            if (pointer) {
              pointer.style.transform = 'translateX(-50%) rotate(-18deg)';
              setTimeout(() => {
                if (pointer) pointer.style.transform = 'translateX(-50%) rotate(0deg)';
              }, 65);
            }
          }

          if (t < 1) {
            state.spinAnimFrameId = requestAnimationFrame(step);
          } else {
            // Finalize landing on exact targetAngle
            state.wheelAngle = targetAngle;
            state.highlightedWedgeIndex = wedgeIndex;
            state.spinAnimFrameId = null;
            applySpinOutcome(hero, WHEEL_WEDGES[wedgeIndex]);
            state.isSpinning = false;
            saveProfiles();
            render();

            if (hero.spinsRemaining === 0) {
              setTimeout(() => promptCosmicDawnReset(), 650);
            }
          }
        } catch (err) {
          console.error('Spinner animation error:', err);
          state.isSpinning = false;
          state.spinAnimFrameId = null;
          render();
        }
      }

      state.spinAnimFrameId = requestAnimationFrame(step);
    }

    function applySpinOutcome(hero, wedge) {
      hero.spinsRemaining = Math.max(0, hero.spinsRemaining - 1);
      hero.stats.totalSpins = (hero.stats.totalSpins || 0) + 1;

      if (wedge.type === 'commodity') {
        hero.inventory[wedge.key] = (hero.inventory[wedge.key] || 0) + wedge.amount;
        state.lastSpinResult = `Harvested +${wedge.amount} ${COMMODITIES[wedge.key].name} ${COMMODITIES[wedge.key].icon}!`;
        sound.playHarvest();
        showToast(state.lastSpinResult, 'emerald');
      } else if (wedge.type === 'coins') {
        hero.coins += wedge.amount;
        state.lastSpinResult = `Collected +${wedge.amount} Space Coins 🪙!`;
        sound.playHarvest();
        showToast(state.lastSpinResult, 'amber');
      } else if (wedge.type === 'stardust') {
        hero.stardust += wedge.amount;
        state.lastSpinResult = `Gathered +${wedge.amount} Star Stardust ✨!`;
        sound.playHarvest();
        showToast(state.lastSpinResult, 'purple');
      } else if (wedge.type === 'storm') {
        hero.stormActive = true;
        state.lastSpinResult = `⛈️ SPACE STORM HIT! Clear it with 1 Solar Crystal!`;
        sound.playStormZap();
        showToast(state.lastSpinResult, 'red');
      }
    }

    function clearStormWithSolarCrystal() {
      const hero = getActiveProfile();
      if (!hero || !hero.stormActive) return;

      if ((hero.inventory.solar || 0) < 1) {
        sound.playGentleOops();
        showToast('You need 1 ☀️ Solar Crystal! Swap in Trading Hub or win a Quest!', 'amber');
        return;

      hero.inventory.solar -= 1;
      hero.stormActive = false;
      hero.stats.stormsCleared = (hero.stats.stormsCleared || 0) + 1;
      state.lastSpinResult = '☀️ Solar Crystal beam cleared the Space Storm!';
      sound.playStormClear();
      showToast('☀️ Space Storm cleared! Skies are safe for spinning!', 'emerald');
      saveProfiles();
      render();
    }

    function canAffordStage(hero, costObj) {
      return Object.entries(costObj).every(([key, qty]) => (hero.inventory[key] || 0) >= qty);
    }

    function constructNextStage() {
      const hero = getActiveProfile();
      if (!hero) return;

      const levelData = BUILD_LEVELS.find(l => l.level === hero.level) || BUILD_LEVELS[BUILD_LEVELS.length - 1];
      const currentStageIdx = hero.buildStage;

      if (currentStageIdx >= levelData.stages.length) return;

      const stage = levelData.stages[currentStageIdx];
      if (!canAffordStage(hero, stage.cost)) {
        sound.playGentleOops();
        showToast('Gather more resources on the Space Compass or Trading Hub!', 'amber');
        return;
      }

      Object.entries(stage.cost).forEach(([key, qty]) => {
        hero.inventory[key] -= qty;
      });

      hero.buildStage += 1;

      if (hero.buildStage >= levelData.stages.length) {
        hero.coins += levelData.rewardCoins;
        hero.stardust += levelData.rewardStardust;
        sound.playWinFanfare();

        const isFinalLevel = hero.level >= BUILD_LEVELS.length;

          hero.level += 1;
          hero.buildStage = 0;

              <div class="bg-amber-500/20 border border-amber-400 rounded-2xl px-4 py-2 font-bold text-amber-300">

    /* --------------------------------------------------------------------------
     * 12. EDUCATIONAL MINIGAMES (SPACE MATH & HEBREW SPEECH SYNTHESIS)
     * -------------------------------------------------------------------------- */
    function generateMathProblem() {
      const hero = getActiveProfile();
      const lvl = hero ? hero.level : 1;
      let a, b, op, answer;

      if (lvl <= 2) {
        op = Math.random() < 0.6 ? '+' : '-';
        if (op === '+') {
          a = Math.floor(Math.random() * 14) + 3;
          b = Math.floor(Math.random() * 12) + 2;
          answer = a + b;
        } else {
          a = Math.floor(Math.random() * 15) + 8;
          b = Math.floor(Math.random() * (a - 1)) + 1;
          answer = a - b;
        }
      } else {
        op = Math.random() < 0.55 ? '+' : '-';
        if (op === '+') {
          a = Math.floor(Math.random() * 45) + 12;
          b = Math.floor(Math.random() * 38) + 8;
          answer = a + b;
        } else {
          a = Math.floor(Math.random() * 55) + 25;
          b = Math.floor(Math.random() * 24) + 6;
          answer = a - b;
        }
      }

      state.mathProblem = { a, b, op, answer };
      state.mathInput = '';
    }

    function pressMathKey(val) {
      if (val === 'clear') {
        state.mathInput = '';
        sound.playClick();
      } else if (val === 'back') {
        state.mathInput = state.mathInput.slice(0, -1);
        sound.playClick();
      } else if (val === 'submit') {
        checkMathAnswer();
        return;
      } else if (state.mathInput.length < 3) {
        state.mathInput += String(val);
        sound.playClick();
      }
      render();
    }

    function checkMathAnswer() {
      const hero = getActiveProfile();
      if (!hero || !state.mathProblem) return;

      const userVal = parseInt(state.mathInput, 10);
      if (isNaN(userVal)) {
        showToast('Enter your answer using the number pad!', 'amber');
        return;
      }

      if (userVal === state.mathProblem.answer) {
        hero.stardust += 2;
        hero.coins += 12;
        hero.stats.mathSolved = (hero.stats.mathSolved || 0) + 1;

        let bonusMsg = '';
        if (hero.stormActive) {
          hero.inventory.solar = (hero.inventory.solar || 0) + 1;
          bonusMsg = '+1 ☀️ Solar Crystal (Storm Buster!) +2 ✨ Stardust & +12 🪙!';
        } else {
          const keys = ['iron', 'titanium', 'solar', 'fuel'];
          const pick = keys[Math.floor(Math.random() * keys.length)];
          hero.inventory[pick] += 1;
          bonusMsg = `+2 ✨ Stardust, +12 🪙 Coins & +1 ${COMMODITIES[pick].short} ${COMMODITIES[pick].icon}!`;
        }

        sound.playSuccess();
        showToast(`🚀 Correct! ${bonusMsg}`, 'emerald');
        generateMathProblem();
        saveProfiles();
        render();
      } else {
        sound.playGentleOops();
        showToast(`Not quite! Try calculating ${state.mathProblem.a} ${state.mathProblem.op} ${state.mathProblem.b} again!`, 'red');
        state.mathInput = '';
        render();
      }
    }

    function buyOrEquipStoreItem(itemId) {
      const hero = getActiveProfile();
      if (!hero) return;
      const item = STORE_ITEMS.find(i => i.id === itemId);
      if (!item) return;

      const isUnlocked = hero.unlockedItems.includes(item.id);

      if (!isUnlocked) {
        if (hero.coins < item.price) {
          sound.playGentleOops();
          showToast(`You need ${item.price - hero.coins} more Space Coins 🪙!`, 'amber');
          return;

        hero.coins -= item.price;
        hero.unlockedItems.push(item.id);
        hero.equipped[item.category] = item.id;
        state.previewEquipped = null;
        sound.playPurchase();
        showToast(`🎉 Unlocked & Equipped ${item.name}!`, 'emerald');
      } else {
        if (hero.equipped[item.category] === item.id && !item.starter) {

          hero.equipped[item.category] = starter.id;

    /* --------------------------------------------------------------------------
     * 15. 20-SEGMENT SUNDOWN CLOCK GAUGE & MAIN GAMEPLAY HEADER
     * -------------------------------------------------------------------------- */
    function renderSundownArcGauge(spinsRemaining) {
      // 20-segment circular arc gauge around a central sun/moon icon
      const segments = [];
      const total = MAX_SUNDOWN_SPINS; // 20
      const cx = 42, cy = 42, r = 33;
      const stepDeg = 360 / total; // 18° per segment

      for (let i = 0; i < total; i++) {
        const active = i < spinsRemaining;
        const a1 = ((i * stepDeg + 2) - 90) * (Math.PI / 180);
        const a2 = (((i + 1) * stepDeg - 2) - 90) * (Math.PI / 180);
        const x1 = cx + r * Math.cos(a1);
        const y1 = cy + r * Math.sin(a1);
        const x2 = cx + r * Math.cos(a2);
        const y2 = cy + r * Math.sin(a2);

        let strokeColor = '#1e293b';
        if (active) {
          if (spinsRemaining >= 11) strokeColor = '#38bdf8';
          else if (spinsRemaining >= 5) strokeColor = '#fb923c';
          else strokeColor = '#c084fc';
        }

        segments.push(`
          <path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${r} ${r} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}"
                fill="none" stroke="${strokeColor}" stroke-width="6.5" stroke-linecap="round" />
        `);
      }

      return `
        <svg viewBox="0 0 84 84" class="w-16 h-16 sm:w-20 sm:h-20 shrink-0" aria-label="${spinsRemaining} of 20 Sundowns remaining">
          ${segments.join('')}
          <circle cx="42" cy="42" r="22" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
          <text x="42" y="40" text-anchor="middle" fill="#fde047" font-size="14" font-weight="bold">${spinsRemaining}</text>
          <text x="42" y="52" text-anchor="middle" fill="#94a3b8" font-size="8.5" font-weight="bold">/ 20</text>
        </svg>
      `;
    }

              <div class="px-3 py-1.5 rounded-xl bg-amber-500/20 border border-amber-400/50 text-amber-300 font-bold text-sm flex items-center gap-1.5" title="Space Coins">
                🪙 <span>${hero.coins}</span>
              </div>
              <div class="px-3 py-1.5 rounded-xl bg-pink-500/20 border border-pink-400/50 text-pink-300 font-bold text-sm flex items-center gap-1.5" title="Star Stardust">
                ✨ <span>${hero.stardust}</span>
              </div>
              ${Object.values(COMMODITIES).map(c => `
                <div class="px-2.5 py-1.5 rounded-xl ${c.bg} border ${c.border}/50 ${c.color} font-bold text-xs sm:text-sm flex items-center gap-1" title="${c.name}">
                  <span>${c.icon}</span>
                  <span>${hero.inventory[c.id] || 0}</span>
                </div>
              `).join('')}

              <button onclick="sound.toggleMusic(); render();" title="Toggle Space Music" class="btn-space px-3 py-1.5 rounded-xl bg-indigo-600/80 border border-indigo-300/40 text-sm font-bold">
                ${sound.musicOn ? '🎵' : '🔇'}
              </button>
            </div>
          </header>

          <!-- 20-TURN SUNDOWN CLOCK BANNER WITH 20-SEGMENT GAUGE -->
          <section class="space-panel rounded-2xl px-4 py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              ${renderSundownArcGauge(hero.spinsRemaining)}
              <div>
                <div class="flex flex-wrap items-center gap-2">
                  <span class="font-bold text-base sm:text-lg ${timePhase.color}">${timePhase.label}</span>
                  <span class="text-xs px-2.5 py-0.5 rounded-full bg-white/10 text-amber-200 font-bold">
                    ${hero.spinsRemaining} / 20 Sundowns
                  </span>
                </div>
                <p class="text-xs sm:text-sm text-indigo-200">
                  <strong>${hero.spinsRemaining}</strong> turns left before Sundown (${spinsUsed} of 20 used)
                </p>
              </div>
            </div>

            <!-- 20-Segment Linear Progress Bar -->
            <div class="flex-1 max-w-md w-full">
              <div class="grid gap-1 mb-1" style="grid-template-columns: repeat(20, minmax(0, 1fr));">
                ${Array.from({ length: MAX_SUNDOWN_SPINS }).map((_, idx) => {
                  const active = idx < hero.spinsRemaining;
                  return `<div class="h-3 rounded-sm transition-all ${active ? `bg-gradient-to-t ${timePhase.bar}` : 'bg-slate-800 border border-slate-700'}"></div>`;
                }).join('')}
              </div>
              <div class="flex justify-between text-[11px] font-semibold text-indigo-300">
                <span>Cosmic Dawn (20)</span>
                <span>Day ${hero.dayCount || 1}</span>
                <span>Sundown (0)</span>
              </div>
            </div>
          </section>

          <!-- NAVIGATION TABS -->
          <nav class="grid grid-cols-4 gap-2 sm:gap-3">
            ${[
              { id: 'build', label: 'Build & Spin', icon: '🚀' },
              { id: 'trade', label: 'Trading Hub', icon: '⚖️' },
              { id: 'minigames', label: 'Quests', icon: '🧠' },
              { id: 'store', label: 'Space Store', icon: '👕' }
            ].map(tab => {
              const isActive = state.activeTab === tab.id;
              return `
                <button
                  onclick="switchTab('${tab.id}')"
                  class="btn-space py-3 px-2 sm:px-4 rounded-2xl font-bold text-sm sm:text-base flex items-center justify-center gap-1.5 border-2 ${
                    isActive
                      ? 'bg-gradient-to-r from-amber-400 to-orange-400 text-slate-950 border-yellow-200'
                      : 'bg-slate-900/80 text-indigo-100 border-indigo-400/30 hover:border-indigo-300'
                  }">
                  <span>${tab.icon}</span>
                  <span>${tab.label}</span>
                </button>
              `;
            }).join('')}
          </nav>

          <!-- ACTIVE TAB WORKSPACE -->
          <main class="flex-1">
            ${state.activeTab === 'build' ? renderBuildAndSpinTab(hero) : ''}
            ${state.activeTab === 'trade' ? renderTradingHubTab(hero) : ''}
            ${state.activeTab === 'minigames' ? renderMinigamesTab(hero) : ''}
            ${state.activeTab === 'store' ? renderSpaceStoreTab(hero) : ''}
          </main>
        </div>
      `;
    }

    function switchTab(tabId) {
      if (state.isSpinning) return;
      sound.playClick();
      state.activeTab = tabId;
      if (tabId === 'minigames') {
        if (!state.mathProblem) generateMathProblem();
        if (!state.hebrewQuestion) generateHebrewQuestion(state.activeMinigame === 'hebrew');
      }
      render();
    }

    /* --------------------------------------------------------------------------
     * 16. TAB 1: ICONS-ONLY SPACE COMPASS SPINNER & SEQUENTIAL BUILD TRACK
     * -------------------------------------------------------------------------- */
    function renderBuildAndSpinTab(hero) {
      const levelData = BUILD_LEVELS.find(l => l.level === hero.level) || BUILD_LEVELS[BUILD_LEVELS.length - 1];
      const currentStage = levelData.stages[hero.buildStage];
      const solarCount = hero.inventory.solar || 0;

      // Build 8-Wedge SVG Wheel with ICONS ONLY (ZERO text/numbers inside wedges!)
      const sliceDeg = 360 / WHEEL_WEDGES.length; // 45°
      const wheelSlicesSVG = WHEEL_WEDGES.map((w, i) => {
        const startAngle = (i * sliceDeg - 90) * (Math.PI / 180);
        const endAngle = ((i + 1) * sliceDeg - 90) * (Math.PI / 180);
        const x1 = 150 + 138 * Math.cos(startAngle);
        const y1 = 150 + 138 * Math.sin(startAngle);
        const x2 = 150 + 138 * Math.cos(endAngle);
        const y2 = 150 + 138 * Math.sin(endAngle);

        const midAngleDeg = i * sliceDeg + sliceDeg / 2;
        const isWinner = !state.isSpinning && state.highlightedWedgeIndex === i;

        return `
          <g>
            <path
              d="M150,150 L${x1.toFixed(1)},${y1.toFixed(1)} A138,138 0 0,1 ${x2.toFixed(1)},${y2.toFixed(1)} Z"
              fill="${w.bg}"
              stroke="${isWinner ? '#fde047' : '#0f172a'}"
              stroke-width="${isWinner ? '4.5' : '2.5'}"
            />
            ${isWinner ? `
              <path
                d="M150,150 L${x1.toFixed(1)},${y1.toFixed(1)} A138,138 0 0,1 ${x2.toFixed(1)},${y2.toFixed(1)} Z"
                fill="rgba(253, 224, 71, 0.24)"
              />
            ` : ''}
            <g transform="translate(150,150) rotate(${midAngleDeg}) translate(0,-88)">
              ${renderWedgeIconSVG(w.iconType)}
            </g>
          </g>
        `;
      }).join('');

      // Outer rim decorative gold studs (zero text!)
      const rimStudsSVG = Array.from({ length: 16 }).map((_, idx) => {
        const deg = idx * 22.5;
        return `<circle cx="150" cy="7" r="3" fill="#fde047" transform="rotate(${deg} 150 150)"/>`;
      }).join('');

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <!-- LEFT COLUMN: ICONS-ONLY SPACE COMPASS SPINNER & SPACE STORM -->
          <div class="lg:col-span-6 space-panel rounded-3xl p-5 sm:p-6 flex flex-col items-center justify-between relative overflow-hidden">
            <div class="w-full flex items-center justify-between mb-2">
              <h2 class="text-xl sm:text-2xl font-bold text-cyan-300">🧭 Space Compass</h2>
              <span class="text-xs font-bold px-3 py-1 rounded-full bg-indigo-500/30 border border-indigo-300/30 text-indigo-100">
                ${hero.spinsRemaining} / 20 Left
              </span>
            </div>

            ${hero.stormActive ? `
              <!-- SPACE STORM OBSTACLE BANNER (CLEARED BY 1 SOLAR CRYSTAL) -->
              <div class="w-full my-2 p-4 rounded-2xl bg-gradient-to-br from-rose-900/95 via-purple-950/95 to-slate-950 border-2 border-rose-400 shadow-2xl text-center animate-zap">
                <div class="text-4xl mb-1">⛈️⚡🌪️</div>
                <h3 class="text-xl font-bold text-rose-200">SPACE STORM BLOCKING ORBIT!</h3>
                <p class="text-xs sm:text-sm text-rose-100 mt-1 mb-3">
                  Cosmic lightning prevents harvesting until you clear the storm with <strong>1 Solar Crystal</strong>!
                </p>
                <button
                  onclick="clearStormWithSolarCrystal()"
                  class="btn-space w-full py-3.5 px-4 rounded-2xl font-bold text-base sm:text-lg flex items-center justify-center gap-2 ${
                    solarCount >= 1
                      ? 'bg-gradient-to-r from-amber-400 to-yellow-300 text-slate-950'
                      : 'bg-slate-700 text-slate-300'
                  }">
                  ⚡ Clear Storm (1 ☀️ Solar Crystal)
                </button>
                ${solarCount < 1 ? `
                  <div class="mt-3 p-2.5 rounded-xl bg-slate-950/80 border border-amber-400/40 text-xs text-amber-200">
                    Need a Solar Crystal? Get one right now via:
                    <div class="flex gap-2 mt-2">
                      <button onclick="switchTab('trade')" class="flex-1 py-2 px-2 rounded-lg bg-indigo-600 text-white font-bold">
                        ⚖️ 2-for-1 Trade
                      </button>
                      <button onclick="switchTab('minigames')" class="flex-1 py-2 px-2 rounded-lg bg-emerald-600 text-white font-bold">
                        🧠 Win in Quests
                      </button>
                    </div>
                  </div>
                ` : ''}
              </div>
            ` : ''}

            <!-- Spinner Wheel Assembly (Tap either the wheel OR the central/bottom SPIN button!) -->
            <div class="relative my-3 flex items-center justify-center">
              <!-- Top Pointer Arrow (pointer-events: none so clicks always pass through) -->
              <div id="compass-pointer" class="absolute -top-4 left-1/2 -translate-x-1/2 z-20 drop-shadow-xl">
                <svg viewBox="0 0 44 44" class="w-10 h-10">
                  <polygon points="22,40 6,8 38,8" fill="#facc15" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
                  <circle cx="22" cy="14" r="4" fill="#ef4444"/>
                </svg>
              </div>

              <!-- Rotating Wheel Container -->
              <div
                id="compass-wheel-rotor"
                onclick="spinSpaceCompass()"
                role="button"
                tabindex="0"
                aria-label="Spin the Space Compass Wheel"
                style="transform: rotate(${state.wheelAngle}deg);"
                class="w-64 h-64 sm:w-72 sm:h-72 rounded-full shadow-2xl cursor-pointer select-none">
                <svg viewBox="0 0 300 300" class="w-full h-full pointer-events-none">
                  <circle cx="150" cy="150" r="147" fill="#0f172a" stroke="#fbbf24" stroke-width="5"/>
                  ${rimStudsSVG}
                  ${wheelSlicesSVG}
                  <circle cx="150" cy="150" r="34" fill="#0f172a" stroke="#fbbf24" stroke-width="3.5"/>
                </svg>
              </div>

              <!-- Central Tactile SPIN Hub Button -->
              <button
                type="button"
                onclick="spinSpaceCompass()"
                ${state.isSpinning || hero.stormActive ? 'disabled' : ''}
                class="btn-space absolute z-10 w-16 h-16 rounded-full bg-gradient-to-b from-amber-300 to-orange-500 border-4 border-slate-950 text-slate-950 font-extrabold text-sm tracking-wider flex items-center justify-center shadow-xl">
                SPIN
              </button>
            </div>

            <!-- Compact Icon Legend Outside Below the Wheel -->
            <div class="w-full grid grid-cols-4 sm:grid-cols-7 gap-1.5 mb-3 text-[11px] font-bold text-indigo-100">
              <div class="flex items-center justify-center gap-1 bg-slate-900/70 py-1 px-1.5 rounded-lg border border-white/10">🪨<span>+2</span></div>
              <div class="flex items-center justify-center gap-1 bg-slate-900/70 py-1 px-1.5 rounded-lg border border-white/10">🔩<span>+1</span></div>
              <div class="flex items-center justify-center gap-1 bg-slate-900/70 py-1 px-1.5 rounded-lg border border-white/10">☀️<span>+1</span></div>
              <div class="flex items-center justify-center gap-1 bg-slate-900/70 py-1 px-1.5 rounded-lg border border-white/10">🧪<span>+1</span></div>
              <div class="flex items-center justify-center gap-1 bg-slate-900/70 py-1 px-1.5 rounded-lg border border-white/10">✨<span>+2</span></div>
              <div class="flex items-center justify-center gap-1 bg-slate-900/70 py-1 px-1.5 rounded-lg border border-white/10">🪙<span>+15</span></div>
              <div class="col-span-2 sm:col-span-1 flex items-center justify-center gap-1 bg-rose-950/70 py-1 px-1.5 rounded-lg border border-rose-400/30 text-rose-200">⛈️<span>Storm</span></div>
            </div>

            <!-- Last Spin Harvest Banner -->
            <div class="w-full min-h-[40px] flex items-center justify-center text-center px-3 py-2 rounded-xl bg-slate-900/80 border border-indigo-400/25 text-xs sm:text-sm font-semibold text-amber-200 mb-3">
              ${state.lastSpinResult || 'Tap the wheel or SPIN button to harvest cosmic resources!'}
            </div>

            <!-- Primary Spin Trigger Button -->
            <button
              id="spin-compass-btn"
              type="button"
              onclick="spinSpaceCompass()"
              ${state.isSpinning || hero.stormActive ? 'disabled' : ''}
              class="btn-space w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500 text-slate-950 font-bold text-xl tracking-wide">
              ${state.isSpinning
                ? '🌀 Spinning Orbit...'
                : hero.spinsRemaining <= 0
                  ? '🌅 Sundown Reached — Start Cosmic Dawn!'
                  : '🧭 SPIN COMPASS (-1 Turn)'}
            </button>
          </div>

          <!-- RIGHT COLUMN: SEQUENTIAL BUILDING TRACK (LEVELS 1–5) -->
          <div class="lg:col-span-6 space-panel rounded-3xl p-5 sm:p-6 flex flex-col justify-between">
            <div>
              <!-- Level Progress Stepper (1 to 5) -->
              <div class="flex items-center justify-between gap-1.5 mb-4">
                ${BUILD_LEVELS.map(lvl => {
                  const done = hero.level > lvl.level || (hero.level === lvl.level && hero.masterCompleted);
                  const current = hero.level === lvl.level && !hero.masterCompleted;
                  return `
                    <div class="flex-1 text-center">
                      <div class="h-2.5 rounded-full mb-1 ${
                        done ? 'bg-emerald-400' : current ? 'bg-amber-400 animate-pulse' : 'bg-slate-700'
                      }"></div>
                      <span class="text-[11px] font-bold ${
                        done ? 'text-emerald-300' : current ? 'text-amber-300' : 'text-slate-400'
                      }">Lvl ${lvl.level}</span>
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="flex items-start justify-between gap-2 mb-2">
                <div>
                  <span class="text-xs font-bold uppercase tracking-wider text-amber-300">${levelData.planet}</span>
                  <h2 class="text-2xl sm:text-3xl font-bold text-white">
                    Level ${levelData.level}: ${levelData.name}
                  </h2>
                </div>
                <div class="text-right text-xs font-bold text-amber-300 bg-amber-500/15 border border-amber-400/30 px-3 py-1.5 rounded-xl">
                  Reward: +${levelData.rewardCoins} 🪙 & +${levelData.rewardStardust} ✨
                </div>
              </div>

              <p class="text-xs sm:text-sm text-indigo-200 mb-3">${levelData.description}</p>

              <div class="mb-4">
                ${renderStructureSVG(levelData.level, hero.masterCompleted ? 3 : hero.buildStage)}
              </div>

              <div class="space-y-2 mb-4">
                ${levelData.stages.map((st, idx) => {
                  const built = hero.masterCompleted || hero.buildStage > idx;
                  const active = !hero.masterCompleted && hero.buildStage === idx;
                  return `
                    <div class="flex items-center justify-between px-3.5 py-2.5 rounded-xl border ${
                      built
                        ? 'bg-emerald-950/60 border-emerald-400/50 text-emerald-200'
                        : active
                          ? 'bg-indigo-900/70 border-amber-400 text-white'
                          : 'bg-slate-900/50 border-slate-700 text-slate-400'
                    }">
                      <div class="flex items-center gap-2 font-bold text-sm">
                        <span>${built ? '✅' : active ? '🔨' : '🔒'}</span>
                        <span>Stage ${idx + 1}: ${st.name}</span>
                      </div>
                      <div class="flex items-center gap-1.5 text-xs font-bold">
                        ${Object.entries(st.cost).map(([k, qty]) => {
                          const have = hero.inventory[k] || 0;
                          const enough = built || have >= qty;
                          return `
                            <span class="px-2 py-0.5 rounded-lg ${enough ? 'bg-slate-800 text-cyan-200' : 'bg-rose-950 text-rose-300 border border-rose-500/40'}">
                              ${COMMODITIES[k].icon} ${built ? qty : `${have}/${qty}`}
                            </span>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            ${hero.masterCompleted ? `
              <button onclick="replayMasterSandbox()" class="btn-space w-full py-4 rounded-2xl bg-gradient-to-r from-amber-400 to-pink-500 text-slate-950 font-bold text-lg">
                🔄 Start New Galactic Tour (Keep All Gear & Coins!)
              </button>
            ` : `
              <button
                onclick="constructNextStage()"
                ${!canAffordStage(hero, currentStage.cost) ? 'disabled' : ''}
                class="btn-space w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 font-bold text-lg sm:text-xl">
                🔨 Build ${currentStage.name}
              </button>
            `}
          </div>
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
     * 17. TAB 2: COMMODITY TRADING HUB
     * -------------------------------------------------------------------------- */
    function renderTradingHubTab(hero) {
      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <div class="space-panel rounded-3xl p-6">
            <h2 class="text-2xl font-bold text-cyan-300 mb-1">⚖️ 2-for-1 Commodity Exchange</h2>
            <p class="text-sm text-indigo-200 mb-5">
              Trade any <strong>2 matching resources</strong> for <strong>1 resource</strong> of your choice — great for crafting Solar Crystals!
            </p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
              <div class="bg-slate-900/80 p-4 rounded-2xl border border-indigo-400/30">
                <label class="block text-xs font-bold uppercase text-rose-300 mb-2">You Give (2 Units)</label>
                <div class="space-y-2">
                  ${Object.values(COMMODITIES).map(c => {
                    const count = hero.inventory[c.id] || 0;
                    const selected = state.tradeGive === c.id;
                    return `
                      <button
                        onclick="state.tradeGive='${c.id}'; sound.playClick(); render();"
                        class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl border-2 font-bold text-sm transition ${
                          selected ? 'border-amber-400 bg-indigo-900/90 text-white' : 'border-slate-700 bg-slate-800/70 text-slate-300'
                        }">
                        <span>${c.icon} ${c.name}</span>
                        <span class="px-2 py-0.5 rounded-md ${count >= 2 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-slate-700 text-slate-400'}">
                          Have: ${count}
                        </span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <div class="bg-slate-900/80 p-4 rounded-2xl border border-indigo-400/30">
                <label class="block text-xs font-bold uppercase text-emerald-300 mb-2">You Receive (+1 Unit)</label>
                <div class="space-y-2">
                  ${Object.values(COMMODITIES).map(c => {
                    const selected = state.tradeReceive === c.id;
                    return `
                      <button
                        onclick="state.tradeReceive='${c.id}'; sound.playClick(); render();"
                        class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl border-2 font-bold text-sm transition ${
                          selected ? 'border-emerald-400 bg-emerald-950/80 text-white' : 'border-slate-700 bg-slate-800/70 text-slate-300'
                        }">
                        <span>${c.icon} ${c.name}</span>
                        <span class="text-xs text-emerald-300">+1</span>
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>

            <button
              onclick="executeTwoForOneTrade()"
              class="btn-space w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 font-bold text-lg">
              🔄 Trade 2 ${COMMODITIES[state.tradeGive].short} → 1 ${COMMODITIES[state.tradeReceive].short}
            </button>
          </div>

          <div class="space-panel rounded-3xl p-6 flex flex-col justify-between">
            <div>
              <h2 class="text-2xl font-bold text-pink-300 mb-1">✨ Star Stardust Alchemy (3-for-1)</h2>
              <p class="text-sm text-indigo-200 mb-5">
                Transform <strong>3 Star Stardust</strong> (earned in Space Math & Hebrew Quests) into any resource! You currently have <strong>${hero.stardust} ✨</strong>.
              </p>

              <div class="grid grid-cols-2 gap-3 mb-6">
                ${Object.values(COMMODITIES).map(c => `
                  <button
                    onclick="executeStardustTrade('${c.id}')"
                    ${hero.stardust < 3 ? 'disabled' : ''}
                    class="btn-space p-4 rounded-2xl bg-slate-900/90 border-2 border-pink-400/40 hover:border-pink-300 text-left flex flex-col justify-between">
                    <div class="text-2xl mb-1">${c.icon}</div>
                    <div class="font-bold text-white text-base">+1 ${c.name}</div>
                    <div class="text-xs font-semibold text-pink-300 mt-1">Cost: 3 ✨ Stardust</div>
                  </button>
                `).join('')}
              </div>
            </div>

            <div class="p-4 rounded-2xl bg-amber-500/15 border border-amber-400/40">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <h3 class="font-bold text-amber-300 text-base">☀️ Emergency Solar Crystal</h3>
                  <p class="text-xs text-amber-100">Need a Solar Crystal fast to clear a Space Storm?</p>
                </div>
                <button
                  onclick="executeEmergencySolarCoinTrade()"
                  ${hero.coins < 25 ? 'disabled' : ''}
                  class="btn-space px-4 py-2.5 rounded-xl bg-amber-400 text-slate-950 font-bold text-sm shrink-0">
                  Buy 1 ☀️ (25 🪙)
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
     * 18. TAB 3: EDUCATIONAL MINIGAMES (SPACE MATH & HEBREW SPEECH SYNTHESIS)
     * -------------------------------------------------------------------------- */
    function renderMinigamesTab(hero) {
      if (!state.mathProblem) generateMathProblem();
      if (!state.hebrewQuestion) generateHebrewQuestion(false);

      return `
        <div class="space-panel rounded-3xl p-5 sm:p-6">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div class="flex gap-2">
              <button
                onclick="state.activeMinigame='math'; sound.playClick(); render();"
                class="btn-space px-5 py-2.5 rounded-2xl font-bold text-sm sm:text-base ${
                  state.activeMinigame === 'math'
                    ? 'bg-cyan-400 text-slate-950'
                    : 'bg-slate-800 text-indigo-200'
                }">
                🔢 Space Math
              </button>
              <button
                onclick="state.activeMinigame='hebrew'; sound.playClick(); generateHebrewQuestion(true); render();"
                class="btn-space px-5 py-2.5 rounded-2xl font-bold text-sm sm:text-base ${
                  state.activeMinigame === 'hebrew'
                    ? 'bg-purple-400 text-slate-950'
                    : 'bg-slate-800 text-indigo-200'
                }">
                🕎 Hebrew Sight Words
              </button>
            </div>

            <div class="text-xs font-bold px-3 py-1.5 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-200">
              ${hero.stormActive
                ? '⚡ Storm Active: Win any round for +1 ☀️ Solar Crystal!'
                : '🎁 Win Rounds for ✨ Stardust, 🪙 Coins & Resources!'}
            </div>
          </div>

          ${state.activeMinigame === 'math' ? renderSpaceMathGame() : renderHebrewQuizGame()}
        </div>
      `;
    }

    function renderSpaceMathGame() {
      const p = state.mathProblem;
      return `
        <div class="max-w-md mx-auto text-center">
          <p class="text-sm text-indigo-200 mb-3">Solve the cosmic navigation equation!</p>

          <div class="bg-slate-950/90 border-2 border-cyan-400/50 rounded-3xl p-6 mb-4">
            <div class="text-4xl sm:text-5xl font-bold text-white tracking-wider mb-3">
              ${p.a} <span class="text-amber-400">${p.op}</span> ${p.b} = <span class="text-cyan-300">${state.mathInput || '?'}</span>
            </div>
            <div class="text-xs text-indigo-300">Tap the keypad below or type on your keyboard</div>
          </div>

          <div class="grid grid-cols-3 gap-2.5 mb-3">
            ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => `
              <button
                onclick="pressMathKey(${num})"
                class="btn-space py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-indigo-400/30 text-2xl font-bold text-white">
                ${num}
              </button>
            `).join('')}
            <button
              onclick="pressMathKey('clear')"
              class="btn-space py-3.5 rounded-2xl bg-rose-600/80 text-base font-bold text-white">
              Clear
            </button>
            <button
              onclick="pressMathKey(0)"
              class="btn-space py-3.5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-indigo-400/30 text-2xl font-bold text-white">
              0
            </button>
            <button
              onclick="pressMathKey('back')"
              class="btn-space py-3.5 rounded-2xl bg-amber-600/80 text-lg font-bold text-white">
              ⌫
            </button>
          </div>

          <button
            onclick="pressMathKey('submit')"
            class="btn-space w-full py-4 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 font-bold text-xl">
            🚀 Launch Answer!
          </button>
        </div>
      `;
    }

    function renderHebrewQuizGame() {
      const q = state.hebrewQuestion;
      return `
        <div class="max-w-xl mx-auto text-center">
          <p class="text-sm text-indigo-200 mb-3">
            Listen to the Hebrew word and tap the matching Hebrew card!
          </p>

          <div class="bg-slate-950/90 border-2 border-purple-400/50 rounded-3xl p-5 mb-5">
            <div class="text-4xl mb-2">${q.target.emoji}</div>
            <div class="text-lg font-bold text-amber-300 mb-1">
              Meaning: "${q.target.english}"
            </div>
            ${state.hebrewShowHint ? `
              <div class="text-sm font-semibold text-cyan-300 mb-4">
                Pronunciation: <strong>${q.target.translit}</strong>
              </div>
            ` : `<div class="mb-4"></div>`}

            <div class="flex flex-wrap justify-center gap-3">
              <button
                onclick="speakHebrewWord(state.hebrewQuestion.target, false)"
                class="btn-space px-5 py-3 rounded-2xl bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-bold text-base flex items-center gap-2">
                🔊 Listen Again
              </button>
              <button
                onclick="speakHebrewWord(state.hebrewQuestion.target, true)"
                class="btn-space px-5 py-3 rounded-2xl bg-slate-800 border border-purple-300/40 text-purple-200 font-bold text-base flex items-center gap-2">
                🐢 Slow Speed
              </button>
              <button
                onclick="state.hebrewShowHint = !state.hebrewShowHint; sound.playClick(); render();"
                class="btn-space px-4 py-3 rounded-2xl bg-slate-800 border border-slate-600 text-xs font-bold text-slate-300">
                ${state.hebrewShowHint ? '🙈 Hide Hint' : '💡 Show Hint'}
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3.5">
            ${q.choices.map(choice => `
              <button
                onclick="selectHebrewChoice('${choice.hebrew}')"
                dir="rtl"
                class="btn-space py-5 px-4 rounded-2xl bg-slate-900/90 hover:bg-indigo-900/80 border-2 border-indigo-400/40 hover:border-amber-300 text-3xl sm:text-4xl font-bold text-white tracking-wide">
                ${choice.hebrew}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
     * 19. TAB 4: SPACE STORE (20 UNLOCKABLE ITEMS & LIVE HERO PREVIEW)
     * -------------------------------------------------------------------------- */
    function renderSpaceStoreTab(hero) {
      const effectiveEquipped = state.previewEquipped || hero.equipped;
      const isPreviewing = Boolean(state.previewEquipped);
      const itemsInCategory = STORE_ITEMS.filter(i => i.category === state.storeCategory);
      const totalUnlockedCount = hero.unlockedItems.filter(id => {
        const it = STORE_ITEMS.find(s => s.id === id);
        return it && !it.starter;
      }).length;

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <div class="lg:col-span-4 space-panel rounded-3xl p-6 flex flex-col items-center justify-between text-center">
            <div class="w-full flex items-center justify-between">
              <span class="text-xs font-bold uppercase tracking-wider text-cyan-300">Live Dressing Room</span>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300">
                ${totalUnlockedCount} / 20 Unlocked
              </span>
            </div>

            <div class="my-4 p-4 rounded-3xl bg-gradient-to-b from-indigo-900/50 to-slate-950/80 border-2 border-indigo-400/30 w-full flex flex-col items-center">
              <div class="animate-float-slow">
                ${renderBoySVG(hero, { sizeClass: 'w-44 h-52', equippedOverride: effectiveEquipped })}
              </div>
              <div class="mt-2 font-bold text-lg text-white">${escapeHTML(hero.name)}</div>
              ${isPreviewing ? `
                <div class="mt-2 flex items-center gap-2">
                  <span class="text-xs px-2.5 py-1 rounded-full bg-amber-400/20 text-amber-300 font-bold">
                    👀 Previewing Look
                  </span>
                  <button onclick="resetStorePreview()" class="text-xs underline text-indigo-300 hover:text-white">
                    Reset
                  </button>
                </div>
              ` : `
                <div class="text-xs text-indigo-300 mt-1">Click any item to try it on!</div>
              `}
            </div>

            <div class="w-full text-xs text-indigo-200 bg-slate-900/70 rounded-2xl p-3 border border-indigo-400/20">
              ✨ <strong>Rare & Legendary</strong> gear surrounds your hero with a glowing cosmic aura!
            </div>
          </div>

          <div class="lg:col-span-8 space-panel rounded-3xl p-5 sm:p-6">
            <div class="grid grid-cols-3 gap-2.5 mb-5">
              ${[
                { id: 'suit', label: 'Space Suits', icon: '🧑‍🚀' },
                { id: 'helmet', label: 'Helmets', icon: '🪖' },
                { id: 'boots', label: 'Space Boots', icon: '👢' }
              ].map(cat => {
                const active = state.storeCategory === cat.id;
                return `
                  <button
                    onclick="state.storeCategory='${cat.id}'; sound.playClick(); render();"
                    class="btn-space py-3 px-3 rounded-2xl font-bold text-sm sm:text-base flex items-center justify-center gap-1.5 border-2 ${
                      active
                        ? 'bg-gradient-to-r from-cyan-400 to-blue-500 text-slate-950 border-cyan-200'
                        : 'bg-slate-900/80 text-indigo-100 border-indigo-400/30'
                    }">
                    <span>${cat.icon}</span>
                    <span>${cat.label}</span>
                  </button>
                `;
              }).join('')}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 max-h-[520px] overflow-y-auto pr-1">
              ${itemsInCategory.map(item => {
                const unlocked = hero.unlockedItems.includes(item.id);
                const equipped = hero.equipped[item.category] === item.id;
                const previewed = effectiveEquipped[item.category] === item.id;

                return `
                  <div
                    onclick="previewStoreItem('${item.id}')"
                    class="cursor-pointer rounded-2xl p-4 border-2 transition flex flex-col justify-between ${
                      equipped
                        ? 'bg-emerald-950/50 border-emerald-400'
                        : previewed
                          ? 'bg-indigo-900/60 border-amber-400'
                          : 'bg-slate-900/80 border-indigo-400/25 hover:border-indigo-300'
                    }">
                    <div>
                      <div class="flex items-start justify-between gap-2 mb-1">
                        <h3 class="font-bold text-base text-white">${item.name}</h3>
                        ${item.rare ? `
                          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase bg-fuchsia-500/30 border border-fuchsia-300 text-fuchsia-200 shrink-0">
                            ✨ Rare Aura
                          </span>
                        ` : ''}
                      </div>
                      <p class="text-xs text-indigo-200 mb-3">${item.desc}</p>
                    </div>

                    <div class="flex items-center justify-between gap-2 pt-2 border-t border-white/10">
                      <span class="text-sm font-bold ${unlocked ? 'text-emerald-300' : 'text-amber-300'}">
                        ${unlocked ? (item.starter ? 'Starter Gear' : 'Owned ✔') : `🪙 ${item.price} Coins`}
                      </span>

                      <button
                        type="button"
                        onclick="event.stopPropagation(); buyOrEquipStoreItem('${item.id}');"
                        class="btn-space px-4 py-2 rounded-xl font-bold text-xs sm:text-sm ${
                          equipped
                            ? (item.starter ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-amber-200')
                            : unlocked
                              ? 'bg-indigo-500 text-white'
                              : hero.coins >= item.price
                                ? 'bg-amber-400 text-slate-950'
                                : 'bg-slate-800 text-slate-400'
                        }">
                        ${equipped
                          ? (item.starter ? 'Equipped' : 'Unequip')
                          : unlocked
                            ? 'Equip'
                            : `Buy (${item.price} 🪙)`}
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
     * 20. UTILITIES, KEYBOARD SUPPORT & MASTER RENDER LOOP
     * -------------------------------------------------------------------------- */
    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('keydown', (e) => {
      if (state.screen === 'game' && state.activeTab === 'minigames' && state.activeMinigame === 'math') {
        if (e.key >= '0' && e.key <= '9') {
          pressMathKey(e.key);
        } else if (e.key === 'Backspace') {
          pressMathKey('back');
        } else if (e.key === 'Enter') {
          pressMathKey('submit');
        } else if (e.key === 'Escape') {
          pressMathKey('clear');
        }
      }
    });

    function render() {
      updateSkyTheme();
      const app = document.getElementById('app');
      if (!app) return;

      if (state.screen === 'menu') {
        app.innerHTML = renderMenuScreen();
      } else if (state.screen === 'creator') {
        app.innerHTML = renderCreatorScreen();
      } else {
        app.innerHTML = renderGameScreen();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      buildStarfield();
      loadProfiles();
      render();
    });
  </script>
</body>
</html>
