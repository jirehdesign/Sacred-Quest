  <style>
    /* Base Desert-Scholastic Aesthetic */
    body {
      background-color: #F7F2E7;
      color: #111C33;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Hebrew RTL Typography */
    .hebrew-text {
      font-family: 'Heebo', sans-serif;
      direction: rtl;
      unicode-bidi: isolate;
      line-height: 1.5;
    }

    .hebrew-display {

    /* ===================================================================== */
    /* CUSTOM EDUCATIONAL MORPHOLOGY & AUDIO ANIMATIONS                      */
    /* ===================================================================== */

    /* 1. Visual Audio Equalizer Bars */
    @keyframes eqWave {
      0%, 100% { transform: scaleY(0.28); }
      50% { transform: scaleY(1); }
    }
    .eq-bar {
      transform-origin: bottom;
      transform: scaleY(0.3);
      transition: background-color 0.2s ease;
    }
    .eq-active .eq-bar {
      background-color: #0E8A96;
      animation: eqWave 0.65s ease-in-out infinite;
    }
    .eq-active .eq-bar:nth-child(1) { animation-delay: 0.0s; }
    .eq-active .eq-bar:nth-child(2) { animation-delay: 0.15s; }
    .eq-active .eq-bar:nth-child(3) { animation-delay: 0.30s; }
    .eq-active .eq-bar:nth-child(4) { animation-delay: 0.10s; }

    /* 2. Card Entrance & Morph Pulse */
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop {
      animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes morphFlip {
      0% { opacity: 0.3; transform: scale(0.92) rotateX(18deg); }
      60% { opacity: 1; transform: scale(1.03) rotateX(0deg); }
      100% { opacity: 1; transform: scale(1) rotateX(0deg); }
    }
    .animate-morph {
      animation: morphFlip 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 3. Prefix Slide-and-Attach (RTL: slides from right to left onto base word) */
    @keyframes prefixSlideRTL {
      0% { opacity: 0; transform: translateX(32px) scale(1.15); }
      70% { opacity: 1; transform: translateX(-3px) scale(1.02); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    .animate-prefix-attach {
      display: inline-block;
      animation: prefixSlideRTL 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 4. Magnetic Article Fusion (He vanishes vs He stays) */
    @keyframes vanishArticle {
      0% { opacity: 1; transform: scale(1) translateY(0); }
      50% { opacity: 0.45; transform: scale(0.75) translateY(-10px); }
      100% { opacity: 0.28; transform: scale(0.65) translateY(-4px); text-decoration: line-through; }

    .animate-vanish-he {

    @keyframes magneticPull {
      0% { letter-spacing: 0.28em; opacity: 0.5; transform: scale(0.94); }
      100% { letter-spacing: 0.01em; opacity: 1; transform: scale(1); }
    }
    .animate-magnetic-fuse {

    @keyframes xrayGlow {

      50% { transform: scale(1.12); box-shadow: 0 0 18px rgba(234, 182, 62, 0.75); }

  <script>
    /**
     * =========================================================================
     * 1. AUDIO & SPEECH SYNTHESIS ENGINE (Web Speech API + Web Audio API)
     * =========================================================================
     */
    const AudioEngine = {
      ctx: null,
      sfxEnabled: true,
      speechRate: 1.0, // 1.0 or 0.75
      speakingTimer: null,
      hasHebrewVoice: null,

      initAudioContext() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },

      playTone(freq, type = 'sine', duration = 0.14, delay = 0, gainVal = 0.11) {
        if (!this.sfxEnabled) return;
        try {
          this.initAudioContext();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);

          gain.gain.setValueAtTime(0.001, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(gainVal, this.ctx.currentTime + delay + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + delay + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + duration + 0.02);
        } catch (e) {
          // Safe fallback if blocked
        }
      },

      pop() {
        this.playTone(540, 'triangle', 0.07, 0, 0.08);
      },

      chime(streak = 1) {
        const boost = Math.min(streak * 20, 140);
        this.playTone(523.25 + boost, 'sine', 0.14, 0, 0.12);
        this.playTone(659.25 + boost, 'sine', 0.20, 0.09, 0.13);
      },

      wrong() {
        this.playTone(235, 'sawtooth', 0.15, 0, 0.07);
        this.playTone(190, 'sawtooth', 0.20, 0.10, 0.07);
      },

      fanfare() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => this.playTone(n, 'triangle', 0.24, idx * 0.1, 0.13));
      },

      setEqualizerActive(active) {
        const eq = document.getElementById('audioEqualizer');
        if (!eq) return;
        if (active) {
          eq.classList.add('eq-active');
        } else {
          eq.classList.remove('eq-active');
        }
      },

      detectHebrewVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        const heVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('he'));
        this.hasHebrewVoice = Boolean(heVoice);
        const statusEl = document.getElementById('ttsStatusLabel');
        if (statusEl) {
          statusEl.textContent = heVoice
            ? `🔊 Hebrew Voice Active (${heVoice.name.split(' ')[0]})`
            : '🔊 Visual Audio Guide Active (he-IL)';
        }
        return heVoice || null;
      },

      speakHebrew(rawText, onDone = null) {
        if (!rawText) return;
        const cleanText = rawText.replace(/[\u0591-\u05C7]/g, '').replace(/[־•.]/g, ' ').trim();

        // Always trigger visual equalizer animation
        clearTimeout(this.speakingTimer);
        this.setEqualizerActive(true);

        const simulatedDuration = Math.max(750, cleanText.length * (this.speechRate < 1 ? 115 : 85));

        if (!('speechSynthesis' in window)) {
          this.speakingTimer = setTimeout(() => {
            this.setEqualizerActive(false);
            if (onDone) onDone();
          }, simulatedDuration);
          return;
        }

        try {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = 'he-IL';
          utterance.rate = this.speechRate;

          const heVoice = this.detectHebrewVoice();
          if (heVoice) utterance.voice = heVoice;

          let finished = false;
          const finishSpeech = () => {
            if (finished) return;
            finished = true;
            clearTimeout(this.speakingTimer);
            this.setEqualizerActive(false);
            if (onDone) onDone();
          };

          utterance.onend = finishSpeech;
          utterance.onerror = () => {
            // Graceful fallback visual pulse even if browser has no local he-IL TTS pack
            this.speakingTimer = setTimeout(finishSpeech, simulatedDuration);
          };

          // Safety timeout in case onend does not fire on certain mobile browsers
          this.speakingTimer = setTimeout(finishSpeech, simulatedDuration + 1200);
          window.speechSynthesis.speak(utterance);
        } catch (e) {
          this.speakingTimer = setTimeout(() => {
            this.setEqualizerActive(false);
            if (onDone) onDone();
          }, simulatedDuration);
        }
      },

      speakSequence(textArray) {
        if (!textArray || !textArray.length) return;
        let idx = 0;
        const next = () => {
          if (idx >= textArray.length) return;
          const item = textArray[idx++];
          this.speakHebrew(item, () => {
            setTimeout(next, 240);
          });
        };
        next();
      }
    };

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => AudioEngine.detectHebrewVoice();
    }

    /**
     * =========================================================================
     * 2. TRAINING MODULES CURRICULUM DATA (MODULES 1, 2, AND 3)
     * =========================================================================
     */
    const MODULES_DATA = {
      mod1: {
        id: 'mod1',
        num: '01',
        title: 'Plurals & Adjectives',
        heTitle: 'רַבִּים וּתְאָרִים',
        color: 'coral',
        steps: [
          {
            title: 'Step 1: Gender & Number Agreement',
            badge: 'Core Principle',
            intro: 'In Hebrew, adjectives always follow the noun and must agree in both <strong>Gender</strong> (Masculine / Feminine) and <strong>Number</strong> (Singular / Plural). Toggle between Singular and Plural below to see and hear the suffixes lock into place!',
            pairs: [
              {
                gender: 'Masculine (זָכָר)',
                singNoun: { nikud: 'יֶלֶד', plain: 'ילד', tr: 'yeled', stem: 'יֶלֶד', suffix: '' },
                singAdj:  { nikud: 'טוֹב', plain: 'טוב', tr: 'tov', stem: 'טוֹב', suffix: '' },
                plurNoun: { nikud: 'יְלָדִים', plain: 'ילדים', tr: 'yeladim', stem: 'יְלָד', suffix: 'ִים' },
                plurAdj:  { nikud: 'טוֹבִים', plain: 'טובים', tr: 'tovim', stem: 'טוֹב', suffix: 'ִים' },
                english: 'a good boy → good boys'
              },
              {
                gender: 'Feminine (נְקֵבָה)',
                singNoun: { nikud: 'יַלְדָּה', plain: 'ילדה', tr: 'yalda', stem: 'יַלְדּ', suffix: 'ָה' },
                singAdj:  { nikud: 'טוֹבָה', plain: 'טובה', tr: 'tova', stem: 'טוֹב', suffix: 'ָה' },
                plurNoun: { nikud: 'יְלָדוֹת', plain: 'ילדות', tr: 'yeladot', stem: 'יְלָד', suffix: 'וֹת' },
                plurAdj:  { nikud: 'טוֹבוֹת', plain: 'טובות', tr: 'tovot', stem: 'טוֹב', suffix: 'וֹת' },
                english: 'a good girl → good girls'
              },
              {
                gender: 'Masculine (זָכָר)',
                singNoun: { nikud: 'סֵפֶר', plain: 'ספר', tr: 'sefer', stem: 'סֵפֶר', suffix: '' },
                singAdj:  { nikud: 'חָדָשׁ', plain: 'חדש', tr: 'khadash', stem: 'חָדָשׁ', suffix: '' },
                plurNoun: { nikud: 'סְפָרִים', plain: 'ספרים', tr: 'sfarim', stem: 'סְפָר', suffix: 'ִים' },
                plurAdj:  { nikud: 'חֲדָשִׁים', plain: 'חדשים', tr: 'khadashim', stem: 'חֲדָשׁ', suffix: 'ִים' },
                english: 'a new book → new books'

      init() {
        this.loadState();
        AudioEngine.detectHebrewVoice();
        this.updateControlsUI();
        this.render();
      },

      loadState() {
        try {
          const raw = localStorage.getItem(this.STORAGE_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            this.state.xp = p.xp || 0;
            this.state.streak = p.streak || 0;
            this.state.completedModules = p.completedModules || {};
            this.state.arenaStars = p.arenaStars || {};
            if (typeof p.showNikud === 'boolean') this.state.showNikud = p.showNikud;
            if (typeof p.showTranslit === 'boolean') this.state.showTranslit = p.showTranslit;
          }
        } catch (e) {}
      },

      saveState() {
        try {
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify({
            xp: this.state.xp,
            streak: this.state.streak,
            completedModules: this.state.completedModules,
            arenaStars: this.state.arenaStars,
            showNikud: this.state.showNikud,
            showTranslit: this.state.showTranslit
          }));
        } catch (e) {}
      },

      getLevel() {
        return Math.floor(this.state.xp / 150) + 1;
      },

      hebText(obj) {
        if (!obj) return '';
        if (typeof obj === 'string') {
          return this.state.showNikud ? obj : obj.replace(/[\u0591-\u05C7]/g, '');
        }
        return this.state.showNikud ? obj.nikud : obj.plain;
      },

      speakBtn(obj, label = '') {
        const text = typeof obj === 'string' ? obj : (obj.plain || obj.nikud);
        const safe = text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        return `
          <button type="button" onclick="event.stopPropagation(); AudioEngine.speakHebrew('${safe}')"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-turquoise-100 hover:bg-turquoise-400/30 text-indigo-900 border border-turquoise-500/40 text-xs sm:text-sm font-bold transition-all cursor-pointer shrink-0"
            title="Listen to Hebrew pronunciation">
            <span>🔊</span>
            ${label ? `<span>${label}</span>` : ''}
          </button>
        `;
      },

       * Global Controls Handlers

      toggleNikud() {
        AudioEngine.pop();
        this.state.showNikud = !this.state.showNikud;
        this.saveState();
        this.updateControlsUI();
        this.render();

        const nikudBtn = document.getElementById('toggleNikudBtn');

        if (this.state.showNikud) {
          nikudBtn.className = 'px-2.5 py-1.5 rounded-xl border border-indigo-800 bg-indigo-800 text-parchment-50 text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition-all cursor-pointer';

          nikudBtn.className = 'px-2.5 py-1.5 rounded-xl border border-parchment-300 bg-white text-indigo-900 hover:bg-parchment-100 text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition-all cursor-pointer';
          nikudBadge.className = 'px-1.5 py-0.5 rounded-md text-[10px] font-bold uppercase bg-parchment-200 text-indigo-700';
          nikudBadge.textContent = 'OFF';
        }

        const trBtn = document.getElementById('toggleTranslitBtn');
        const trBadge = document.getElementById('translitBadge');
        if (this.state.showTranslit) {
          trBtn.className = 'px-2.5 py-1.5 rounded-xl border border-indigo-800 bg-indigo-800 text-parchment-50 text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition-all cursor-pointer';
          trBadge.className = 'px-1.5 py-0.5 rounded-md text-[10px] font-bold uppercase bg-gold-400 text-indigo-900';
          trBadge.textContent = 'ON';
        } else {
          trBtn.className = 'px-2.5 py-1.5 rounded-xl border border-parchment-300 bg-white text-indigo-900 hover:bg-parchment-100 text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition-all cursor-pointer';
          trBadge.className = 'px-1.5 py-0.5 rounded-md text-[10px] font-bold uppercase bg-parchment-200 text-indigo-700';
          trBadge.textContent = 'OFF';
        }

        document.getElementById('speedBadge').textContent = AudioEngine.speechRate === 1.0 ? '1.0x' : '0.75x';

        document.getElementById('modulesCountDisplay').textContent = `${modDoneCount}/3`;

      goHome() {
        AudioEngine.pop();
        this.state.view = 'hub';
        this.render();
      },

      showToast(msg) {
        const old = document.getElementById('toastBox');
        if (old) old.remove();
        const div = document.createElement('div');
        div.id = 'toastBox';
        div.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-indigo-900 text-parchment-50 px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-semibold animate-pop';
        div.textContent = msg;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 2600);
      },

      openResetModal() {
        AudioEngine.pop();
        const m = document.getElementById('resetModal');
        m.classList.remove('hidden');
        m.classList.add('flex');
      },

      closeResetModal() {
        const m = document.getElementById('resetModal');
        m.classList.add('hidden');
        m.classList.remove('flex');
      },

        this.state.xp = 0;
        this.state.streak = 0;
        this.state.completedModules = {};
        this.state.arenaStars = {};
        this.saveState();
        this.closeResetModal();
        this.updateControlsUI();
        this.goHome();
        this.showToast('All progress has been reset.');

        this.updateControlsUI();
        this.goHome();

        AudioEngine.speakHebrew(p.shel.plain);

      answerMiniCheck(stepIdx, qIdx, optIdx) {
        const mod = MODULES_DATA[this.state.activeModId];
        const mc = mod.steps[stepIdx].miniChecks[qIdx];
        const correct = optIdx === mc.correctIdx;
        const key = `${stepIdx}_${qIdx}`;
        const firstTimeCorrect = correct && (!this.state.modMiniAnswers[key] || !this.state.modMiniAnswers[key].correct);

        this.state.modMiniAnswers[key] = { selectedIdx: optIdx, correct };

        if (correct) {
          AudioEngine.chime(1);
          if (firstTimeCorrect) {
            this.state.xp += 10;
            this.saveState();
            this.updateControlsUI();
          }
          AudioEngine.speakHebrew(mc.options[mc.correctIdx].plain);
        } else {
          AudioEngine.wrong();
        }
        this.render();
      },

      /**
       * =====================================================================
       * 7. PRACTICE ARENAS ENGINE (4 INTERACTIVE ARENAS)
       * =====================================================================
       */
      shuffle(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      },

      startArena(arenaId) {
        AudioEngine.pop();
        let questions = [];
        if (arenaId === 'arena1') {
          questions = this.shuffle(ARENA_1_DATA).map(item => ({
            qType: 'a1',
            item,
            nounChoices: this.shuffle(item.nounChoices),
            adjChoices: this.shuffle(item.adjChoices)
          }));
        } else if (arenaId === 'arena2') {
          questions = this.shuffle(ARENA_2_DATA).map(item => ({
            qType: 'a2',
            item,
            choices: this.shuffle(item.choices)
          }));
        } else if (arenaId === 'arena3') {
          questions = this.shuffle(ARENA_3_DATA).map(item => ({
            qType: 'a3',
            item,
            bank: item.bank ? this.shuffle(item.bank) : null,
            choices: item.choices ? this.shuffle(item.choices) : null
          }));
        } else if (arenaId === 'arena4') {
          questions = this.shuffle(ARENA_4_DATA).map(item => ({
            qType: 'a4',
            item: {
              ...item,
              tokens: item.tokens.map(t => t.type === 'slot' ? { ...t, shuffledOptions: this.shuffle(t.options) } : t)
            }
          }));
        }

        this.state.view = 'arena';
        this.state.activeArenaId = arenaId;
        this.state.arenaQuestions = questions;
        this.state.arenaIdx = 0;
        this.state.arenaScore = 0;
        this.state.arenaRoundXP = 0;
        this.resetArenaQuestionState();
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      resetArenaQuestionState() {
        this.state.arenaAnswered = false;
        this.state.arenaLastCorrect = false;
        this.state.arenaSelectedNoun = null;
        this.state.arenaSelectedAdj = null;
        this.state.arenaSelectedChoice = null;
        this.state.arenaRootPick = [];
        this.state.arenaSlotPicks = {};
        this.state.arenaActiveSlot = 0;
      },

      submitArenaAnswer() {
        if (this.state.arenaAnswered) return;
        const q = this.state.arenaQuestions[this.state.arenaIdx];
        let isCorrect = false;
        let resolvedHeb = null;

        if (q.qType === 'a1') {
          if (!this.state.arenaSelectedNoun || !this.state.arenaSelectedAdj) return;
          isCorrect = this.state.arenaSelectedNoun.plain === q.item.plurNoun.plain &&
                      this.state.arenaSelectedAdj.plain === q.item.plurAdj.plain;
          resolvedHeb = {
            nikud: `${q.item.plurNoun.nikud} ${q.item.plurAdj.nikud}`,
            plain: `${q.item.plurNoun.plain} ${q.item.plurAdj.plain}`,
            tr: `${q.item.plurNoun.tr} ${q.item.plurAdj.tr}`
          };
        } else if (q.qType === 'a2') {
          if (!this.state.arenaSelectedChoice) return;
          isCorrect = this.state.arenaSelectedChoice.plain === q.item.answer.plain;
          resolvedHeb = q.item.type === 'fusion'
            ? q.item.answer
            : {
                nikud: `${q.item.before.nikud} ${q.item.answer.nikud} ${q.item.after.nikud}`,
                plain: `${q.item.before.plain} ${q.item.answer.plain} ${q.item.after.plain}`,
                tr: q.item.answer.tr
              };
        } else if (q.qType === 'a3') {
          if (q.item.type === 'extract') {
            if (this.state.arenaRootPick.length !== 3) return;
            isCorrect = q.item.root.every((l, i) => this.state.arenaRootPick[i] === l);
            resolvedHeb = {
              nikud: `${q.item.word.nikud} ← שׁוֹרֶשׁ: ${q.item.root.join(' . ')}`,
              plain: `${q.item.word.plain} ← שורש: ${q.item.root.join(' . ')}`,
              tr: q.item.word.tr
            };
          } else {
            if (!this.state.arenaSelectedChoice) return;
            isCorrect = this.state.arenaSelectedChoice.plain === q.item.answer.plain;
            resolvedHeb = {
              nikud: `${q.item.before.nikud} ${q.item.answer.nikud} ${q.item.after.nikud}`,
              plain: `${q.item.before.plain} ${q.item.answer.plain} ${q.item.after.plain}`,
              tr: q.item.answer.tr
            };
          }
        } else if (q.qType === 'a4') {
          const slots = q.item.tokens.filter(t => t.type === 'slot');
          if (Object.keys(this.state.arenaSlotPicks).length < slots.length) return;
          isCorrect = slots.every((s, idx) => this.state.arenaSlotPicks[idx]?.plain === s.answer.plain);
          resolvedHeb = q.item.full;
        }

        this.state.arenaAnswered = true;
        this.state.arenaLastCorrect = isCorrect;
        q.resolvedHeb = resolvedHeb;

        if (isCorrect) {
          this.state.streak += 1;
          const pts = q.qType === 'a4' ? 35 : 20;
          this.state.xp += pts;
          this.state.arenaRoundXP += pts;
          this.state.arenaScore += 1;
          AudioEngine.chime(this.state.streak);
        } else {
          this.state.streak = 0;
          AudioEngine.wrong();
        }

        this.saveState();
        this.updateControlsUI();
        this.render();
        // Speak the correct Hebrew answer automatically!
        if (resolvedHeb) {
          AudioEngine.speakHebrew(resolvedHeb.plain);
        }
      },

      nextArenaQuestion() {
        AudioEngine.pop();
        if (this.state.arenaIdx + 1 < this.state.arenaQuestions.length) {
          this.state.arenaIdx += 1;
          this.resetArenaQuestionState();
          this.render();

          this.render();
        }

            <div class="space-y-4">
              <div class="bg-indigo-800 text-parchment-50 rounded-2xl p-4 text-center">
                <div class="text-xs font-bold uppercase text-gold-300">Complete the Hebrew Sentence:</div>
                <p class="text-base font-bold mt-1">"${q.item.english}"</p>
              </div>

              <div dir="rtl" class="bg-parchment-100 rounded-2xl p-4 border border-parchment-300 text-center hebrew-text text-xl sm:text-2xl font-extrabold text-indigo-900 leading-loose">
                ${q.item.tokens.map(tok => {
                  if (tok.type === 'static') return `<span class="mx-1">${this.hebText(tok)}</span>`;
                  const idx = sCount++;
                  const chosen = this.state.arenaSlotPicks[idx];
                  const focused = !this.state.arenaAnswered && this.state.arenaActiveSlot === idx;
                  return `
                    <button type="button" ${this.state.arenaAnswered ? 'disabled' : ''} onclick="app.state.arenaActiveSlot=${idx}; app.render();"
                      class="inline-block mx-1 px-3 py-0.5 rounded-xl border-2 cursor-pointer ${
                        focused ? 'border-coral-500 bg-coral-100 text-indigo-900' : chosen ? 'border-indigo-800 bg-indigo-800 text-white' : 'border-dashed border-indigo-800/50 bg-white text-indigo-700/50'
                      }">
                      ${chosen ? this.hebText(chosen) : `[${idx + 1}]`}
                    </button>
                  `;
                }).join('')}
              </div>

              ${!this.state.arenaAnswered ? `
                <div class="space-y-2">
                  <div class="text-xs font-extrabold uppercase text-indigo-800">
                    Slot ${this.state.arenaActiveSlot + 1} of ${slots.length}: <span class="text-coral-600">${activeSlot.label}</span>
                  </div>
                  <div dir="rtl" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    ${activeSlot.shuffledOptions.map((opt, oIdx) => {
                      const sel = this.state.arenaSlotPicks[this.state.arenaActiveSlot]?.plain === opt.plain;
                      return `
                        <button type="button" onclick="app.pickArenaSlot(${this.state.arenaActiveSlot}, ${oIdx})"
                          class="tile-btn p-3 rounded-xl border-2 text-center cursor-pointer ${sel ? 'tile-selected' : 'bg-white border-parchment-300 text-indigo-900'}">
                          <span class="hebrew-text text-lg font-extrabold block">${this.hebText(opt)}</span>
                          ${this.state.showTranslit ? `<span class="text-[11px] opacity-80 block" dir="ltr">${opt.tr}</span>` : ''}
                        </button>
                      `;
                    }).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          `;
        }

        return `
          <div class="max-w-3xl mx-auto space-y-5 animate-pop">
            <div class="flex items-center gap-3">
              <button onclick="app.goHome()" class="px-3 py-2 rounded-xl bg-white border border-parchment-300 hover:bg-parchment-100 text-xs sm:text-sm font-bold text-indigo-900 cursor-pointer shrink-0">
                ← Hub
              </button>
              <div class="flex-grow">
                <div class="flex justify-between text-xs font-bold text-indigo-900 mb-1">
                  <span>${titles[this.state.activeArenaId]}</span>
                  <span>Question ${this.state.arenaIdx + 1} / ${this.state.arenaQuestions.length}</span>
                </div>
                <div class="w-full h-3 bg-parchment-200 rounded-full overflow-hidden">
                  <div class="h-full bg-turquoise-500 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
                </div>
              </div>
            </div>

            <div class="bg-white rounded-3xl border-2 border-parchment-300 p-5 sm:p-7 shadow-sm space-y-5">
              ${bodyHtml}

              ${!this.state.arenaAnswered ? `
                <button type="button" ${canSubmit ? '' : 'disabled'} onclick="app.submitArenaAnswer()"
                  class="w-full py-3.5 px-6 rounded-2xl font-extrabold text-base transition-all ${
                    canSubmit ? 'bg-coral-500 hover:bg-coral-600 text-white shadow-md cursor-pointer' : 'bg-parchment-200 text-indigo-700/40 cursor-not-allowed'
                  }">
                  Check Answer
                </button>
              ` : ''}
            </div>

            ${this.state.arenaAnswered ? `
              <div class="rounded-3xl border-2 p-5 shadow-md animate-pop space-y-3 ${
                this.state.arenaLastCorrect ? 'bg-turquoise-100/90 border-turquoise-500' : 'bg-coral-100/95 border-coral-500 animate-shake'
              }">
                <div class="flex items-center justify-between gap-2">
                  <h4 class="font-extrabold text-lg ${this.state.arenaLastCorrect ? 'text-turquoise-600' : 'text-coral-600'}">
                    ${this.state.arenaLastCorrect ? '✅ Excellent! נָכוֹן מְאוֹד!' : '💡 Review the Grammar Rule'}
                  </h4>
                  ${this.speakBtn(q.resolvedHeb, 'Hear Answer')}
                </div>
                <div class="bg-white/90 rounded-xl p-3 text-center hebrew-text text-xl font-extrabold text-indigo-900">
                  ${this.hebText(q.resolvedHeb)}
                </div>
                <p class="text-sm text-indigo-900 bg-white/70 rounded-xl p-3">${q.item.insight}</p>
                <button type="button" onclick="app.nextArenaQuestion()"
                  class="w-full py-3 px-5 rounded-2xl bg-indigo-800 hover:bg-indigo-700 text-white font-extrabold text-base cursor-pointer">
                  ${this.state.arenaIdx + 1 < this.state.arenaQuestions.length ? 'Next Question →' : 'View Arena Results →'}
                </button>
              </div>
            ` : ''}
          </div>
        `;
      },

      pickArenaNoun(idx) {
        AudioEngine.pop();
        this.state.arenaSelectedNoun = this.state.arenaQuestions[this.state.arenaIdx].nounChoices[idx];
        this.render();
      },

      pickArenaAdj(idx) {
        AudioEngine.pop();
        this.state.arenaSelectedAdj = this.state.arenaQuestions[this.state.arenaIdx].adjChoices[idx];
        this.render();
      },

      pickArenaChoice(idx) {
        AudioEngine.pop();
        this.state.arenaSelectedChoice = this.state.arenaQuestions[this.state.arenaIdx].choices[idx];
        this.render();
      },

      pickArenaRootLetter(letter) {
        if (this.state.arenaRootPick.length >= 3) return;
        AudioEngine.pop();
        this.state.arenaRootPick.push(letter);
        this.render();
      },

      pickArenaSlot(sIdx, oIdx) {
        AudioEngine.pop();
        const slots = this.state.arenaQuestions[this.state.arenaIdx].item.tokens.filter(t => t.type === 'slot');
        this.state.arenaSlotPicks[sIdx] = slots[sIdx].shuffledOptions[oIdx];
        const nextUnfilled = slots.findIndex((_, idx) => !this.state.arenaSlotPicks[idx]);
        if (nextUnfilled !== -1) this.state.arenaActiveSlot = nextUnfilled;
        this.render();
      },

      renderArenaSummaryView() {
        const total = this.state.arenaQuestions.length;
        const starred = Boolean(this.state.arenaStars[this.state.activeArenaId]);
        return `
          <div class="max-w-2xl mx-auto bg-white rounded-3xl border-2 border-parchment-300 p-6 sm:p-8 text-center shadow-sm space-y-5 animate-pop">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gold-100 border-2 border-gold-400 flex items-center justify-center text-3xl">
              ${starred ? '⭐' : '🌟'}
            </div>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-indigo-900">
              ${starred ? 'Arena Star Unlocked! כָּל הַכָּבוֹד!' : 'Arena Complete! Keep Practicing!'}
            </h2>
            <div class="grid grid-cols-2 gap-3 max-w-sm mx-auto">
              <div class="bg-parchment-100 rounded-2xl p-3 border border-parchment-300">
                <div class="text-2xl font-extrabold text-indigo-900">${this.state.arenaScore}/${total}</div>
                <div class="text-xs font-semibold text-indigo-700">Correct Answers</div>
              </div>
              <div class="bg-parchment-100 rounded-2xl p-3 border border-parchment-300">
                <div class="text-2xl font-extrabold text-coral-600">+${this.state.arenaRoundXP}</div>
                <div class="text-xs font-semibold text-indigo-700">XP Earned</div>
              </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 pt-2">
              <button onclick="app.startArena('${this.state.activeArenaId}')"
                class="flex-1 py-3 px-5 rounded-2xl bg-coral-500 hover:bg-coral-600 text-white font-extrabold cursor-pointer">
                Play Arena Again ↻
              </button>
              <button onclick="app.goHome()"
                class="flex-1 py-3 px-5 rounded-2xl bg-indigo-800 hover:bg-indigo-700 text-parchment-50 font-extrabold cursor-pointer">
                Back to Hub
              </button>
            </div>
          </div>
        `;
      },

      render() {
        const main = document.getElementById('appMain');
        if (this.state.view === 'hub') main.innerHTML = this.renderHub();
        else if (this.state.view === 'module') main.innerHTML = this.renderModuleView();
        else if (this.state.view === 'arena') main.innerHTML = this.renderArenaView();
        else if (this.state.view === 'arena_summary') main.innerHTML = this.renderArenaSummaryView();
      }
    };

    window.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
